<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="480" rx="12" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Table Grid Lines -->
  <!-- Vertical Lines -->
  <line x1="60" y1="40" x2="60" y2="440" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="220" y1="40" x2="220" y2="440" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="330" y1="40" x2="330" y2="440" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="440" y1="40" x2="440" y2="440" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="550" y1="40" x2="550" y2="440" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="660" y1="40" x2="660" y2="440" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="770" y1="40" x2="770" y2="440" stroke="#cccccc" stroke-width="1.5"/>

  <!-- Horizontal Lines -->
  <line x1="60" y1="40" x2="770" y2="40" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="60" y1="90" x2="770" y2="90" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="60" y1="150" x2="770" y2="150" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="210" x2="770" y2="210" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="270" x2="770" y2="270" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="60" y1="330" x2="770" y2="330" stroke="#cccccc" stroke-width="1.5"/>
  
  <!-- Thick Double Separator for Average -->
  <line x1="60" y1="336" x2="770" y2="336" stroke="#4a5568" stroke-width="2.5"/>
  
  <line x1="60" y1="440" x2="770" y2="440" stroke="#cccccc" stroke-width="1.5"/>

  <!-- Fonts & Text Styles -->
  <g font-family="'Noto Sans KR', sans-serif" font-size="14" fill="#333333" text-anchor="middle">
    
    <!-- Column Headers (Step numbers) -->
    <text x="275" y="70" font-size="16" font-weight="bold">1</text>
    <text x="385" y="70" font-size="16" font-weight="bold">2</text>
    <text x="495" y="70" font-size="16" font-weight="bold">3</text>
    <text x="605" y="70" font-size="16" font-weight="bold">...</text>
    <text x="715" y="70" font-size="16" font-weight="bold">1000</text>

    <!-- Row Headers -->
    <g text-anchor="start" font-weight="bold">
      <text x="80" y="125">1번째 실험</text>
      <text x="80" y="185">2번째 실험</text>
      <text x="80" y="245">...</text>
      <text x="80" y="305">200번째 실험</text>
      <text x="80" y="400" font-size="16" fill="#1a202c">평균</text>
    </g>

    <!-- Data Cells -->
    <!-- Column 1 -->
    <text x="275" y="125">1.0</text>
    <text x="275" y="185">0.0</text>
    <text x="275" y="245">...</text>
    <text x="275" y="305">1.0</text>
    <text x="275" y="400" font-size="16" font-weight="bold" fill="#2d3748">0.493</text>

    <!-- Column 2 -->
    <text x="385" y="125">0.5</text>
    <text x="385" y="185">0.0</text>
    <text x="385" y="245">...</text>
    <text x="385" y="305">1.0</text>
    <text x="385" y="400" font-size="16" font-weight="bold" fill="#2d3748">0.497</text>

    <!-- Column 3 -->
    <text x="495" y="125">0.333</text>
    <text x="495" y="185">0.0</text>
    <text x="495" y="245">...</text>
    <text x="495" y="305">1.0</text>
    <text x="495" y="400" font-size="16" font-weight="bold" fill="#2d3748">0.504</text>

    <!-- Column 4 (...) -->
    <text x="605" y="125">...</text>
    <text x="605" y="185">...</text>
    <text x="605" y="245">...</text>
    <text x="605" y="305">...</text>
    <text x="605" y="400">...</text>

    <!-- Column 5 (1000) -->
    <text x="715" y="125">0.913</text>
    <text x="715" y="185">0.821</text>
    <text x="715" y="245">...</text>
    <text x="715" y="305">0.615</text>
    <text x="715" y="400" font-size="16" font-weight="bold" fill="#2d3748">0.838</text>
  </g>

  <!-- Red Highlight Capsules (Rounded Rectangles) -->
  <!-- Col 1 -->
  <rect x="232" y="98" width="86" height="224" rx="14" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <rect x="232" y="365" width="86" height="55" rx="10" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <path d="M 275,324 L 275,361" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#red-arrow)"/>

  <!-- Col 2 -->
  <rect x="342" y="98" width="86" height="224" rx="14" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <rect x="342" y="365" width="86" height="55" rx="10" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <path d="M 385,324 L 385,361" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#red-arrow)"/>

  <!-- Col 3 -->
  <rect x="452" y="98" width="86" height="224" rx="14" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <rect x="452" y="365" width="86" height="55" rx="10" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <path d="M 495,324 L 495,361" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#red-arrow)"/>

  <!-- Col 5 -->
  <rect x="672" y="98" width="86" height="224" rx="14" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <rect x="672" y="365" width="86" height="55" rx="10" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <path d="M 715,324 L 715,361" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#red-arrow)"/>

  <!-- Definition of Arrowhead Marker -->
  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#e53e3e"/>
    </marker>
  </defs>
</svg>