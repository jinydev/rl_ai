<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .side-box { stroke-width: 2; rx: 8px; filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.03)); }
      .box-left { fill: #e8f0fe; stroke: #1a73e8; }
      .box-right { fill: #e6f4ea; stroke: #1e8e3e; }
      .divider-line { stroke: #ea4335; stroke-width: 8; stroke-linecap: round; }
      .text-title { font-family: 'Outfit', 'Inter', 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 700; fill: #202124; text-anchor: middle; }
      .text-body { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; fill: #3c4043; text-anchor: middle; }
      .text-symbol { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #5f6368; stroke-width: 1.5; fill: none; }
      .marker { fill: #5f6368; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="marker" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Left Side: Event of Interest -->
  <rect x="80" y="45" width="220" height="110" class="side-box box-left" />
  <text x="190" y="80" class="text-symbol" fill="#1a73e8">R = 5</text>
  <text x="190" y="110" class="text-title" fill="#1a73e8">관심 있는 결과 사건</text>
  <text x="190" y="130" class="text-body" fill="#5f6368">예: 보상으로 코인 5개를 얻는다</text>

  <!-- Center Wall: Vertical Bar | -->
  <g transform="translate(390, 0)">
    <line x1="10" y1="35" x2="10" y2="165" class="divider-line" />
    <rect x="-40" y="80" width="100" height="30" rx="4" fill="#ea4335" />
    <text x="10" y="100" class="text-title" fill="#ffffff" font-size="12">~라는 행동을 했을 때</text>
  </g>

  <!-- Right Side: Given Condition -->
  <rect x="500" y="45" width="220" height="110" class="side-box box-right" />
  <text x="610" y="80" class="text-symbol" fill="#1e8e3e">A = a</text>
  <text x="610" y="110" class="text-title" fill="#1e8e3e">에이전트가 선택한 조건</text>
  <text x="610" y="130" class="text-body" fill="#5f6368">예: 슬롯머신 a를 플레이한다</text>

  <!-- Direction Arrow: Given A first, then calculate B -->
  <path d="M 500 100 C 450 100, 350 100, 300 100" class="arrow" marker-end="url(#arrowhead)" />
</svg>
