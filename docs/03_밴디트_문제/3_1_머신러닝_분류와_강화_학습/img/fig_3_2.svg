<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .container-shape { fill: #ffffff; stroke: #202124; stroke-width: 2.5; }
      .card { fill: #f8f9fa; stroke: #dadce0; stroke-width: 1.5; rx: 6px; }
      .text-large { font-family: 'Outfit', 'Inter', 'Noto Sans KR', sans-serif; font-size: 26px; font-weight: bold; fill: #202124; }
      .text-medium { font-family: 'Outfit', 'Inter', 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: bold; fill: #202124; }
      .text-small { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; fill: #5f6368; text-anchor: middle; }
      .arrow { fill: #202124; }
      .cluster-bg { stroke-dasharray: 4; stroke-width: 1.5; fill-opacity: 0.15; }
      .cluster-0 { fill: #4285f4; stroke: #4285f4; }
      .cluster-1 { fill: #f4b400; stroke: #f4b400; }
      .cluster-8 { fill: #0f9d58; stroke: #0f9d58; }
      .dot { stroke: #ffffff; stroke-width: 0.5; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Left: Dataset Cylinder Container -->
  <!-- Bottom Ellipse -->
  <path d="M 60,300 A 90,30 0 0 0 240,300" stroke="#202124" stroke-width="2.5" fill="none" />
  <path d="M 60,120 L 60,300 A 90,30 0 0 0 240,300 L 240,120 Z" fill="#f8f9fa" stroke="#202124" stroke-width="2.5" />
  <!-- Top Ellipse -->
  <ellipse cx="150" cy="120" rx="90" ry="30" class="container-shape" stroke-width="2.5" />
  
  <text x="150" y="70" class="text-medium" text-anchor="middle">데이터셋 (Dataset)</text>
  
  <!-- Digit cards inside container -->
  <!-- Card 0 -->
  <rect x="110" y="140" width="80" height="40" class="card" />
  <text x="150" y="166" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#4285f4" text-anchor="middle">0</text>
  
  <!-- Card 1 -->
  <rect x="110" y="195" width="80" height="40" class="card" />
  <text x="150" y="221" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#f4b400" text-anchor="middle">1</text>
  
  <!-- Card 8 -->
  <rect x="110" y="250" width="80" height="40" class="card" />
  <text x="150" y="276" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#0f9d58" text-anchor="middle">8</text>

  <text x="150" y="365" class="text-medium" text-anchor="middle" font-size="16">정답 레이블이 없는 이미지들</text>

  <!-- Center Arrow -->
  <path d="M 290,200 L 370,200 L 370,185 L 410,210 L 370,235 L 370,220 L 290,220 Z" class="arrow" />
  <text x="345" y="165" class="text-small" font-weight="bold">비지도 학습</text>
  <text x="345" y="260" class="text-small" font-weight="bold" fill="#1a73e8">t-SNE 차원 축소</text>

  <!-- Right: t-SNE Clusters -->
  <rect x="460" y="60" width="300" height="280" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="2" />
  <text x="610" y="45" class="text-medium" text-anchor="middle">2차원 특징 공간 (t-SNE 결과)</text>

  <!-- Cluster 0 (Blue) -->
  <circle cx="530" cy="150" r="50" class="cluster-bg cluster-0" />
  <text x="530" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4285f4" text-anchor="middle">"0" 군집</text>
  <circle cx="510" cy="130" r="6" fill="#4285f4" class="dot" />
  <circle cx="550" cy="140" r="6" fill="#4285f4" class="dot" />
  <circle cx="525" cy="165" r="6" fill="#4285f4" class="dot" />
  <circle cx="500" cy="160" r="6" fill="#4285f4" class="dot" />
  <circle cx="540" cy="120" r="6" fill="#4285f4" class="dot" />

  <!-- Cluster 1 (Yellow) -->
  <circle cx="690" cy="140" r="45" class="cluster-bg cluster-1" />
  <text x="690" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b06000" text-anchor="middle">"1" 군집</text>
  <circle cx="670" cy="120" r="6" fill="#f4b400" class="dot" />
  <circle cx="710" cy="130" r="6" fill="#f4b400" class="dot" />
  <circle cx="690" cy="160" r="6" fill="#f4b400" class="dot" />
  <circle cx="680" cy="145" r="6" fill="#f4b400" class="dot" />

  <!-- Cluster 8 (Green) -->
  <circle cx="610" cy="250" r="55" class="cluster-bg cluster-8" />
  <text x="610" y="255" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f9d58" text-anchor="middle">"8" 군집</text>
  <circle cx="580" cy="240" r="6" fill="#0f9d58" class="dot" />
  <circle cx="630" cy="230" r="6" fill="#0f9d58" class="dot" />
  <circle cx="600" cy="275" r="6" fill="#0f9d58" class="dot" />
  <circle cx="625" cy="265" r="6" fill="#0f9d58" class="dot" />
  <circle cx="590" cy="220" r="6" fill="#0f9d58" class="dot" />
  <circle cx="635" cy="210" r="6" fill="#0f9d58" class="dot" />

  <text x="610" y="375" class="text-medium" text-anchor="middle" font-size="16">유사한 특징끼리 스스로 묶임</text>
</svg>
