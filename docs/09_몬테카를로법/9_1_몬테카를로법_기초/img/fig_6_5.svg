<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    
    <!-- White Die (1) -->
    <g id="die1">
      <rect x="0" y="0" width="30" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="15" cy="15" r="3.5" fill="#ef4444"/> <!-- Red dot for 1 -->
    </g>

    <!-- White Die (3) -->
    <g id="die3">
      <rect x="0" y="0" width="30" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="7" cy="7" r="2.5" fill="#2d3748"/>
      <circle cx="15" cy="15" r="2.5" fill="#2d3748"/>
      <circle cx="23" cy="23" r="2.5" fill="#2d3748"/>
    </g>

    <!-- White Die (5) -->
    <g id="die5">
      <rect x="0" y="0" width="30" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="7" cy="7" r="2.5" fill="#2d3748"/>
      <circle cx="23" cy="7" r="2.5" fill="#2d3748"/>
      <circle cx="15" cy="15" r="2.5" fill="#2d3748"/>
      <circle cx="7" cy="23" r="2.5" fill="#2d3748"/>
      <circle cx="23" cy="23" r="2.5" fill="#2d3748"/>
    </g>
    
    <!-- Cartoon Agent Icon -->
    <g id="mini-agent">
      <rect x="0" y="0" width="28" height="24" rx="8" ry="8" fill="#a0ecff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="8" cy="8" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="20" cy="8" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="7" cy="8" r="2" fill="#2d3748"/>
      <circle cx="19" cy="8" r="2" fill="#2d3748"/>
      <path d="M 11 16 Q 14 19 17 16" fill="none" stroke="#2d3748" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 4 24 C 4 23, 8 23, 8 24 C 8 25, 7 26, 5 26 C 2 26, 4 24, 4 24 Z" fill="#2d3748"/>
      <path d="M 20 24 C 20 23, 24 23, 24 24 C 24 25, 23 26, 21 26 C 18 26, 20 24, 20 24 Z" fill="#2d3748"/>
    </g>
  </defs>
  <!-- Agent Trajectory column on the left -->
  <g transform="translate(30, 0)">
    <!-- Node 1: state s -->
    <circle cx="40" cy="50" r="14" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
    <text x="40" y="55" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#2d3748" text-anchor="middle">s</text>

    <!-- Speech bubble -->
    <rect x="85" y="15" width="80" height="42" rx="10" ry="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
    <path d="M 85 36 L 73 40 L 85 44 Z" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
    <line x1="85" y1="37" x2="85" y2="43" stroke="#ffffff" stroke-width="2"/> <!-- clean boundary -->
    <use href="#mini-agent" x="92" y="24"/>
    <text x="148" y="44" font-family="Cambria Math, Georgia, serif" font-size="20" fill="#2d3748">π</text>

    <!-- Line to Action 1 -->
    <line x1="40" y1="64" x2="40" y2="95" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    
    <!-- Action 1 dot -->
    <circle cx="40" cy="102" r="5.5" fill="#2d3748"/>
    
    <!-- Dotted line to reward text -->
    <line x1="48" y1="108" x2="85" y2="135" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3"/>
    <rect x="52" y="102" width="22" height="18" rx="9" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1"/>
    <text x="63" y="115" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1</text>
    <text x="95" y="142" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d3748">보상</text>

    <!-- Line to State 2 -->
    <line x1="40" y1="108" x2="40" y2="136" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="40" cy="150" r="14" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>

    <!-- Line to Action 2 -->
    <line x1="40" y1="164" x2="40" y2="195" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    
    <!-- Action 2 dot -->
    <circle cx="40" cy="202" r="5.5" fill="#2d3748"/>
    <rect x="52" y="202" width="22" height="18" rx="9" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1"/>
    <text x="63" y="215" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">0</text>

    <!-- Line to State 3 -->
    <line x1="40" y1="208" x2="40" y2="236" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="40" cy="250" r="14" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>

    <!-- Line to Action 3 -->
    <line x1="40" y1="264" x2="40" y2="295" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Action 3 dot -->
    <circle cx="40" cy="302" r="5.5" fill="#2d3748"/>
    <rect x="52" y="302" width="22" height="18" rx="9" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1"/>
    <text x="63" y="315" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2</text>

    <!-- Line to Terminal Node -->
    <line x1="40" y1="308" x2="40" y2="334" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="28" y="340" width="24" height="24" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
  </g>
</svg>