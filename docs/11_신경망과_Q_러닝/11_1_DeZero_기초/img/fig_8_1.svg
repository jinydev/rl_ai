<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .node-text { font-family: "SF Pro Text", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; fill: #ffffff; }
    </style>
    <marker id="arr-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="720" height="280" fill="#ffffff" rx="16"/>

  <text x="360" y="38" class="title" text-anchor="middle">DeZero의 계산 그래프: Variable과 Function</text>
  <text x="360" y="62" class="sub-title" text-anchor="middle">데이터를 담는 Variable과 연산을 수행하는 Function의 결합</text>

  <g transform="translate(60, 100)" filter="url(#shadow)">
    <!-- Variable x -->
    <rect x="20" y="20" width="130" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="85" y="55" class="node-text" fill="#1d4ed8">x</text>
    <rect x="45" y="0" width="80" height="22" rx="11" fill="#3b82f6"/>
    <text x="85" y="15" class="badge-txt">Variable</text>

    <!-- Arrow x -> f -->
    <path d="M 155 55 L 235 55" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr-main)"/>

    <!-- Function f -->
    <rect x="245" y="15" width="130" height="80" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5"/>
    <text x="310" y="55" class="node-text" fill="#047857">f</text>
    <rect x="270" y="-5" width="80" height="22" rx="11" fill="#10b981"/>
    <text x="310" y="10" class="badge-txt">Function</text>

    <!-- Arrow f -> y -->
    <path d="M 380 55 L 460 55" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr-main)"/>

    <!-- Variable y -->
    <rect x="470" y="20" width="130" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="535" y="55" class="node-text" fill="#1d4ed8">y</text>
    <rect x="495" y="0" width="80" height="22" rx="11" fill="#3b82f6"/>
    <text x="535" y="15" class="badge-txt">Variable</text>
  </g>

  <!-- Math Note -->
  <text x="360" y="235" class="sub-title" text-anchor="middle" font-weight="600" fill="#334155">y = f(x) 형태의 순전파(Forward) 계산이 그래프로 연결됩니다.</text>
</svg>