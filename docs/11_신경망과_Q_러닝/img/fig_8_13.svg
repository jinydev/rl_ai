<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 12px; fill: #64748b; }
      .node-text { font-family: "SF Pro Text", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .badge-txt { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    </style>
    <marker id="arr-nn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <filter id="nn-box" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="880" height="440" fill="#ffffff" rx="16"/>

  <text x="440" y="38" class="main-title" text-anchor="middle">Q 함수를 표현하는 두 가지 신경망 구조</text>

  <!-- Left: Architecture 1 (s, a) -> Q(s, a) -->
  <g transform="translate(60, 75)" filter="url(#nn-box)">
    <rect width="360" height="320" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="180" y="30" class="col-title" text-anchor="middle">구조 1: (상태, 행동) 입력 방식</text>
    <text x="180" y="50" class="desc" text-anchor="middle">상태와 행동을 함께 입력받아 단일 스칼라 출력</text>

    <!-- Inputs -->
    <rect x="25" y="100" width="70" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="120" class="node-text" fill="#1d4ed8">상태 s</text>

    <rect x="25" y="160" width="70" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="60" y="180" class="node-text" fill="#334155">행동 a</text>

    <!-- Arrows into NN -->
    <path d="M 95 120 L 140 140" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-nn)"/>
    <path d="M 95 180 L 140 160" stroke="#64748b" stroke-width="2" marker-end="url(#arr-nn)"/>

    <!-- Neural Network Body -->
    <rect x="145" y="90" width="100" height="120" rx="16" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
    <text x="195" y="145" class="node-text" fill="#4338ca" font-size="16">신경망<tspan x="195" dy="20" font-size="12">(NN)</tspan></text>

    <!-- Arrow to Output -->
    <path d="M 245 150 L 285 150" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr-nn)"/>

    <!-- Output: Single Q value -->
    <rect x="290" y="130" width="55" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="317" y="150" class="node-text" fill="#b91c1c">1.7</text>
    <text x="317" y="185" class="desc" text-anchor="middle">Q(s, a)</text>

    <text x="180" y="275" class="desc" text-anchor="middle" fill="#dc2626">최댓값 max_a 계산 시 모든 행동을 각각 순전파해야 함 (비효율)</text>
  </g>

  <!-- Right: Architecture 2 s -> [Q(s, a1), Q(s, a2), ...] (DQN style) -->
  <g transform="translate(460, 75)" filter="url(#nn-box)">
    <rect width="360" height="320" rx="14" fill="#f8fafc" stroke="#10b981" stroke-width="2"/>
    <rect x="235" y="12" width="110" height="24" rx="12" fill="#10b981"/>
    <text x="290" y="28" class="badge-txt">DQN 표준 구조</text>
    
    <text x="120" y="30" class="col-title" text-anchor="middle">구조 2: 상태 단독 입력 방식</text>
    <text x="180" y="50" class="desc" text-anchor="middle">상태만 입력받아 가능한 모든 행동의 Q값을 동시 출력</text>

    <!-- Input s -->
    <rect x="25" y="130" width="70" height="45" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="152" class="node-text" fill="#1d4ed8">상태 s</text>

    <!-- Arrow into NN -->
    <path d="M 95 152 L 140 152" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-nn)"/>

    <!-- Neural Network Body -->
    <rect x="145" y="90" width="100" height="120" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
    <text x="195" y="145" class="node-text" fill="#047857" font-size="16">신경망<tspan x="195" dy="20" font-size="12">(NN)</tspan></text>

    <!-- Output Multi-Arrows -->
    <path d="M 245 110 L 285 100" stroke="#10b981" stroke-width="2" marker-end="url(#arr-nn)"/>
    <path d="M 245 135 L 285 130" stroke="#10b981" stroke-width="2" marker-end="url(#arr-nn)"/>
    <path d="M 245 165 L 285 160" stroke="#10b981" stroke-width="2" marker-end="url(#arr-nn)"/>
    <path d="M 245 190 L 285 190" stroke="#10b981" stroke-width="2" marker-end="url(#arr-nn)"/>

    <!-- Output Q-vector -->
    <g transform="translate(290, 85)">
      <rect x="0" y="0" width="55" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="27" y="12" class="node-text" font-size="11">0.7 (상)</text>
      <rect x="0" y="30" width="55" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="27" y="42" class="node-text" font-size="11">0.3 (하)</text>
      <rect x="0" y="60" width="55" height="24" rx="4" fill="#fee2e2" stroke="#ef4444"/><text x="27" y="72" class="node-text" font-size="11" fill="#b91c1c">-0.5 (좌)</text>
      <rect x="0" y="90" width="55" height="24" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="2"/><text x="27" y="102" class="node-text" font-size="11" fill="#15803d">1.7 (우)</text>
    </g>

    <text x="180" y="275" class="desc" text-anchor="middle" font-weight="700" fill="#047857">단 1회의 순전파로 모든 Q(s, ·) 획득 및 argmax/max 즉시 산출</text>
  </g>
</svg>