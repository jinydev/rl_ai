<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #475569; }
      .tick { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
    </style>
    <filter id="plot-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="720" height="440" fill="#ffffff" rx="16"/>

  <text x="360" y="38" class="title" text-anchor="middle">노이즈가 포함된 선형 회귀 토이 데이터셋</text>
  <text x="360" y="62" class="desc" text-anchor="middle">y = 2x + 5 에 무작위 노이즈가 더해진 100개의 데이터 샘플</text>

  <!-- Plot Area -->
  <g transform="translate(100, 90)" filter="url(#plot-shadow)">
    <rect width="540" height="280" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Grid lines -->
    <line x1="0" y1="70" x2="540" y2="70" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="140" x2="540" y2="140" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="210" x2="540" y2="210" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="135" y1="0" x2="135" y2="280" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="270" y1="0" x2="270" y2="280" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="405" y1="0" x2="405" y2="280" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Axes -->
    <line x1="0" y1="280" x2="540" y2="280" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="280" stroke="#475569" stroke-width="2"/>

    <!-- Ticks & Labels -->
    <text x="0" y="298" class="tick" text-anchor="middle">0.0</text>
    <text x="135" y="298" class="tick" text-anchor="middle">0.25</text>
    <text x="270" y="298" class="tick" text-anchor="middle">0.5</text>
    <text x="405" y="298" class="tick" text-anchor="middle">0.75</text>
    <text x="540" y="298" class="tick" text-anchor="middle">1.0</text>
    <text x="270" y="325" class="axis-label" text-anchor="middle">입력 x</text>

    <text x="-12" y="284" class="tick" text-anchor="end">4</text>
    <text x="-12" y="214" class="tick" text-anchor="end">5</text>
    <text x="-12" y="144" class="tick" text-anchor="end">6</text>
    <text x="-12" y="74" class="tick" text-anchor="end">7</text>
    <text x="-12" y="10" class="tick" text-anchor="end">8</text>
    <text x="-40" y="140" class="axis-label" text-anchor="middle" transform="rotate(-90, -40, 140)">출력 y</text>

    <!-- Scatter Points (Simulated y = 2x + 5 with noise) -->
    <!-- Points spread from x=0..540, y=240..30 -->
    <g fill="#3b82f6" fill-opacity="0.75" stroke="#1d4ed8" stroke-width="1">
      <circle cx="20" cy="225" r="4.5"/><circle cx="35" cy="210" r="4.5"/><circle cx="50" cy="228" r="4.5"/><circle cx="65" cy="205" r="4.5"/><circle cx="80" cy="195" r="4.5"/>
      <circle cx="95" cy="180" r="4.5"/><circle cx="110" cy="205" r="4.5"/><circle cx="125" cy="175" r="4.5"/><circle cx="140" cy="165" r="4.5"/><circle cx="155" cy="185" r="4.5"/>
      <circle cx="170" cy="160" r="4.5"/><circle cx="185" cy="148" r="4.5"/><circle cx="200" cy="155" r="4.5"/><circle cx="215" cy="138" r="4.5"/><circle cx="230" cy="145" r="4.5"/>
      <circle cx="245" cy="130" r="4.5"/><circle cx="260" cy="140" r="4.5"/><circle cx="275" cy="120" r="4.5"/><circle cx="290" cy="125" r="4.5"/><circle cx="305" cy="110" r="4.5"/>
      <circle cx="320" cy="118" r="4.5"/><circle cx="335" cy="100" r="4.5"/><circle cx="350" cy="108" r="4.5"/><circle cx="365" cy="95" r="4.5"/><circle cx="380" cy="88" r="4.5"/>
      <circle cx="395" cy="98" r="4.5"/><circle cx="410" cy="78" r="4.5"/><circle cx="425" cy="85" r="4.5"/><circle cx="440" cy="65" r="4.5"/><circle cx="455" cy="72" r="4.5"/>
      <circle cx="470" cy="55" r="4.5"/><circle cx="485" cy="62" r="4.5"/><circle cx="500" cy="45" r="4.5"/><circle cx="515" cy="50" r="4.5"/><circle cx="530" cy="35" r="4.5"/>
    </g>
  </g>
</svg>