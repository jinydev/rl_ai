<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .node-text { font-family: "SF Pro Text", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; fill: #ffffff; }
      .grad-text { font-family: "Cambria Math", "Latin Modern Math", serif; font-size: 15px; font-weight: 700; text-anchor: middle; fill: #e11d48; }
    </style>
    <marker id="arr-fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-bwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">역전파(Backward)와 자동 미분</text>
  <text x="380" y="62" class="desc" text-anchor="middle">y.backward() 호출 시 출력에서 입력 방향으로 도함수(grad)가 전파됩니다</text>

  <!-- Forward Flow -->
  <g transform="translate(60, 100)" filter="url(#card-shadow)">
    <!-- Variable x -->
    <rect x="20" y="20" width="140" height="65" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="52" class="node-text" fill="#1d4ed8">x</text>
    <rect x="50" y="4" width="80" height="20" rx="10" fill="#3b82f6"/>
    <text x="90" y="18" class="badge-txt">Variable</text>

    <!-- Forward Arrow x -> A -->
    <path d="M 165 52 L 255 52" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-fwd)"/>
    <text x="210" y="42" class="desc" text-anchor="middle" font-size="11" fill="#3b82f6">순전파</text>

    <!-- Function A -->
    <rect x="265" y="15" width="120" height="75" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="325" y="52" class="node-text" fill="#047857">A (x²)</text>
    <rect x="285" y="2" width="80" height="20" rx="10" fill="#10b981"/>
    <text x="325" y="16" class="badge-txt">Function</text>

    <!-- Forward Arrow A -> y -->
    <path d="M 390 52 L 480 52" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-fwd)"/>
    <text x="435" y="42" class="desc" text-anchor="middle" font-size="11" fill="#3b82f6">순전파</text>

    <!-- Variable y -->
    <rect x="490" y="20" width="140" height="65" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="560" y="52" class="node-text" fill="#1d4ed8">y</text>
    <rect x="520" y="4" width="80" height="20" rx="10" fill="#3b82f6"/>
    <text x="560" y="18" class="badge-txt">Variable</text>
  </g>

  <!-- Backward Flow -->
  <g transform="translate(60, 205)">
    <!-- Backward arrow y -> A -->
    <path d="M 560 10 L 335 10" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr-bwd)"/>
    <text x="450" y="32" class="desc" text-anchor="middle" font-weight="700" fill="#e11d48">역전파 (dy/dy = 1)</text>

    <!-- Backward arrow A -> x -->
    <path d="M 315 10 L 100 10" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr-bwd)"/>
    <text x="210" y="32" class="desc" text-anchor="middle" font-weight="700" fill="#e11d48">역전파 (dy/dx = 2x)</text>

    <!-- Grad values -->
    <rect x="30" y="45" width="120" height="32" rx="16" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="90" y="66" class="grad-text">x.grad = dy/dx</text>

    <rect x="500" y="45" width="120" height="32" rx="16" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="560" y="66" class="grad-text">y.grad = 1.0</text>
  </g>
</svg>