<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa" rx="10" ry="10" />
  
  <!-- Circles/States -->
  <circle cx="100" cy="100" r="35" fill="#ffe0b2" stroke="#fb8c00" stroke-width="3" />
  <text x="100" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">맑음</text>
  
  <circle cx="300" cy="100" r="35" fill="#bbdefb" stroke="#1e88e5" stroke-width="3" />
  <text x="300" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0d47a1" text-anchor="middle">비</text>
  
  <!-- Arrows -->
  <!-- Sunny -> Rainy (top arc) -->
  <path d="M 130 85 Q 200 50 268 82" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <text x="200" y="55" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">0.3</text>

  <!-- Rainy -> Sunny (bottom arc) -->
  <path d="M 270 115 Q 200 150 132 118" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <text x="200" y="155" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">0.4</text>
  
  <!-- Self loops -->
  <!-- Sunny -> Sunny -->
  <path d="M 90 68 C 60 40 120 40 108 62" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <text x="100" y="30" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">0.7</text>

  <!-- Rainy -> Rainy -->
  <path d="M 290 68 C 260 40 320 40 308 62" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <text x="300" y="30" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">0.6</text>

  <!-- Definitions for marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#555" />
    </marker>
  </defs>
</svg>
