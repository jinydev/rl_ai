    <text x="70" y="44" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#2d3748" text-anchor="middle">L1</text>

    <line x1="70" y1="58" x2="70" y2="82" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
