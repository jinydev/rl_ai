    <text x="157" y="234" font-family="sans-serif" font-size="12" fill="#2d3748">Right</text>
    <line x1="145" y1="236" x2="145" y2="274" stroke="#2d3748" stroke-width="1.2" marker-end="url(#arrow)"/>
