    <text x="35" y="234" font-family="sans-serif" font-size="12" fill="#2d3748" text-anchor="end">Left</text>
    <line x1="45" y1="236" x2="45" y2="274" stroke="#2d3748" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="35" y="260" font-family="sans-serif" font-size="11" fill="#2d3748" text-anchor="end">-1</text>
    <circle cx="45" cy="290" r="14" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
    <text x="45" y="294" font-family="sans-serif" font-size="10" font-style="italic" fill="#2d3748" text-anchor="middle">L1</text>
    <line x1="45" y1="304" x2="45" y2="330" stroke="#718096" stroke-width="1.2" stroke-dasharray="2,2"/>

