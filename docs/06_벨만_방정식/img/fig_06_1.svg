    <text x="145" y="294" font-family="sans-serif" font-size="10" font-style="italic" fill="#2d3748" text-anchor="middle">L2</text>
    <line x1="145" y1="304" x2="145" y2="330" stroke="#718096" stroke-width="1.2" stroke-dasharray="2,2"/>

