<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 30 17 C 20 12, 10 22, 15 37 C 18 47, 25 50, 30 47 C 35 50, 42 47, 45 37 C 50 22, 40 12, 30 17 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 30 17 Q 34 8 42 11" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 34 13 Q 41 9 42 16 C 39 18, 36 16, 34 13 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon -->
    <g id="agent">
      <rect x="12" y="17" width="36" height="32" rx="12" ry="12" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="23" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="37" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="21" cy="28" r="3" fill="#2d3748"/>
      <circle cx="35" cy="28" r="3" fill="#2d3748"/>
      <path d="M 27 38 Q 30 41 33 38" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
      <path d="M 28 39 Q 30 44 32 39 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 16 49 C 16 47, 24 47, 24 49 C 24 51, 22 53, 19 53 C 15 53, 16 49, 16 49 Z" fill="#2d3748"/>
      <path d="M 36 49 C 36 47, 44 47, 44 49 C 44 51, 42 53, 39 53 C 35 53, 36 49, 36 49 Z" fill="#2d3748"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
  </defs>
  <!-- Left Side: Bar charts -->
  <!-- Top Bar Chart: pi(a|s) -->
  <g transform="translate(40, 30)">
    <line x1="40" y1="90" x2="160" y2="90" stroke="#2d3748" stroke-width="2" marker-end="url(#axis-arrow)"/>
    <line x1="40" y1="90" x2="40" y2="20" stroke="#2d3748" stroke-width="2"/>
    
    <rect x="60" y="50" width="12" height="40" fill="#3b82f6"/>
    <text x="66" y="105" font-family="sans-serif" font-size="11" fill="#2d3748" text-anchor="middle">a1</text>

    <rect x="95" y="35" width="12" height="55" fill="#3b82f6"/>
    <text x="101" y="105" font-family="sans-serif" font-size="11" fill="#2d3748" text-anchor="middle">a2</text>

    <rect x="130" y="15" width="12" height="75" fill="#3b82f6"/>
    <text x="136" y="105" font-family="sans-serif" font-size="11" fill="#2d3748" text-anchor="middle">a3</text>
    
    <text x="100" y="-5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle">π(a|s)</text>
  </g>

  <!-- Bottom Bar Chart: p(s'|s,a) -->
  <g transform="translate(40, 160)">
    <line x1="40" y1="90" x2="160" y2="90" stroke="#2d3748" stroke-width="2" marker-end="url(#axis-arrow)"/>
    <line x1="40" y1="90" x2="40" y2="20" stroke="#2d3748" stroke-width="2"/>
    
    <rect x="70" y="20" width="14" height="70" fill="#f59e0b"/>
    <text x="77" y="105" font-family="sans-serif" font-size="11" fill="#2d3748" text-anchor="middle">s1</text>

    <rect x="120" y="45" width="14" height="45" fill="#f59e0b"/>
    <text x="127" y="105" font-family="sans-serif" font-size="11" fill="#2d3748" text-anchor="middle">s2</text>
    
    <text x="100" y="-5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">p(s'|s,a)</text>
  </g>

  <!-- Right Side: Backup tree diagram -->
  <g transform="translate(260, 20)">
    <circle cx="150" cy="30" r="16" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <text x="150" y="34" font-family="sans-serif" font-size="13" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">s</text>

    <!-- Branching to action nodes -->
    <path d="M 120 70 A 40 40 0 0 1 180 70" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="100" y="60" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#3b82f6">π(a|s)</text>

    <line x1="138" y1="42" x2="82" y2="88" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="75" cy="95" r="6" fill="#2d3748"/>
    
    <line x1="150" y1="46" x2="150" y2="88" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="150" cy="95" r="6" fill="#2d3748"/>
    <text x="162" y="98" font-family="sans-serif" font-size="13" font-style="italic" fill="#2d3748">a</text>

    <line x1="162" y1="42" x2="218" y2="88" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="225" cy="95" r="6" fill="#2d3748"/>

    <!-- Action branching to states -->
    <path d="M 50 120 A 25 25 0 0 1 100 120" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="35" y="140" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#f59e0b">p(s'|s,a)</text>

    <line x1="75" y1="101" x2="52" y2="152" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="45" cy="165" r="12" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <line x1="75" y1="101" x2="98" y2="152" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="105" cy="165" r="12" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
    <text x="119" y="169" font-family="sans-serif" font-size="13" font-style="italic" fill="#2d3748">s'</text>

    <line x1="150" y1="101" x2="135" y2="152" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="130" cy="165" r="12" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <line x1="150" y1="101" x2="165" y2="152" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="170" cy="165" r="12" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <line x1="225" y1="101" x2="210" y2="152" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="205" cy="165" r="12" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <line x1="225" y1="101" x2="240" y2="152" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="245" cy="165" r="12" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
  </g>
</svg>