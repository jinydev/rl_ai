<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 30 17 C 20 12, 10 22, 15 37 C 18 47, 25 50, 30 47 C 35 50, 42 47, 45 37 C 50 22, 40 12, 30 17 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 30 17 Q 34 8 42 11" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 34 13 Q 41 9 42 16 C 39 18, 36 16, 34 13 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon -->
    <g id="agent">
      <rect x="12" y="17" width="36" height="32" rx="12" ry="12" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="23" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="37" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="21" cy="28" r="3" fill="#2d3748"/>
      <circle cx="35" cy="28" r="3" fill="#2d3748"/>
      <path d="M 27 38 Q 30 41 33 38" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
      <path d="M 28 39 Q 30 44 32 39 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 16 49 C 16 47, 24 47, 24 49 C 24 51, 22 53, 19 53 C 15 53, 16 49, 16 49 Z" fill="#2d3748"/>
      <path d="M 36 49 C 36 47, 44 47, 44 49 C 44 51, 42 53, 39 53 C 35 53, 36 49, 36 49 Z" fill="#2d3748"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
  </defs>
  <!-- Main Equation: v_pi(s) = E_pi[R_t | S_t = s] + gamma E_pi[G_t+1 | S_t = s] -->
  <g font-family="Cambria Math, Georgia, serif" font-size="22" fill="#2d3748">
    <text x="60" y="50" font-style="italic">v</text>
    <text x="72" y="56" font-size="14" font-style="italic">π</text>
    <text x="83" y="50">(s) = 𝔼</text>
    <text x="135" y="56" font-size="13" font-style="italic">π</text>
    <text x="146" y="50">[R</text>
    <text x="164" y="56" font-size="13" font-style="italic">t</text>
    <text x="171" y="50"> | S</text>
    <text x="201" y="56" font-size="13" font-style="italic">t</text>
    <text x="208" y="50"> = s] + γ 𝔼</text>
    <text x="296" y="56" font-size="13" font-style="italic">π</text>
    <text x="307" y="50">[G</text>
    <text x="325" y="56" font-size="13" font-style="italic">t+1</text>
    <text x="350" y="50"> | S</text>
    <text x="380" y="56" font-size="13" font-style="italic">t</text>
    <text x="387" y="50"> = s]</text>
  </g>

  <!-- Left Expansion Pointer -->
  <!-- Underline under E_pi[R_t|S_t=s] -->
  <line x1="125" y1="58" x2="250" y2="58" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5"/>
  <path d="M 187 64 Q 160 80 130 95" fill="none" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="125" y="112" font-family="sans-serif" font-size="13" fill="#2d3748" font-weight="bold" text-anchor="middle">첫 번째 항 전개</text>

  <!-- Sum Formula at bottom-left -->
  <g transform="translate(10, 125)">
    <text x="10" y="32" font-family="Cambria Math, Georgia, serif" font-size="36" fill="#2d3748">∑</text>
    <text x="8" y="44" font-family="Cambria Math, Georgia, serif" font-size="11" font-style="italic" fill="#2d3748">a, s'</text>
    <text x="45" y="26" font-family="Cambria Math, Georgia, serif" font-size="18" fill="#2d3748">
      π(a|s) p(s'|s, a) r(s, a, s')
    </text>
  </g>

  <!-- Right Expansion Pointer -->
  <!-- Underline under gamma E_pi[G_t+1|S_t=s] -->
  <line x1="280" y1="58" x2="435" y2="58" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5"/>
  <path d="M 357 64 Q 380 80 410 95" fill="none" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="420" y="112" font-family="sans-serif" font-size="13" fill="#2d3748" font-weight="bold" text-anchor="middle">다음은 이쪽 항</text>
</svg>