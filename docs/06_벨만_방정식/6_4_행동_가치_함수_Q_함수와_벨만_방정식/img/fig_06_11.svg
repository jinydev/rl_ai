<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 30 17 C 20 12, 10 22, 15 37 C 18 47, 25 50, 30 47 C 35 50, 42 47, 45 37 C 50 22, 40 12, 30 17 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 30 17 Q 34 8 42 11" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 34 13 Q 41 9 42 16 C 39 18, 36 16, 34 13 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon -->
    <g id="agent">
      <rect x="12" y="17" width="36" height="32" rx="12" ry="12" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="23" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="37" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="21" cy="28" r="3" fill="#2d3748"/>
      <circle cx="35" cy="28" r="3" fill="#2d3748"/>
      <path d="M 27 38 Q 30 41 33 38" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
      <path d="M 28 39 Q 30 44 32 39 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 16 49 C 16 47, 24 47, 24 49 C 24 51, 22 53, 19 53 C 15 53, 16 49, 16 49 Z" fill="#2d3748"/>
      <path d="M 36 49 C 36 47, 44 47, 44 49 C 44 51, 42 53, 39 53 C 35 53, 36 49, 36 49 Z" fill="#2d3748"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Pink Arrow Marker -->
    <marker id="pink-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6"/>
    </marker>
    <!-- Orange Arrow Marker -->
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <!-- Left Side: State Value v(s) -->
  <g transform="translate(10, 10)">
    <text x="120" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">〈상태 가치 함수〉</text>
    
    <!-- Dotted pointer for v_pi(s) -->
    <text x="195" y="32" font-family="Cambria Math, Georgia, serif" font-size="15" fill="#2d3748" text-anchor="middle">
      v<tspan dy="4" font-size="11">π</tspan><tspan dy="-4">(s)</tspan>
    </text>
    <path d="M 175 35 Q 145 42 135 52" fill="none" stroke="#2d3748" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

    <!-- Yellow Highlight Box around s -->
    <rect x="101" y="44" width="38" height="38" rx="10" ry="10" fill="#fef3c7" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Top circle s -->
    <circle cx="120" cy="63" r="14" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <text x="102" y="66" font-family="sans-serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="end">s</text>

    <!-- Branching to action nodes -->
    <line x1="108" y1="73" x2="58" y2="108" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="52" cy="113" r="5" fill="#2d3748"/>

    <line x1="120" y1="77" x2="120" y2="108" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="120" cy="113" r="5" fill="#2d3748"/>

    <line x1="132" y1="73" x2="182" y2="108" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="188" cy="113" r="5" fill="#2d3748"/>

    <!-- Pink circle highlight around left dot -->
    <ellipse cx="52" cy="113" rx="14" ry="11" fill="none" stroke="#f472b6" stroke-width="1.8"/>
    <!-- Policy label pointer -->
    <path d="M 12 78 Q 20 85 40 104" fill="none" stroke="#f472b6" stroke-width="1.2" stroke-linecap="round" marker-end="url(#pink-arrow)"/>
    <text x="25" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">정책 π에</text>
    <text x="25" y="77" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">따라 선택</text>
    
    <!-- Action label -->
    <text x="32" y="117" font-family="sans-serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="middle">a</text>

    <!-- Branching to states -->
    <line x1="52" y1="118" x2="35" y2="154" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="30" cy="165" r="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <line x1="52" y1="118" x2="69" y2="154" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="74" cy="165" r="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <line x1="120" y1="118" x2="105" y2="154" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="100" cy="165" r="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <line x1="120" y1="118" x2="135" y2="154" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="140" cy="165" r="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <line x1="188" y1="118" x2="173" y2="154" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="168" cy="165" r="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <line x1="188" y1="118" x2="205" y2="154" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="210" cy="165" r="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <text x="14" y="169" font-family="sans-serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="middle">s'</text>
  </g>

  <!-- Right Side: Q Value q(s,a) -->
  <g transform="translate(290, 10)">
    <text x="120" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">〈Q 함수〉</text>
    
    <!-- Dotted pointer for q_pi(s,a) -->
    <text x="195" y="32" font-family="Cambria Math, Georgia, serif" font-size="15" fill="#2d3748" text-anchor="middle">
      q<tspan dy="4" font-size="11">π</tspan><tspan dy="-4">(s, a)</tspan>
    </text>
    <path d="M 175 35 Q 145 42 135 52" fill="none" stroke="#2d3748" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

    <!-- Yellow Highlight Box around s and branch and a -->
    <rect x="101" y="44" width="38" height="74" rx="10" ry="10" fill="#fef3c7" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Top circle s -->
    <circle cx="120" cy="63" r="14" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <text x="102" y="66" font-family="sans-serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="end">s</text>

    <!-- Branch down to dot a -->
    <line x1="120" y1="77" x2="120" y2="108" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="120" cy="113" r="6" fill="#2d3748"/>
    
    <!-- Pink oval highlight around dot a -->
    <ellipse cx="120" cy="113" rx="25" ry="13" fill="none" stroke="#f472b6" stroke-width="1.8"/>
    
    <!-- Pink pointer for free choice -->
    <path d="M 70 94 Q 85 94 94 103" fill="none" stroke="#f472b6" stroke-width="1.2" stroke-linecap="round" marker-end="url(#pink-arrow)"/>
    <text x="65" y="76" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">자유롭게</text>
    <text x="65" y="88" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">선택</text>

    <!-- Action label -->
    <text x="88" y="117" font-family="sans-serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="middle">a</text>

    <!-- Branching to states -->
    <line x1="120" y1="119" x2="95" y2="154" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="90" cy="165" r="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <line x1="120" y1="119" x2="145" y2="154" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="150" cy="165" r="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>

    <text x="74" y="169" font-family="sans-serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="middle">s'</text>
  </g>
</svg>