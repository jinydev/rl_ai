<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 1. Current State S_t = s -->
  <g transform="translate(310, 45)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">s</text>
  </g>
  <text x="310" y="15" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">현재 상태 v_π(s)</text>

  <!-- First Level Branches (Policy π) -->
  <line x1="310" y1="69" x2="190" y2="116" stroke="#4b5563" stroke-width="2"/>
  <line x1="310" y1="69" x2="430" y2="116" stroke="#4b5563" stroke-width="2"/>

  <!-- Policy Labels -->
  <text x="230" y="90" font-family="sans-serif" font-size="10" fill="#2563eb" font-weight="bold" text-anchor="middle">π(a_1 | s)</text>
  <text x="390" y="90" font-family="sans-serif" font-size="10" fill="#2563eb" font-weight="bold" text-anchor="middle">π(a_2 | s)</text>

  <!-- Action Nodes -->
  <circle cx="190" cy="118" r="6" fill="#1e293b" stroke="#000" stroke-width="1"/>
  <circle cx="430" cy="118" r="6" fill="#1e293b" stroke="#000" stroke-width="1"/>
  <text x="190" y="135" font-family="sans-serif" font-size="11" fill="#1e293b" font-weight="bold" text-anchor="middle">a_1</text>
  <text x="430" y="135" font-family="sans-serif" font-size="11" fill="#1e293b" font-weight="bold" text-anchor="middle">a_2</text>

  <!-- Second Level Branches (Transitions & Rewards) -->
  <!-- From a_1 -->
  <line x1="190" y1="124" x2="110" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="190" y1="124" x2="270" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- From a_2 -->
  <line x1="430" y1="124" x2="350" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="430" y1="124" x2="510" y2="185" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Transition & Reward Labels -->
  <!-- Left Side -->
  <text x="120" y="155" font-family="sans-serif" font-size="9" fill="#047857" text-anchor="end">p(s_1|s,a_1)</text>
  <text x="120" y="167" font-family="sans-serif" font-size="9" fill="#b45309" text-anchor="end">r(s,a_1,s_1)</text>

  <text x="260" y="155" font-family="sans-serif" font-size="9" fill="#047857" text-anchor="start">p(s_2|s,a_1)</text>
  <text x="260" y="167" font-family="sans-serif" font-size="9" fill="#b45309" text-anchor="start">r(s,a_1,s_2)</text>

  <!-- Right Side -->
  <text x="360" y="155" font-family="sans-serif" font-size="9" fill="#047857" text-anchor="end">p(s_3|s,a_2)</text>
  <text x="360" y="167" font-family="sans-serif" font-size="9" fill="#b45309" text-anchor="end">r(s,a_2,s_3)</text>

  <text x="500" y="155" font-family="sans-serif" font-size="9" fill="#047857" text-anchor="start">p(s_4|s,a_2)</text>
  <text x="500" y="167" font-family="sans-serif" font-size="9" fill="#b45309" text-anchor="start">r(s,a_2,s_4)</text>

  <!-- Next States (s') -->
  <g transform="translate(100, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">s_1</text>
  </g>
  <text x="100" y="232" font-family="sans-serif" font-size="10" fill="#047857" text-anchor="middle">v_π(s_1)</text>

  <g transform="translate(280, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">s_2</text>
  </g>
  <text x="280" y="232" font-family="sans-serif" font-size="10" fill="#047857" text-anchor="middle">v_π(s_2)</text>

  <g transform="translate(340, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">s_3</text>
  </g>
  <text x="340" y="232" font-family="sans-serif" font-size="10" fill="#047857" text-anchor="middle">v_π(s_3)</text>

  <g transform="translate(520, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">s_4</text>
  </g>
  <text x="520" y="232" font-family="sans-serif" font-size="10" fill="#047857" text-anchor="middle">v_π(s_4)</text>

  <!-- Summary Bracket & Formula Map -->
  <path d="M 60 245 H 560" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="310" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">v_π(s) = ∑_a π(a|s) ∑_s' p(s'|s,a) [ r(s,a,s') + γ v_π(s') ]</text>
</svg>
