<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&amp;family=Noto+Sans+KR:wght@400;700&amp;display=swap');
      
      .svg-bg {
        fill: #FAFAFB;
        stroke: #E4E7EC;
        stroke-width: 2;
        rx: 16px;
      }
      
      .title {
        font-family: 'Outfit', 'Noto Sans KR', sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #1D2939;
      }
      
      .sub-title {
        font-family: 'Outfit', 'Noto Sans KR', sans-serif;
        font-size: 12px;
        fill: #667085;
      }
      
      .math-text {
        font-family: 'Outfit', sans-serif;
        font-size: 20px;
        fill: #344054;
      }
      
      .label-text {
        font-family: 'Noto Sans KR', sans-serif;
        font-size: 13px;
      }
      
      /* Animation Sequence via CSS keyframes */
      @keyframes seq-glow-text {
        0%, 100% { fill: #344054; font-weight: normal; }
        5%, 20% { fill: #6366F1; font-weight: bold; }
        25%, 95% { fill: #344054; font-weight: normal; }
      }
      
      @keyframes seq-glow-rect {
        0%, 100% { opacity: 0; }
        5%, 20% { opacity: 1; }
        25%, 95% { opacity: 0; }
      }
      
      @keyframes seq-step2 {
        0%, 20%, 95%, 100% { opacity: 0; transform: translateY(5px); }
        25%, 90% { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes seq-step3 {
        0%, 40%, 95%, 100% { opacity: 0; transform: translateY(5px); }
        45%, 90% { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes seq-step4 {
        0%, 62%, 95%, 100% { opacity: 0; transform: translateY(5px); }
        68%, 90% { opacity: 1; transform: translateY(0); }
      }

      .glow-text {
        animation: seq-glow-text 12s infinite ease-in-out;
      }
      
      .glow-rect {
        animation: seq-glow-rect 12s infinite ease-in-out;
      }
      
      .factor-group {
        animation: seq-step2 12s infinite ease-in-out;
      }
      
      .gnext-group {
        animation: seq-step3 12s infinite ease-in-out;
      }
      
      .final-group {
        animation: seq-step4 12s infinite ease-in-out;
      }
    </style>
  </defs>
  
  <!-- Outer Box -->
  <rect class="svg-bg" width="700" height="380" />
  
  <!-- Header Text -->
  <text x="35" y="40" class="title">식 06.4: 수익 Gt와 Gt+1의 관계 유도</text>
  <text x="35" y="60" class="sub-title">Gt 수식에서 공통인수를 묶어내어 Gt+1로 대치하는 유도 과정</text>
  
  <!-- Step 1: Original G_t Equation -->
  <g>
    <text x="35" y="120" class="math-text">
      G<tspan font-size="13" y="125">t</tspan><tspan font-size="20" y="120"> = R</tspan><tspan font-size="13" y="125">t</tspan><tspan font-size="20" y="120"> + </tspan>
      <tspan class="glow-text">γ R</tspan><tspan font-size="13" y="125" class="glow-text">t+1</tspan><tspan font-size="20" y="120" class="glow-text"> + γ² R</tspan><tspan font-size="13" y="125" class="glow-text">t+2</tspan><tspan font-size="20" y="120" class="glow-text"> + γ³ R</tspan><tspan font-size="13" y="125" class="glow-text">t+3</tspan><tspan font-size="20" y="120" class="glow-text"> + ···</tspan>
    </text>
    <rect x="135" y="94" width="375" height="36" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4 4" rx="6" class="glow-rect" />
  </g>
  
  <!-- Step 2: Factoring out Gamma -->
  <g class="factor-group">
    <text x="35" y="180" class="math-text">
      G<tspan font-size="13" y="185">t</tspan><tspan font-size="20" y="180"> = R</tspan><tspan font-size="13" y="185">t</tspan><tspan font-size="20" y="180"> + </tspan>
      <tspan font-weight="bold" fill="#D97706">γ (</tspan><tspan>R</tspan><tspan font-size="13" y="185">t+1</tspan><tspan font-size="20" y="180"> + γ R</tspan><tspan font-size="13" y="185">t+2</tspan><tspan font-size="20" y="180"> + γ² R</tspan><tspan font-size="13" y="185">t+3</tspan><tspan font-size="20" y="180"> + ···</tspan><tspan font-weight="bold" fill="#D97706">)</tspan>
    </text>
    <text x="495" y="180" class="label-text" fill="#D97706">★ 공통인수 γ(할인율)를 묶어냅니다.</text>
  </g>
  
  <!-- Step 3: Defining G_t+1 -->
  <g class="gnext-group">
    <text x="35" y="240" class="math-text">
      <tspan font-weight="bold" fill="#6366F1">G</tspan><tspan font-size="13" y="245" font-weight="bold" fill="#6366F1">t+1</tspan><tspan font-size="20" y="240" font-weight="bold" fill="#6366F1"> = </tspan>
      <tspan>R</tspan><tspan font-size="13" y="245">t+1</tspan><tspan font-size="20" y="240"> + γ R</tspan><tspan font-size="13" y="245">t+2</tspan><tspan font-size="20" y="240"> + γ² R</tspan><tspan font-size="13" y="245">t+3</tspan><tspan font-size="20" y="240"> + ···</tspan>
    </text>
    <rect x="130" y="214" width="345" height="36" fill="none" stroke="#6366F1" stroke-width="1.5" rx="6" />
    <text x="495" y="240" class="label-text" fill="#6366F1">★ 괄호 안의 식은 식 06.3(Gt+1)과 같습니다.</text>
  </g>
  
  <!-- Step 4: Final Substitution Result -->
  <g class="final-group">
    <rect x="30" y="278" width="260" height="48" fill="#ECFDF5" stroke="#16A34A" stroke-width="2" rx="10" />
    <text x="45" y="310" font-family="sans-serif" font-size="22" font-weight="bold" fill="#16A34A">
      G<tspan font-size="14" y="315">t</tspan><tspan font-size="22" y="310"> = R</tspan><tspan font-size="14" y="315">t</tspan><tspan font-size="22" y="310"> + γ G</tspan><tspan font-size="14" y="315">t+1</tspan>
    </text>
    <text x="310" y="308" class="label-text" fill="#16A34A" font-weight="bold">★ 대입 완료 (식 06.4 최종 도출)</text>
  </g>
</svg>
