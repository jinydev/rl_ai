<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa" rx="15" ry="15"/>
  <style>
    .title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
    .label { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4a5568; }
    .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-style: italic; fill: #1a202c; }
    .math-bold { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 20px; font-weight: bold; fill: #2b6cb0; }
    .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; ry: 8; }
    .slot { fill: #edf2f7; stroke: #cbd5e0; stroke-width: 1.5; rx: 4; ry: 4; }
    .slot-fill { fill: #ebf8ff; stroke: #3182ce; stroke-width: 2; rx: 4; ry: 4; }
    .slot-text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: bold; fill: #2b6cb0; text-anchor: middle; }
    .cross-out { stroke: #e53e3e; stroke-width: 2; }
  </style>

  <text class="title" x="40" y="45">순열 (Permutation, ₙPᵣ)의 개념과 공식 유도</text>
  <text class="label" x="40" y="65">서로 다른 n개 중에서 r개를 택하여 순서대로 나열하는 경우의 수</text>

  <!-- Slots visualization for 5P3 -->
  <g transform="translate(60, 100)">
    <text class="label" x="0" y="-15" font-weight="bold">예시: ₅P₃ (5명 중 3명을 뽑아 순서대로 세우기)</text>
    
    <!-- Slot 1 -->
    <rect class="slot-fill" x="0" y="0" width="80" height="50" />
    <text class="slot-text" x="40" y="30">5가지</text>
    <text class="label" x="40" y="70" text-anchor="middle">1번째 자리</text>

    <!-- Times -->
    <text class="math" x="100" y="32" font-size="20">×</text>

    <!-- Slot 2 -->
    <rect class="slot-fill" x="120" y="0" width="80" height="50" />
    <text class="slot-text" x="160" y="30">4가지</text>
    <text class="label" x="160" y="70" text-anchor="middle">2번째 자리</text>

    <!-- Times -->
    <text class="math" x="220" y="32" font-size="20">×</text>

    <!-- Slot 3 -->
    <rect class="slot-fill" x="240" y="0" width="80" height="50" />
    <text class="slot-text" x="280" y="30">3가지</text>
    <text class="label" x="280" y="70" text-anchor="middle">3번째 자리</text>

    <!-- Result -->
    <text class="math-bold" x="350" y="35">=</text>
    <text class="math-bold" x="380" y="35" font-size="22" fill="#2d3748">5 × 4 × 3 = 60가지</text>
  </g>

  <!-- Formula Derivation -->
  <g transform="translate(60, 220)">
    <rect class="box" x="0" y="0" width="680" height="130" />
    
    <text class="label" x="20" y="30" font-weight="bold">순열 공식 유도 원리</text>
    <text class="math" x="20" y="60">5 × 4 × 3 은 5! 에서 뒷부분(2 × 1)을 잘라낸 것과 같습니다.</text>

    <!-- Fraction visual -->
    <text class="math-bold" x="20" y="105">₅P₃ = </text>
    
    <!-- Numerator -->
    <text class="math" x="90" y="90">5 × 4 × 3 × (2 × 1)</text>
    <!-- Denominator -->
    <text class="math" x="135" y="118">2 × 1</text>
    <!-- Fraction line -->
    <line x1="85" y1="98" x2="225" y2="98" stroke="#1a202c" stroke-width="1.5"/>

    <!-- Red cross outs for 2x1 -->
    <line class="cross-out" x1="165" y1="92" x2="215" y2="82" />
    <line class="cross-out" x1="105" y1="112" x2="165" y2="108" />

    <text class="math-bold" x="240" y="105">=</text>

    <!-- n! / (n-r)! -->
    <text class="math" x="270" y="90">5!</text>
    <text class="math" x="260" y="118">(5 - 3)!</text>
    <line x1="255" y1="98" x2="310" y2="98" stroke="#1a202c" stroke-width="1.5"/>

    <text class="math-bold" x="330" y="105">→ ₙPᵣ = </text>
    <text class="math" x="410" y="90">n!</text>
    <text class="math" x="395" y="118">(n - r)!</text>
    <line x1="390" y1="98" x2="430" y2="98" stroke="#1a202c" stroke-width="1.5"/>
  </g>
</svg>
