<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa" rx="15" ry="15"/>
  <style>
    .title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
    .label { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4a5568; }
    .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-style: italic; fill: #1a202c; }
    .math-bold { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #2b6cb0; }
    .box { fill: #ffffff; stroke: #cbd5e0; stroke-width: 1.5; rx: 8; ry: 8; }
    .door { fill: #fffaf0; stroke: #dd6b20; stroke-width: 2; rx: 4; ry: 4; }
    .door-opened { fill: #edf2f7; stroke: #a0aec0; stroke-width: 1.5; rx: 4; ry: 4; }
  </style>

  <text class="title" x="40" y="45">생활 속의 확률과 직관의 오류 (Misconceptions of Intuition)</text>
  <text class="label" x="40" y="65">우리가 생각하는 주관적 직관과 실제 수학적인 객관적 확률의 차이</text>

  <!-- Left: Monty Hall Problem -->
  <g transform="translate(60, 95)">
    <rect class="box" x="0" y="0" width="320" height="260" />
    <text font-family="Inter" font-size="13" font-weight="bold" fill="#2d3748" x="20" y="30">1. 몬티 홀 딜레마 (Monty Hall)</text>

    <!-- Door 1 -->
    <rect class="door" x="30" y="60" width="60" height="100" />
    <text font-family="Inter" font-size="12" font-weight="bold" x="60" y="110" text-anchor="middle">1번 문</text>
    <text class="math" x="60" y="180" text-anchor="middle">P = 1/3</text>
    <text font-family="Inter" font-size="9" fill="#3182ce" x="60" y="200" text-anchor="middle">[나의 선택]</text>

    <!-- Door 2 -->
    <rect class="door" x="110" y="60" width="60" height="100" stroke="#3182ce" stroke-width="2.5" />
    <text font-family="Inter" font-size="12" font-weight="bold" x="140" y="110" text-anchor="middle">2번 문</text>
    <text class="math" x="140" y="180" text-anchor="middle" font-weight="bold" fill="#3182ce">P = 2/3</text>
    <text font-family="Inter" font-size="9" fill="#e53e3e" x="140" y="200" text-anchor="middle">[바꾸는 것이 유리]</text>

    <!-- Door 3 -->
    <rect class="door-opened" x="190" y="60" width="60" height="100" />
    <text font-family="Inter" font-size="11" x="220" y="100" text-anchor="middle" fill="#a0aec0">3번 문</text>
    <text font-family="Inter" font-size="11" x="220" y="125" text-anchor="middle" fill="#e53e3e" font-weight="bold">염소(꽝)</text>
    <text class="math" x="220" y="180" text-anchor="middle" fill="#a0aec0">P = 0</text>
    <text font-family="Inter" font-size="9" fill="#718096" x="220" y="200" text-anchor="middle">[사회자가 공개]</text>
  </g>

  <!-- Right: Birthday Paradox -->
  <g transform="translate(420, 95)">
    <rect class="box" x="0" y="0" width="320" height="260" />
    <text font-family="Inter" font-size="13" font-weight="bold" fill="#2d3748" x="20" y="30">2. 생일 패러독스 (Birthday Paradox)</text>

    <text class="label" x="20" y="70" font-weight="bold">학급 인원: 20명</text>
    <text class="label" x="20" y="95">Q. 이 중 생일이 같은 사람이 적어도</text>
    <text class="label" x="20" y="115">   1쌍 이상 존재할 확률은 얼마일까요?</text>

    <text class="label" x="20" y="145" fill="#e53e3e">직관적 예상: 1% 미만 (365일 중 20명이므로)</text>
    <text class="label" x="20" y="165" fill="#2b6cb0" font-weight="bold">실제 수학적 확률: 60.6%</text>

    <!-- Formula -->
    <rect x="20" y="190" width="280" height="50" fill="#f7fafc" stroke="#edf2f7" rx="6" ry="6" />
    <text class="math" x="160" y="220" text-anchor="middle">P(X) = 1 - ₃₆₅P₂₀ / 365²⁰ ≈ 60.6%</text>
  </g>
</svg>
