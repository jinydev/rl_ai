<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa" rx="15" ry="15"/>
  <style>
    .title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
    .label { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4a5568; }
    .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-style: italic; fill: #1a202c; }
    .math-bold { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 18px; font-weight: bold; fill: #2b6cb0; }
    .box { fill: #ffffff; stroke: #cbd5e0; stroke-width: 1.5; rx: 8; ry: 8; }
    .space-s { fill: #edf2f7; stroke: #a0aec0; stroke-width: 1.5; rx: 10; ry: 10; }
    .set-a { fill: #ebf8ff; stroke: #3182ce; stroke-width: 2; fill-opacity: 0.6; }
    .set-b { fill: #fff5f5; stroke: #e53e3e; stroke-width: 2; fill-opacity: 0.4; }
    .arrow { stroke: #4a5568; stroke-width: 2; fill: none; }
  </style>

  <text class="title" x="40" y="45">조건부 확률 (Conditional Probability)의 의미</text>
  <text class="label" x="40" y="65">조건 A가 주어지면, 표본공간이 전체 S에서 사건 A로 축소됩니다.</text>

  <!-- Left: Original Sample Space -->
  <g transform="translate(60, 95)">
    <rect class="space-s" x="0" y="0" width="280" height="240" />
    <text font-family="Inter" font-size="12" font-weight="bold" fill="#718096" x="15" y="25">원래의 표본공간 S</text>

    <!-- Set A -->
    <circle class="set-a" cx="110" cy="130" r="60" />
    <text font-family="Inter" font-size="13" font-weight="bold" fill="#2b6cb0" x="80" y="130">사건 A</text>

    <!-- Set B -->
    <circle class="set-b" cx="170" cy="130" r="60" />
    <text font-family="Inter" font-size="13" font-weight="bold" fill="#c53030" x="200" y="130">사건 B</text>

    <!-- Intersection -->
    <text font-family="Inter" font-size="10" x="140" y="133" text-anchor="middle">A∩B</text>

    <text class="math" x="140" y="225" text-anchor="middle">P(B) = Area(B) / Area(S)</text>
  </g>

  <!-- Arrow pointing to right -->
  <g transform="translate(360, 205)">
    <path class="arrow" d="M 0 0 L 30 0" />
    <path d="M 30 -5 L 40 0 L 30 5 Z" fill="#4a5568" />
    <text font-family="Inter" font-size="11" font-weight="bold" fill="#2b6cb0" x="15" y="-12" text-anchor="middle">조건 A 발생</text>
  </g>

  <!-- Right: Reduced Sample Space -->
  <g transform="translate(420, 95)">
    <rect class="box" x="0" y="0" width="310" height="240" stroke="#3182ce" stroke-width="2" />
    <text font-family="Inter" font-size="12" font-weight="bold" fill="#2b6cb0" x="15" y="25">축소된 표본공간 (사건 A만 고려)</text>

    <!-- Shaded region for A -->
    <circle cx="155" cy="130" r="60" fill="#ebf8ff" stroke="#3182ce" stroke-width="2" />
    <text font-family="Inter" font-size="13" font-weight="bold" fill="#2b6cb0" x="120" y="130">새 표본공간 A</text>

    <!-- Overlapping B region -->
    <path d="M 155 70 A 60 60 0 0 1 215 130 A 60 60 0 0 1 155 190 A 60 60 0 0 1 155 70 Z" fill="#feb2b2" fill-opacity="0.8" stroke="#e53e3e" stroke-width="1.5" />
    <text font-family="Inter" font-size="11" font-weight="bold" fill="#9b2c2c" x="178" y="133" text-anchor="middle">A∩B</text>

    <!-- Formula -->
    <text class="math-bold" x="35" y="220" font-size="15">P(B|A) = P(A∩B) / P(A) = n(A∩B) / n(A)</text>
  </g>
</svg>
