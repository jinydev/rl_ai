<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa" rx="15" ry="15"/>
  <style>
    .title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
    .label { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4a5568; }
    .grid-line { stroke: #cbd5e0; stroke-width: 1; }
    .grid-line-bold { stroke: #4a5568; stroke-width: 2.5; }
    .cell-selected { fill: #fde047; opacity: 0.3; }
    .cell-label { font-family: 'Inter', sans-serif; font-size: 11px; fill: #718096; text-anchor: middle; }
    .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 16px; font-style: italic; fill: #1a202c; }
    .math-bold { font-weight: bold; fill: #2d3748; }
    .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; ry: 8; }
  </style>

  <!-- Left: 6x6 Grid for Two Dice -->
  <g transform="translate(60, 60)">
    <!-- Header Labels -->
    <text class="label" x="150" y="-30" text-anchor="middle" font-weight="bold">파랑 주사위 눈 (1 ~ 6)</text>
    <text class="label" x="-40" y="150" text-anchor="middle" font-weight="bold" transform="rotate(-90, -40, 150)">빨강 주사위 눈 (1 ~ 6)</text>

    <!-- Cells Highlight for 1~4 -->
    <rect class="cell-selected" x="0" y="0" width="160" height="160" />

    <!-- Grid lines -->
    <!-- X-axis lines -->
    <line class="grid-line" x1="0" y1="0" x2="240" y2="0" />
    <line class="grid-line" x1="0" y1="40" x2="240" y2="40" />
    <line class="grid-line" x1="0" y1="80" x2="240" y2="80" />
    <line class="grid-line" x1="0" y1="120" x2="240" y2="120" />
    <line class="grid-line" x1="0" y1="160" x2="240" y2="160" />
    <line class="grid-line" x1="0" y1="200" x2="240" y2="200" />
    <line class="grid-line" x1="0" y1="240" x2="240" y2="240" />

    <!-- Y-axis lines -->
    <line class="grid-line" x1="0" y1="0" x2="0" y2="240" />
    <line class="grid-line" x1="40" y1="0" x2="40" y2="240" />
    <line class="grid-line" x1="80" y1="0" x2="80" y2="240" />
    <line class="grid-line" x1="120" y1="0" x2="120" y2="240" />
    <line class="grid-line" x1="160" y1="0" x2="160" y2="240" />
    <line class="grid-line" x1="200" y1="0" x2="200" y2="240" />
    <line class="grid-line" x1="240" y1="0" x2="240" y2="240" />

    <!-- Bold highlight border for 4x4 subgrid -->
    <rect x="0" y="0" width="160" height="160" fill="none" stroke="#e53e3e" stroke-width="2.5" rx="2" ry="2"/>
    <text class="label" x="80" y="180" text-anchor="middle" fill="#e53e3e" font-weight="bold">선택 영역 (16가지)</text>

    <!-- Axis coordinates -->
    <!-- X-axis numbers -->
    <text class="cell-label" x="20" y="-10">1</text>
    <text class="cell-label" x="60" y="-10">2</text>
    <text class="cell-label" x="100" y="-10">3</text>
    <text class="cell-label" x="140" y="-10">4</text>
    <text class="cell-label" x="180" y="-10">5</text>
    <text class="cell-label" x="220" y="-10">6</text>

    <!-- Y-axis numbers -->
    <text class="cell-label" x="-15" y="25">1</text>
    <text class="cell-label" x="-15" y="65">2</text>
    <text class="cell-label" x="-15" y="105">3</text>
    <text class="cell-label" x="-15" y="145">4</text>
    <text class="cell-label" x="-15" y="185">5</text>
    <text class="cell-label" x="-15" y="225">6</text>
  </g>

  <!-- Right: Calculations & Formula -->
  <g transform="translate(420, 60)">
    <rect class="box" x="0" y="0" width="320" height="280"/>
    <text class="title" x="160" y="30" text-anchor="middle">독립시행과 확률의 곱</text>

    <text class="label" x="30" y="80" font-weight="bold">1. 표본공간 격자법</text>
    <text class="math" x="40" y="110">전체 경우의 수 = 6 × 6 = 36</text>
    <text class="math" x="40" y="130">해당 경우의 수 = 4 × 4 = 16</text>
    <text class="math" x="40" y="155">P(A ∩ B) = 16/36 = 4/9</text>

    <line class="grid-line" x1="20" y1="175" x2="300" y2="175" />

    <text class="label" x="30" y="210" font-weight="bold">2. 독립사건 확률의 곱셈</text>
    <text class="math" x="40" y="235">P(A) = 4/6 = 2/3 (빨강 주사위)</text>
    <text class="math" x="40" y="255">P(B) = 4/6 = 2/3 (파랑 주사위)</text>
    <text class="math math-bold" x="40" y="285" fill="#3182ce">P(A ∩ B) = P(A) × P(B) = 4/9</text>
  </g>
</svg>
