<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa" rx="15" ry="15"/>
  <style>
    .title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
    .label { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4a5568; }
    .venn-box { fill: #ffffff; stroke: #cbd5e0; stroke-width: 2; rx: 12; ry: 12; }
    .set-a { fill: #ebf8ff; stroke: #3182ce; stroke-width: 2; fill-opacity: 0.5; }
    .set-b { fill: #f0fff4; stroke: #38a169; stroke-width: 2; fill-opacity: 0.5; }
    .set-c { fill: #fff5f5; stroke: #e53e3e; stroke-width: 2; fill-opacity: 0.5; }
    .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #1a202c; }
    .text-node { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: bold; fill: #2d3748; text-anchor: middle; }
  </style>

  <text class="title" x="40" y="45">표본공간과 배반사건 (Venn Diagram representation)</text>
  <text class="label" x="40" y="65">사건과 표본공간은 집합론의 개념과 완전히 대응됩니다.</text>

  <!-- Venn Diagram Space S -->
  <g transform="translate(60, 95)">
    <rect class="venn-box" x="0" y="0" width="460" height="260" />
    <text class="text-node" x="40" y="30" font-size="14">표본공간 S</text>

    <!-- Set A and B (Intersecting) -->
    <circle class="set-a" cx="150" cy="140" r="75" />
    <text class="text-node" x="110" y="140" fill="#2b6cb0">사건 A</text>

    <circle class="set-b" cx="240" cy="140" r="75" />
    <text class="text-node" x="280" y="140" fill="#276749">사건 B</text>
    
    <text class="math" x="195" y="145" font-size="11" text-anchor="middle">A∩B ≠ ∅</text>

    <!-- Set C (Disjoint from A and B) -->
    <circle class="set-c" cx="390" cy="140" r="50" />
    <text class="text-node" x="390" y="140" fill="#9b2c2c">사건 C</text>
  </g>

  <!-- Right: Definitions and Relations -->
  <g transform="translate(550, 95)">
    <rect x="0" y="0" width="210" height="260" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8" ry="8" />
    <text class="text-node" x="105" y="30" font-size="13" fill="#2d3748">사건들의 관계</text>

    <!-- Sum Event -->
    <text class="label" x="15" y="70" font-weight="bold">1. 합사건 (A ∪ B)</text>
    <text class="label" x="25" y="90">A 또는 B가 일어남</text>

    <!-- Product Event -->
    <text class="label" x="15" y="125" font-weight="bold">2. 곱사건 (A ∩ B)</text>
    <text class="label" x="25" y="145">A와 B가 동시에 일어남</text>

    <!-- Mutually Exclusive -->
    <text class="label" x="15" y="180" font-weight="bold" fill="#e53e3e">3. 배반사건 (Disjoint)</text>
    <text class="math" x="25" y="205">A ∩ C = ∅</text>
    <text class="math" x="25" y="225">B ∩ C = ∅</text>
    <text class="label" x="25" y="245" font-size="11" fill="#718096">(동시에 일어날 수 없음)</text>
  </g>
</svg>
