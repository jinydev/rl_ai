<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .cell-text { font-family: "SF Pro Text", -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; fill: #475569; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 12px; fill: #64748b; }
      .cell-border { stroke: #cbd5e1; stroke-width: 2; }
    </style>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="grad-goal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-trap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="760" height="480" fill="#ffffff" rx="16"/>

  <!-- Title & Subtitle -->
  <text x="380" y="42" class="title" text-anchor="middle">TD법으로 평가한 상태 가치 함수 V(s)</text>
  <text x="380" y="68" class="label-text" text-anchor="middle">3 × 4 그리드 월드 (무작위 정책 평가 결과)</text>

  <!-- Grid Container -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- Row 0 -->
    <!-- (0,0) -->
    <rect x="0" y="0" width="140" height="100" fill="#f0fdf4" class="cell-border"/>
    <text x="70" y="50" class="cell-text" fill="#15803d">0.04</text>
    
    <!-- (0,1) -->
    <rect x="140" y="0" width="140" height="100" fill="#dcfce7" class="cell-border"/>
    <text x="210" y="50" class="cell-text" fill="#15803d">0.10</text>

    <!-- (0,2) -->
    <rect x="280" y="0" width="140" height="100" fill="#bbf7d0" class="cell-border"/>
    <text x="350" y="50" class="cell-text" fill="#166534">0.22</text>

    <!-- (0,3) GOAL -->
    <rect x="420" y="0" width="140" height="100" fill="#ecfdf5" class="cell-border" stroke="#059669" stroke-width="3"/>
    <rect x="430" y="10" width="120" height="80" rx="8" fill="url(#grad-goal)"/>
    <text x="490" y="42" class="cell-text" fill="#ffffff">GOAL</text>
    <text x="490" y="68" class="sub-text" fill="#ffffff" text-anchor="middle" font-weight="700">R = +1.0</text>

    <!-- Row 1 -->
    <!-- (1,0) -->
    <rect x="0" y="100" width="140" height="100" fill="#fef2f2" class="cell-border"/>
    <text x="70" y="150" class="cell-text" fill="#b91c1c">-0.02</text>

    <!-- (1,1) WALL -->
    <rect x="140" y="100" width="140" height="100" fill="#334155" class="cell-border"/>
    <text x="210" y="145" class="cell-text" fill="#94a3b8" font-size="16">WALL</text>
    <text x="210" y="165" class="sub-text" fill="#64748b" text-anchor="middle">(벽 / 이동 불가)</text>

    <!-- (1,2) -->
    <rect x="280" y="100" width="140" height="100" fill="#fee2e2" class="cell-border"/>
    <text x="350" y="150" class="cell-text" fill="#b91c1c">-0.47</text>

    <!-- (1,3) TRAP -->
    <rect x="420" y="100" width="140" height="100" fill="#fef2f2" class="cell-border" stroke="#dc2626" stroke-width="3"/>
    <rect x="430" y="110" width="120" height="80" rx="8" fill="url(#grad-trap)"/>
    <text x="490" y="142" class="cell-text" fill="#ffffff">TRAP</text>
    <text x="490" y="168" class="sub-text" fill="#ffffff" text-anchor="middle" font-weight="700">R = -1.0</text>

    <!-- Row 2 -->
    <!-- (2,0) -->
    <rect x="0" y="200" width="140" height="100" fill="#fef2f2" class="cell-border"/>
    <text x="70" y="250" class="cell-text" fill="#b91c1c">-0.09</text>

    <!-- (2,1) -->
    <rect x="140" y="200" width="140" height="100" fill="#fee2e2" class="cell-border"/>
    <text x="210" y="250" class="cell-text" fill="#b91c1c">-0.21</text>

    <!-- (2,2) -->
    <rect x="280" y="200" width="140" height="100" fill="#fecaca" class="cell-border"/>
    <text x="350" y="250" class="cell-text" fill="#b91c1c">-0.42</text>

    <!-- (2,3) -->
    <rect x="420" y="200" width="140" height="100" fill="#fca5a5" class="cell-border"/>
    <text x="490" y="250" class="cell-text" fill="#991b1b">-0.80</text>
  </g>

  <!-- Legend -->
  <g transform="translate(140, 430)">
    <circle cx="20" cy="10" r="8" fill="#10b981"/>
    <text x="35" y="14" class="sub-text">양수 가치 (목표 도달 근접)</text>

    <circle cx="240" cy="10" r="8" fill="#ef4444"/>
    <text x="255" y="14" class="sub-text">음수 가치 (함정 근접 위험)</text>

    <circle cx="440" cy="10" r="8" fill="#334155"/>
    <text x="455" y="14" class="sub-text">이동 불가 장애물</text>
  </g>
</svg>