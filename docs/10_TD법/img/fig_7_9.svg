<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 16px; font-weight: 700; fill: #334155; }
      .val-text { font-family: "SF Pro Text", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: #1e293b; }
      .sub-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .arrow-dir { stroke: #1e293b; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="840" height="440" fill="#ffffff" rx="16"/>

  <text x="420" y="38" class="main-title" text-anchor="middle">오프-정책 SARSA(중요도 샘플링)로 얻은 결과</text>

  <!-- Left: Estimated State Values -->
  <g transform="translate(60, 75)" filter="url(#box-shadow)">
    <text x="160" y="25" class="col-title" text-anchor="middle">(a) 상태 가치 요약 V(s)</text>
    <g transform="translate(0, 45)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="80" height="75" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="38" class="val-text">0.45</text>
      <rect x="80" y="0" width="80" height="75" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.5"/><text x="120" y="38" class="val-text">0.68</text>
      <rect x="160" y="0" width="80" height="75" fill="#86efac" stroke="#cbd5e1" stroke-width="1.5"/><text x="200" y="38" class="val-text">0.89</text>
      <rect x="240" y="0" width="80" height="75" fill="#10b981" stroke="#059669" stroke-width="2"/><text x="280" y="38" class="val-text" fill="#ffffff">GOAL</text>

      <!-- Row 1 -->
      <rect x="0" y="75" width="80" height="75" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="113" class="val-text">0.38</text>
      <rect x="80" y="75" width="80" height="75" fill="#334155" stroke="#1e293b" stroke-width="1.5"/><text x="120" y="113" class="val-text" fill="#94a3b8">WALL</text>
      <rect x="160" y="75" width="80" height="75" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="200" y="113" class="val-text" fill="#b91c1c">-0.12</text>
      <rect x="240" y="75" width="80" height="75" fill="#ef4444" stroke="#dc2626" stroke-width="2"/><text x="280" y="113" class="val-text" fill="#ffffff">TRAP</text>

      <!-- Row 2 -->
      <rect x="0" y="150" width="80" height="75" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="188" class="val-text">0.25</text>
      <rect x="80" y="150" width="80" height="75" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="120" y="188" class="val-text">0.19</text>
      <rect x="160" y="150" width="80" height="75" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="200" y="188" class="val-text" fill="#b91c1c">-0.05</text>
      <rect x="240" y="150" width="80" height="75" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="280" y="188" class="val-text" fill="#b91c1c">-0.24</text>
    </g>
  </g>

  <!-- Right: Greedy Policy -->
  <g transform="translate(460, 75)" filter="url(#box-shadow)">
    <text x="160" y="25" class="col-title" text-anchor="middle">(b) 대상 정책(탐욕 정책) π(s)</text>
    <g transform="translate(0, 45)">
      <!-- Row 0 -->
      <g transform="translate(0,0)"><rect width="80" height="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="20" y1="37" x2="60" y2="37" class="arrow-dir"/><polyline points="50,27 60,37 50,47" fill="none" class="arrow-dir"/></g>
      <g transform="translate(80,0)"><rect width="80" height="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="20" y1="37" x2="60" y2="37" class="arrow-dir"/><polyline points="50,27 60,37 50,47" fill="none" class="arrow-dir"/></g>
      <g transform="translate(160,0)"><rect width="80" height="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="20" y1="37" x2="60" y2="37" class="arrow-dir"/><polyline points="50,27 60,37 50,47" fill="none" class="arrow-dir"/></g>
      <g transform="translate(240,0)"><rect width="80" height="75" fill="#10b981" stroke="#059669" stroke-width="2"/><text x="40" y="40" class="val-text" fill="#ffffff">GOAL</text></g>

      <!-- Row 1 -->
      <g transform="translate(0,75)"><rect width="80" height="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="40" y1="55" x2="40" y2="20" class="arrow-dir"/><polyline points="30,30 40,20 50,30" fill="none" class="arrow-dir"/></g>
      <g transform="translate(80,75)"><rect width="80" height="75" fill="#334155" stroke="#1e293b" stroke-width="1.5"/><text x="40" y="40" class="val-text" fill="#94a3b8">WALL</text></g>
      <g transform="translate(160,75)"><rect width="80" height="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="40" y1="55" x2="40" y2="20" class="arrow-dir"/><polyline points="30,30 40,20 50,30" fill="none" class="arrow-dir"/></g>
      <g transform="translate(240,75)"><rect width="80" height="75" fill="#ef4444" stroke="#dc2626" stroke-width="2"/><text x="40" y="40" class="val-text" fill="#ffffff">TRAP</text></g>

      <!-- Row 2 -->
      <g transform="translate(0,150)"><rect width="80" height="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="40" y1="55" x2="40" y2="20" class="arrow-dir"/><polyline points="30,30 40,20 50,30" fill="none" class="arrow-dir"/></g>
      <g transform="translate(80,150)"><rect width="80" height="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="60" y1="37" x2="20" y2="37" class="arrow-dir"/><polyline points="30,27 20,37 30,47" fill="none" class="arrow-dir"/></g>
      <g transform="translate(160,150)"><rect width="80" height="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="60" y1="37" x2="20" y2="37" class="arrow-dir"/><polyline points="30,27 20,37 30,47" fill="none" class="arrow-dir"/></g>
      <g transform="translate(240,150)"><rect width="80" height="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="60" y1="37" x2="20" y2="37" class="arrow-dir"/><polyline points="30,27 20,37 30,47" fill="none" class="arrow-dir"/></g>
    </g>
  </g>

  <!-- Bottom Observation -->
  <text x="420" y="405" class="sub-desc" text-anchor="middle">중요도 샘플링 가중치 ρ = π(A_t+1|S_t+1) / b(A_t+1|S_t+1) 를 보정 계수로 활용하여 대상 정책과 행동 정책의 괴리를 완화합니다.</text>
</svg>