<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #475569; }
      .state-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .arrow { stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="840" height="440" fill="#ffffff" rx="16"/>
  <rect x="12" y="12" width="816" height="416" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="14"/>

  <!-- Main Title -->
  <text x="420" y="44" class="title" text-anchor="middle">그림 10-1: TD법과 몬테카를로법의 가치 갱신 시점 비교</text>
  <text x="420" y="68" class="subtitle" text-anchor="middle">몬테카를로법은 에피소드 종료까지 대기 / TD법은 매 타임스텝(1-step)마다 즉시 갱신</text>

  <!-- Section 1: Monte Carlo (Top Card) -->
  <g transform="translate(36, 96)" filter="url(#shadow)">
    <rect width="768" height="140" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="12"/>
    <rect x="16" y="16" width="130" height="26" fill="#3b82f6" rx="6"/>
    <text x="81" y="29" class="badge-text">몬테카를로법 (MC)</text>
    <text x="160" y="32" class="box-desc">에피소드가 끝날 때까지 기다린 후, 실제 누적 반환값 G_t로 일괄 갱신</text>

    <!-- MC Timeline States -->
    <g transform="translate(36, 68)">
      <!-- S0 -->
      <circle cx="30" cy="20" r="18" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="30" y="20" class="state-text" fill="#1e293b">S₀</text>

      <line x1="52" y1="20" x2="108" y2="20" stroke="#94a3b8" class="arrow" marker-end="url(#arrow-blue)"/>

      <!-- S1 -->
      <circle cx="130" cy="20" r="18" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="130" y="20" class="state-text" fill="#1e293b">S₁</text>

      <line x1="152" y1="20" x2="208" y2="20" stroke="#94a3b8" class="arrow" marker-end="url(#arrow-blue)"/>

      <!-- S2 -->
      <circle cx="230" cy="20" r="18" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="230" y="20" class="state-text" fill="#1e293b">S₂</text>

      <line x1="252" y1="20" x2="318" y2="20" stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="2"/>

      <!-- ST-1 -->
      <circle cx="340" cy="20" r="18" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="340" y="20" class="state-text" fill="#1e293b" font-size="11">S_T-1</text>

      <line x1="362" y1="20" x2="418" y2="20" stroke="#94a3b8" class="arrow" marker-end="url(#arrow-blue)"/>

      <!-- ST (Terminal) -->
      <circle cx="440" cy="20" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="440" y="20" class="state-text" fill="#1d4ed8" font-weight="700">S_T</text>
      <text x="440" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">종료(골)</text>

      <!-- Feedback Arc -->
      <path d="M 440 -6 C 360 -45, 120 -45, 35 -4" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
      <rect x="180" y="-48" width="180" height="22" fill="#fef2f2" stroke="#fecaca" stroke-width="1" rx="4"/>
      <text x="270" y="-37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="central">반환값 G_t 확정 후 역방향 갱신</text>
    </g>

    <!-- MC Summary Tag -->
    <rect x="560" y="52" width="185" height="66" fill="#eff6ff" stroke="#bfdbfe" rx="8"/>
    <text x="652" y="73" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">특징: 편향 없음 (Unbiased)</text>
    <text x="652" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">단점: 높은 분산 &amp; 긴 대기 시간</text>
    <text x="652" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">V(S_t) ← V(S_t) + α(G_t - V(S_t))</text>
  </g>

  <!-- Section 2: Temporal Difference (Bottom Card) -->
  <g transform="translate(36, 256)" filter="url(#shadow)">
    <rect width="768" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="12"/>
    <rect x="16" y="16" width="110" height="26" fill="#10b981" rx="6"/>
    <text x="71" y="29" class="badge-text">TD법 (TD(0))</text>
    <text x="140" y="32" class="box-desc">에피소드 종료를 기다리지 않고, 1단계 이동 직후 즉시 갱신 (부트스트랩)</text>

    <!-- TD Timeline States -->
    <g transform="translate(36, 75)">
      <!-- St -->
      <circle cx="50" cy="20" r="22" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
      <text x="50" y="20" class="state-text" fill="#065f46" font-weight="700">S_t</text>
      <text x="50" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">현재 상태</text>

      <!-- Action & Reward Transition -->
      <line x1="78" y1="20" x2="202" y2="20" stroke="#10b981" class="arrow" marker-end="url(#arrow-emerald)"/>
      <rect x="108" y="6" width="64" height="20" fill="#f0fdf4" stroke="#86efac" rx="4"/>
      <text x="140" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle" dominant-baseline="central">A_t, R_t+1</text>

      <!-- St+1 -->
      <circle cx="230" cy="20" r="22" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <text x="230" y="20" class="state-text" fill="#1e293b" font-weight="600">S_t+1</text>
      <text x="230" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">다음 상태</text>

      <!-- Immediate Update Loop -->
      <path d="M 230 -6 C 180 -40, 100 -40, 56 -6" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-amber)"/>
      <rect x="90" y="-45" width="130" height="22" fill="#fffbeb" stroke="#fde68a" stroke-width="1" rx="4"/>
      <text x="155" y="-34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="central">1-step 즉시 갱신!</text>

      <!-- Future continuation dotted -->
      <line x1="258" y1="20" x2="350" y2="20" stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="2" marker-end="url(#arrow-emerald)"/>
      <text x="310" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">미래 전개 불필요</text>
    </g>

    <!-- TD Summary Tag -->
    <rect x="520" y="52" width="225" height="74" fill="#ecfdf5" stroke="#a7f3d0" rx="8"/>
    <text x="632" y="73" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">특징: 낮은 분산 &amp; 빠른 실시간 학습</text>
    <text x="632" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#047857" text-anchor="middle">부트스트랩(추정치로 추정치 갱신)</text>
    <text x="632" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#1e293b" text-anchor="middle">V(S_t) ← V(S_t) + α [R + γV(S_t+1) - V(S_t)]</text>
  </g>
</svg>
