<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="batchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAction" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" fill="#ffffff" rx="16"/>

  <text class="title" x="440" y="38">A2C (Advantage Actor-Critic) 동기식 병렬 아키텍처</text>

  <!-- Left: Parallel Environments -->
  <g transform="translate(140, 90)">
    <rect x="-110" y="0" width="220" height="340" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="-95" y="10" width="190" height="26" rx="6" fill="#e2e8f0"/>
    <text class="box-title" x="0" y="28" fill="#334155">n개 독립 환경 병렬 실행</text>

    <!-- Env 1 -->
    <g transform="translate(0, 75)" filter="url(#shadow)">
      <rect x="-90" y="-25" width="180" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text class="box-title" x="0" y="-4" fill="#0f172a">환경 1 (Env 1)</text>
      <text class="box-desc" x="0" y="14" fill="#64748b">상태 S_t⁽¹⁾, 보상 R_t⁽¹⁾</text>
    </g>

    <!-- Env 2 -->
    <g transform="translate(0, 145)" filter="url(#shadow)">
      <rect x="-90" y="-25" width="180" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text class="box-title" x="0" y="-4" fill="#0f172a">환경 2 (Env 2)</text>
      <text class="box-desc" x="0" y="14" fill="#64748b">상태 S_t⁽²⁾, 보상 R_t⁽²⁾</text>
    </g>

    <!-- Dots -->
    <circle cx="0" cy="195" r="3" fill="#94a3b8"/>
    <circle cx="0" cy="205" r="3" fill="#94a3b8"/>
    <circle cx="0" cy="215" r="3" fill="#94a3b8"/>

    <!-- Env N -->
    <g transform="translate(0, 265)" filter="url(#shadow)">
      <rect x="-90" y="-25" width="180" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text class="box-title" x="0" y="-4" fill="#0f172a">환경 n (Env n)</text>
      <text class="box-desc" x="0" y="14" fill="#64748b">상태 S_t⁽ⁿ⁾, 보상 R_t⁽ⁿ⁾</text>
    </g>
  </g>

  <!-- Flow 1: Synchronized Batch Gathering -->
  <path d="M 230 165 L 360 215" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 230 235 L 360 235" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 230 355 L 360 255" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Center: 동기 배치 (Synchronized Batch) -->
  <g transform="translate(420, 235)" filter="url(#shadow)">
    <rect x="-60" y="-70" width="120" height="140" rx="12" fill="url(#batchGrad)" stroke="#60a5fa" stroke-width="2"/>
    <text class="box-title" x="0" y="-40" fill="#1e40af">동기식 배치</text>
    <text class="box-desc" x="0" y="-20" fill="#2563eb">Batch [n, State]</text>
    <line x1="-45" y1="-5" x2="45" y2="-5" stroke="#93c5fd" stroke-width="1"/>
    <text class="box-desc" x="0" y="18" fill="#3b82f6">[S_t⁽¹⁾, ..., S_t⁽ⁿ⁾]</text>
    <text class="box-desc" x="0" y="38" fill="#3b82f6">[R_t⁽¹⁾, ..., R_t⁽ⁿ⁾]</text>
    <rect x="-48" y="48" width="96" height="16" rx="4" fill="#dbeafe"/>
    <text class="flow-label" x="0" y="60" fill="#1d4ed8">Step-동기화</text>
  </g>

  <!-- Flow to Centralized Neural Network -->
  <path d="M 480 235 L 560 235" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right: 단일 통합 신경망 (Single GPU Network) -->
  <g transform="translate(710, 235)" filter="url(#shadow)">
    <rect x="-140" y="-115" width="280" height="230" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    
    <!-- Top banner: GPU -->
    <rect x="-140" y="-115" width="280" height="42" rx="14" fill="url(#gpuGrad)"/>
    <text class="box-title" x="0" y="-88" fill="#ffffff">단일 신경망 (Single GPU 연산)</text>
    
    <g transform="translate(0, -35)">
      <rect x="-120" y="0" width="240" height="45" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text class="box-title" x="0" y="20" fill="#065f46">행위자-비평자 가중치 동시 갱신</text>
      <text class="box-desc" x="0" y="36" fill="#047857">배치 순전파 &amp; 역전파로 θ 갱신</text>
    </g>

    <g transform="translate(0, 25)">
      <rect x="-120" y="0" width="240" height="45" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text class="box-title" x="0" y="20" fill="#1e40af">각 환경별 다음 행동 샘플링</text>
      <text class="box-desc" x="0" y="36" fill="#2563eb">A_t⁽ⁱ⁾ ~ π_θ(· | S_t⁽ⁱ⁾)</text>
    </g>

    <rect x="-120" y="82" width="240" height="22" rx="4" fill="#f1f5f9"/>
    <text class="flow-label" x="0" y="97" fill="#475569">락(Lock) 경합 없는 단일 프로세스</text>
  </g>

  <!-- Flow Back: Action Feedback Loop -->
  <path d="M 710 350 L 710 445 L 140 445 L 140 370" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowAction)"/>
  <rect x="360" y="433" width="180" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="flow-label" x="450" y="449" fill="#1d4ed8">샘플링된 행동들 [A_t⁽¹⁾, ..., A_t⁽ⁿ⁾] 각 환경에 분배</text>
</svg>
