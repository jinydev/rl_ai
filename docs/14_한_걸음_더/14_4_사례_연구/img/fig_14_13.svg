<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" fill="#ffffff" rx="16"/>

  <text class="title" x="440" y="38">구글 QT-Opt: 다중 로봇 팔의 대규모 분산 데이터 수집 및 오프-정책 학습</text>

  <!-- 7 Robots Station (Left/Center) -->
  <g transform="translate(230, 80)">
    <rect x="-170" y="0" width="340" height="280" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="-150" y="12" width="300" height="26" rx="6" fill="#e2e8f0"/>
    <text class="box-title" x="0" y="30" fill="#1e293b">물리 로봇 조작 스테이션 (7대 병렬 운용)</text>

    <!-- 7 Robot Arms Icons/Badges -->
    <g transform="translate(-100, 70)" filter="url(#shadow)">
      <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text class="tag" x="0" y="4" fill="#334155">로봇 #1</text>
    </g>
    <g transform="translate(0, 70)" filter="url(#shadow)">
      <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text class="tag" x="0" y="4" fill="#334155">로봇 #2</text>
    </g>
    <g transform="translate(100, 70)" filter="url(#shadow)">
      <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text class="tag" x="0" y="4" fill="#334155">로봇 #3</text>
    </g>
    <g transform="translate(-100, 120)" filter="url(#shadow)">
      <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text class="tag" x="0" y="4" fill="#334155">로봇 #4</text>
    </g>
    <g transform="translate(0, 120)" filter="url(#shadow)">
      <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text class="tag" x="0" y="4" fill="#334155">로봇 #5</text>
    </g>
    <g transform="translate(100, 120)" filter="url(#shadow)">
      <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text class="tag" x="0" y="4" fill="#334155">로봇 #6</text>
    </g>
    <g transform="translate(0, 170)" filter="url(#shadow)">
      <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text class="tag" x="0" y="4" fill="#1d4ed8">로봇 #7</text>
    </g>

    <!-- Overhead Camera / Sensor -->
    <rect x="-150" y="210" width="300" height="50" rx="10" fill="#ecfdf5" stroke="#10b981"/>
    <text class="box-title" x="0" y="232" fill="#065f46">상단 카메라 비전 센서 (RGB 이미지)</text>
    <text class="box-desc" x="0" y="250" fill="#047857">물체 파지 성공/실패 여부 자동 판별 (보상 R ∈ {0, 1})</text>
  </g>

  <!-- Flow to Experience Buffer -->
  <path d="M 400 220 L 460 220" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text class="box-desc" x="430" y="205" fill="#2563eb" font-weight="700">경험 수집</text>

  <!-- Experience Buffer (Center) -->
  <g transform="translate(520, 220)" filter="url(#shadow)">
    <rect x="-45" y="-80" width="90" height="160" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text class="box-title" x="0" y="-45" fill="#1d4ed8">경험 재생</text>
    <text class="box-title" x="0" y="-28" fill="#1d4ed8">버퍼 (D)</text>
    <line x1="-35" y1="-12" x2="35" y2="-12" stroke="#bfdbfe"/>
    <text class="box-desc" x="0" y="10" fill="#1e40af">580,000회</text>
    <text class="box-desc" x="0" y="28" fill="#1e40af">파지 시도</text>
    <text class="box-desc" x="0" y="46" fill="#64748b">과거 데이터</text>
    <text class="box-desc" x="0" y="64" fill="#059669" font-weight="bold">오프-정책</text>
  </g>

  <!-- Flow to Central Q-Learning Model -->
  <path d="M 565 220 L 625 220" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Right: QT-Opt Algorithm Learning -->
  <g transform="translate(735, 220)" filter="url(#shadow)">
    <rect x="-115" y="-120" width="230" height="240" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="-100" y="-108" width="200" height="30" rx="8" fill="#ede9fe"/>
    <text class="box-title" x="0" y="-88" fill="#6d28d9">QT-Opt 신경망 학습</text>

    <!-- Q Network -->
    <rect x="-95" y="-60" width="190" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="box-title" x="0" y="-38" fill="#0f172a">심층 Q 신경망 Q(s, a)</text>
    <text class="box-desc" x="0" y="-20" fill="#64748b">비전 입력 + 연속 행동 파라미터</text>

    <!-- CEM Continuous Action Search -->
    <rect x="-95" y="5" width="190" height="50" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="box-title" x="0" y="27" fill="#b45309">CEM (교차 엔트로피 방법)</text>
    <text class="box-desc" x="0" y="45" fill="#78350f">연속 행동 최댓값 max_a Q(s,a) 탐색</text>

    <!-- Result Success Metric -->
    <rect x="-95" y="70" width="190" height="35" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text class="box-title" x="0" y="93" fill="#047857" font-size="13">미지의 물체 파지 성공률 96%</text>
  </g>

  <!-- Action Feedback Loop to Robots -->
  <path d="M 735 100 L 735 48 L 230 48 L 230 80" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <rect x="420" y="38" width="120" height="20" rx="4" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text class="tag" x="480" y="52" fill="#7c3aed">갱신된 정책 행동 분배</text>

  <!-- Bottom Annotation -->
  <text class="box-desc" x="440" y="415">비싼 실제 물리 로봇 환경에서는 오프-정책(Off-Policy) 기법을 활용해 과거의 모든 시도 데이터를 재사용하는 것이 성공의 핵심</text>
</svg>
