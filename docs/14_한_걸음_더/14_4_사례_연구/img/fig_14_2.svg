<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .label-lg { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .label-md { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .label-sm { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; font-weight: 500; text-anchor: middle; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="globalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 6 L 5 0 L 10 6 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="7" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 5 6 L 10 0 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowEnv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" fill="#ffffff" rx="16"/>

  <text class="title" x="440" y="38">A3C (Asynchronous Advantage Actor-Critic) 아키텍처</text>

  <!-- Global Network Box -->
  <g transform="translate(440, 105)" filter="url(#cardShadow)">
    <rect x="-180" y="-35" width="360" height="70" rx="14" fill="url(#globalGrad)"/>
    <text class="label-lg" x="0" y="-5" fill="#ffffff">전역 신경망 (Global Network)</text>
    <text class="label-sm" x="0" y="16" fill="#c7d2fe">전역 가중치 매개변수 θ 갱신 &amp; 관리</text>
  </g>

  <!-- Asynchronous Interaction Lines & Labels -->
  <!-- Legend -->
  <g transform="translate(440, 175)">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#f1f5f9"/>
    <line x1="-150" y1="0" x2="-110" y2="0" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
    <polygon points="-110,-4 -102,0 -110,4" fill="#dc2626"/>
    <text class="flow-label" x="-60" y="4" fill="#b91c1c">비동기 기울기 전달</text>
    
    <line x1="20" y1="0" x2="60" y2="0" stroke="#2563eb" stroke-width="2"/>
    <polygon points="60,-4 68,0 60,4" fill="#2563eb"/>
    <text class="flow-label" x="110" y="4" fill="#1d4ed8">주기적 매개변수 동기화</text>
  </g>

  <!-- 3 Workers (Local Networks) -->
  <!-- Worker 1 -->
  <g transform="translate(160, 310)" filter="url(#cardShadow)">
    <!-- Connecting lines to Global -->
    <path d="M 0 -80 L 160 -140" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowUp)"/>
    <path d="M -15 -80 L 140 -140" fill="none" stroke="#2563eb" stroke-width="2" marker-start="url(#arrowDown)"/>
    
    <rect x="-110" y="-70" width="220" height="150" rx="12" fill="url(#workerGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="-110" y="-70" width="220" height="30" rx="12" fill="#e0f2fe"/>
    <text class="label-md" x="0" y="-50" fill="#0369a1">에이전트 1 (지역 신경망)</text>
    <text class="label-sm" x="0" y="-25" fill="#475569">매개변수: θ₁'</text>
    <text class="label-sm" x="0" y="-8" fill="#64748b">기울기 dθ 계산</text>

    <!-- Sub Environment -->
    <rect x="-95" y="10" width="190" height="55" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text class="label-md" x="0" y="32" fill="#047857">독립 환경 1 (Env 1)</text>
    <text class="label-sm" x="0" y="50" fill="#059669">스텝별 상호작용 (S, A, R)</text>
  </g>

  <!-- Worker 2 -->
  <g transform="translate(440, 310)" filter="url(#cardShadow)">
    <!-- Connecting lines to Global -->
    <path d="M 10 -80 L 10 -135" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowUp)"/>
    <path d="M -10 -80 L -10 -135" fill="none" stroke="#2563eb" stroke-width="2" marker-start="url(#arrowDown)"/>

    <rect x="-110" y="-70" width="220" height="150" rx="12" fill="url(#workerGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="-110" y="-70" width="220" height="30" rx="12" fill="#e0f2fe"/>
    <text class="label-md" x="0" y="-50" fill="#0369a1">에이전트 2 (지역 신경망)</text>
    <text class="label-sm" x="0" y="-25" fill="#475569">매개변수: θ₂'</text>
    <text class="label-sm" x="0" y="-8" fill="#64748b">기울기 dθ 계산</text>

    <!-- Sub Environment -->
    <rect x="-95" y="10" width="190" height="55" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text class="label-md" x="0" y="32" fill="#047857">독립 환경 2 (Env 2)</text>
    <text class="label-sm" x="0" y="50" fill="#059669">스텝별 상호작용 (S, A, R)</text>
  </g>

  <!-- Worker N -->
  <g transform="translate(720, 310)" filter="url(#cardShadow)">
    <!-- Connecting lines to Global -->
    <path d="M 0 -80 L -160 -140" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowUp)"/>
    <path d="M 15 -80 L -140 -140" fill="none" stroke="#2563eb" stroke-width="2" marker-start="url(#arrowDown)"/>

    <rect x="-110" y="-70" width="220" height="150" rx="12" fill="url(#workerGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="-110" y="-70" width="220" height="30" rx="12" fill="#e0f2fe"/>
    <text class="label-md" x="0" y="-50" fill="#0369a1">에이전트 N (지역 신경망)</text>
    <text class="label-sm" x="0" y="-25" fill="#475569">매개변수: θ_n'</text>
    <text class="label-sm" x="0" y="-8" fill="#64748b">기울기 dθ 계산</text>

    <!-- Sub Environment -->
    <rect x="-95" y="10" width="190" height="55" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text class="label-md" x="0" y="32" fill="#047857">독립 환경 N (Env N)</text>
    <text class="label-sm" x="0" y="50" fill="#059669">스텝별 상호작용 (S, A, R)</text>
  </g>

  <!-- Bottom Summary Badge -->
  <g transform="translate(440, 465)">
    <rect x="-260" y="-16" width="520" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="flow-label" x="0" y="5" fill="#334155">독립 탐색을 통한 데이터 상관관계 제거 + 다중 코어 분산 병렬화 극대화</text>
  </g>
</svg>
