<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 14.5px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" fill="#ffffff" rx="16"/>

  <text class="title" x="460" y="38">Sim2Real과 도메인 무작위화 (Domain Randomization): 루빅스 큐브 로봇 조작</text>

  <!-- 1. Left: Virtual Simulator + Domain Randomization -->
  <g transform="translate(180, 215)" filter="url(#shadow)">
    <rect x="-140" y="-140" width="280" height="280" rx="16" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
    <rect x="-120" y="-128" width="240" height="32" rx="8" fill="#eff6ff"/>
    <text class="box-title" x="0" y="-106" fill="#1d4ed8">1. 가상 물리 시뮬레이터</text>

    <!-- Randomization Parameters -->
    <g transform="translate(0, -60)">
      <rect x="-115" y="0" width="230" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text class="tag" x="-50" y="24" fill="#334155">물리 파라미터 무작위화</text>
      <text class="box-desc" x="65" y="24" fill="#64748b">마찰력, 질량, 탄성</text>
    </g>

    <g transform="translate(0, -12)">
      <rect x="-115" y="0" width="230" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text class="tag" x="-50" y="24" fill="#334155">시각 렌더링 무작위화</text>
      <text class="box-desc" x="65" y="24" fill="#64748b">조명, 그림자, 색상</text>
    </g>

    <g transform="translate(0, 36)">
      <rect x="-115" y="0" width="230" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text class="tag" x="-50" y="24" fill="#334155">센서 및 모터 노이즈</text>
      <text class="box-desc" x="65" y="24" fill="#64748b">지연 시간, 외란</text>
    </g>

    <rect x="-115" y="90" width="230" height="32" rx="6" fill="#dbeafe"/>
    <text class="tag" x="0" y="111" fill="#1e40af">무수히 다양한 가상 환경 생성</text>
  </g>

  <!-- Arrow to Learning -->
  <path d="M 320 215 L 375 215" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2. Center: Deep RL Policy Network -->
  <g transform="translate(460, 215)" filter="url(#shadow)">
    <rect x="-80" y="-120" width="160" height="240" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="-68" y="-108" width="136" height="28" rx="6" fill="#ede9fe"/>
    <text class="box-title" x="0" y="-89" fill="#6d28d9">2. 심층 강화학습</text>

    <g transform="translate(0, -45)">
      <circle cx="0" cy="0" r="28" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
      <text class="tag" x="0" y="5" fill="#5b21b6" font-size="12">LSTM</text>
    </g>

    <text class="box-title" x="0" y="10" fill="#0f172a">제어 정책 (Policy)</text>
    <text class="box-desc" x="0" y="30" fill="#64748b">자동 도메인</text>
    <text class="box-desc" x="0" y="48" fill="#64748b">무작위화 (ADR)</text>

    <rect x="-65" y="65" width="130" height="40" rx="6" fill="#fdf4ff" stroke="#f0abfc"/>
    <text class="box-desc" x="0" y="82" fill="#a21caf" font-weight="700">시뮬레이터에서만</text>
    <text class="box-desc" x="0" y="98" fill="#86198f" font-weight="700">수천만 스텝 학습</text>
  </g>

  <!-- Arrow to Real World Deployment -->
  <path d="M 540 215 L 595 215" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="548" y="195" width="40" height="18" rx="4" fill="#dbeafe"/>
  <text class="tag" x="568" y="208" fill="#1e40af" font-size="9">이식</text>

  <!-- 3. Right: Real World Robot Hand Execution -->
  <g transform="translate(740, 215)" filter="url(#shadow)">
    <rect x="-140" y="-140" width="280" height="280" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="-120" y="-128" width="240" height="32" rx="8" fill="#ecfdf5"/>
    <text class="box-title" x="0" y="-106" fill="#065f46">3. 실제 물리 세계 (Sim-to-Real)</text>

    <!-- Real Shadow Hand & Cube -->
    <g transform="translate(0, -50)">
      <rect x="-115" y="0" width="230" height="42" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text class="box-title" x="0" y="20" fill="#166534">5손가락 물리 로봇 손 (Shadow Hand)</text>
      <text class="box-desc" x="0" y="35" fill="#15803d">24개 자유도 관절 모터 제어</text>
    </g>

    <g transform="translate(0, 5)">
      <rect x="-115" y="0" width="230" height="42" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
      <text class="box-title" x="0" y="20" fill="#b91c1c">외란 극복 (Robustness)</text>
      <text class="box-desc" x="0" y="35" fill="#dc2626">인형으로 찌르거나 묶인 상태에서도 성공</text>
    </g>

    <!-- Success Badge -->
    <rect x="-115" y="65" width="230" height="55" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text class="box-title" x="0" y="90" fill="#047857" font-size="15">추가 물리 학습 없이 큐브 해결</text>
    <text class="box-desc" x="0" y="108" fill="#065f46">Zero-Shot Sim-to-Real Transfer 성공</text>
  </g>

  <!-- Bottom Annotation -->
  <text class="box-desc" x="460" y="425" fill="#475569">현실의 물리적 특성이 시뮬레이터가 만들어낸 무수히 많은 무작위 환경 분포의 일부에 포함되도록 하여 일반화 달성</text>
</svg>
