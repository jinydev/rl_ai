<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; font-weight: 500; text-anchor: middle; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="380" fill="#ffffff" rx="16"/>

  <text class="title" x="440" y="38">A3C의 가중치 공유 신경망 아키텍처</text>

  <!-- Input: 상태 s -->
  <g transform="translate(80, 190)" filter="url(#shadow)">
    <rect x="-55" y="-55" width="110" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text class="box-title" x="0" y="-12" fill="#1d4ed8">상태 s</text>
    <text class="box-desc" x="0" y="8" fill="#2563eb">State Input</text>
    <text class="box-desc" x="0" y="26" fill="#64748b">(84×84×4)</text>
  </g>

  <!-- Arrow to Shared 1 -->
  <path d="M 135 190 L 175 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Shared Conv 1 -->
  <g transform="translate(230, 190)" filter="url(#shadow)">
    <rect x="-45" y="-50" width="90" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="box-title" x="0" y="-18" fill="#0f172a">Conv 1</text>
    <text class="box-desc" x="0" y="2" fill="#475569">16 filters</text>
    <text class="box-desc" x="0" y="18" fill="#475569">8×8, s=4</text>
    <rect x="-35" y="26" width="70" height="18" rx="4" fill="#e2e8f0"/>
    <text class="box-desc" x="0" y="39" fill="#334155" font-weight="700">ReLU</text>
  </g>

  <!-- Arrow to Shared 2 -->
  <path d="M 275 190 L 315 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Shared Conv 2 -->
  <g transform="translate(370, 190)" filter="url(#shadow)">
    <rect x="-45" y="-50" width="90" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="box-title" x="0" y="-18" fill="#0f172a">Conv 2</text>
    <text class="box-desc" x="0" y="2" fill="#475569">32 filters</text>
    <text class="box-desc" x="0" y="18" fill="#475569">4×4, s=2</text>
    <rect x="-35" y="26" width="70" height="18" rx="4" fill="#e2e8f0"/>
    <text class="box-desc" x="0" y="39" fill="#334155" font-weight="700">ReLU</text>
  </g>

  <!-- Arrow to Dense Feature -->
  <path d="M 415 190 L 455 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Shared Fully Connected -->
  <g transform="translate(515, 190)" filter="url(#shadow)">
    <rect x="-50" y="-50" width="100" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text class="box-title" x="0" y="-15" fill="#3730a3">공유 계층</text>
    <text class="box-desc" x="0" y="5" fill="#4338ca">Linear (FC)</text>
    <text class="box-desc" x="0" y="22" fill="#4f46e5">256 units</text>
    <rect x="-40" y="28" width="80" height="16" rx="4" fill="#c7d2fe"/>
    <text class="box-desc" x="0" y="40" fill="#312e81" font-weight="700">ReLU</text>
  </g>

  <!-- Shared Container Label -->
  <rect x="170" y="90" width="410" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="tag" x="375" y="107" fill="#475569">공유 특징 추출 신경망 (Shared Representation)</text>

  <!-- Branch Arrows -->
  <path d="M 565 170 L 610 170 L 610 130 L 635 130" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 565 210 L 610 210 L 610 250 L 635 250" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Policy Head (Actor) -->
  <g transform="translate(745, 130)" filter="url(#shadow)">
    <rect x="-100" y="-45" width="200" height="90" rx="12" fill="#fdf4ff" stroke="#c084fc" stroke-width="2"/>
    <text class="box-title" x="0" y="-20" fill="#86198f">행위자 (Actor) 출력</text>
    <text class="box-desc" x="0" y="-2" fill="#a21caf">Linear + Softmax</text>
    <rect x="-85" y="10" width="170" height="25" rx="6" fill="#fae8ff"/>
    <text class="box-title" x="0" y="27" fill="#701a75" font-size="14">정책 π(a|s)</text>
  </g>

  <!-- Value Head (Critic) -->
  <g transform="translate(745, 250)" filter="url(#shadow)">
    <rect x="-100" y="-45" width="200" height="90" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <text class="box-title" x="0" y="-20" fill="#166534">비평자 (Critic) 출력</text>
    <text class="box-desc" x="0" y="-2" fill="#15803d">Linear (단일 스칼라 출력)</text>
    <rect x="-85" y="10" width="170" height="25" rx="6" fill="#dcfce7"/>
    <text class="box-title" x="0" y="27" fill="#14532d" font-size="14">상태 가치 V(s)</text>
  </g>

  <!-- Bottom Annotation -->
  <g transform="translate(440, 350)">
    <text class="box-desc" x="0" y="0" fill="#64748b">특징 추출 층을 공유함으로써 연산량을 대폭 절감하고, 정책과 가치 함수 간의 시너지 학습 달성</text>
  </g>
</svg>
