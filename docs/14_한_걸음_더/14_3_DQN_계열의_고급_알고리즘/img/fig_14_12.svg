<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .edge-text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 10px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .phase-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" fill="#ffffff" rx="16"/>

  <text class="title" x="440" y="38">게임 트리와 몬테카를로 트리 탐색 (MCTS) 구조</text>

  <!-- Tree Structure (Left/Center) -->
  <!-- Level 0: Root Node (Current State s0) -->
  <g transform="translate(380, 95)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="26" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
    <text class="node-text" x="0" y="-3" fill="#ffffff">현재 상태</text>
    <text class="node-text" x="0" y="11" fill="#bfdbfe" font-size="9">Root s₀</text>
  </g>

  <!-- Level 1 Branches -->
  <line x1="365" y1="120" x2="240" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-text" x="290" y="142">수 A₁</text>

  <line x1="380" y1="122" x2="380" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="edge-text" x="398" y="152" fill="#2563eb">수 A₂ (선택)</text>

  <line x1="395" y1="120" x2="520" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-text" x="470" y="142">수 A₃</text>

  <!-- Level 1 Nodes -->
  <g transform="translate(240, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="node-text" x="0" y="4">s₁</text>
  </g>

  <g transform="translate(380, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <text class="node-text" x="0" y="-2" fill="#1d4ed8">s₂</text>
    <text class="node-text" x="0" y="11" fill="#3b82f6" font-size="9">유망한 수</text>
  </g>

  <g transform="translate(520, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="node-text" x="0" y="4">s₃</text>
  </g>

  <!-- Level 2 Branches from s2 -->
  <line x1="370" y1="224" x2="320" y2="280" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="390" y1="224" x2="440" y2="280" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="edge-text" x="430" y="248" fill="#4338ca">상대 응수</text>

  <!-- Level 2 Nodes -->
  <g transform="translate(320, 300)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="node-text" x="0" y="4">s₂₁</text>
  </g>

  <g transform="translate(440, 300)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text class="node-text" x="0" y="4" fill="#3730a3">확장 노드</text>
  </g>

  <!-- Simulation / Playout (Dotted Line downwards to Terminal) -->
  <path d="M 440 322 L 440 400" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="445" y="345" width="115" height="22" rx="4" fill="#fef3c7" stroke="#fde68a"/>
  <text class="edge-text" x="502" y="360" fill="#b45309">롤아웃 (Playout)</text>

  <!-- Terminal State (Win/Loss) -->
  <g transform="translate(440, 420)" filter="url(#shadow)">
    <rect x="-45" y="-16" width="90" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text class="node-text" x="0" y="4" fill="#047857">승리 (+1)</text>
  </g>

  <!-- Backpropagation Arrow (Red arc going up) -->
  <path d="M 410 420 Q 280 340 360 100" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowBack)"/>
  <rect x="235" y="240" width="75" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text class="edge-text" x="272" y="254" fill="#dc2626" font-weight="bold">역전파 (W/N)</text>

  <!-- MCTS 4 Phases Panel (Right Side) -->
  <g transform="translate(710, 85)" filter="url(#shadow)">
    <rect x="-120" y="0" width="240" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="title" x="0" y="32" font-size="15" fill="#0f172a">MCTS 4단계 순환 과정</text>
    <line x1="-100" y1="45" x2="100" y2="45" stroke="#e2e8f0"/>

    <!-- Phase 1: Selection -->
    <g transform="translate(0, 65)">
      <rect x="-105" y="0" width="210" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text class="phase-title" x="0" y="20" fill="#1d4ed8">1. 선택 (Selection)</text>
      <text class="box-desc" x="0" y="38" fill="#2563eb">UCB1 공식에 따라 유망한 노드 탐색</text>
    </g>

    <!-- Phase 2: Expansion -->
    <g transform="translate(0, 130)">
      <rect x="-105" y="0" width="210" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
      <text class="phase-title" x="0" y="20" fill="#4338ca">2. 확장 (Expansion)</text>
      <text class="box-desc" x="0" y="38" fill="#4f46e5">새로운 자식 노드를 트리에 등록</text>
    </g>

    <!-- Phase 3: Simulation -->
    <g transform="translate(0, 195)">
      <rect x="-105" y="0" width="210" height="52" rx="8" fill="#fffbeb" stroke="#fde68a"/>
      <text class="phase-title" x="0" y="20" fill="#b45309">3. 시뮬레이션 (Simulation)</text>
      <text class="box-desc" x="0" y="38" fill="#d97706">게임 종료까지 무작위/신경망 롤아웃</text>
    </g>

    <!-- Phase 4: Backpropagation -->
    <g transform="translate(0, 260)">
      <rect x="-105" y="0" width="210" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
      <text class="phase-title" x="0" y="20" fill="#b91c1c">4. 역전파 (Backpropagation)</text>
      <text class="box-desc" x="0" y="38" fill="#dc2626">승패 결과를 부모 노드들의 승률에 반영</text>
    </g>
  </g>

  <!-- Bottom Annotation -->
  <text class="box-desc" x="440" y="475">알파고는 MCTS의 시뮬레이션을 정책망(Policy Net)과 가치망(Value Net)으로 대체하여 탐색 효율을 극대화함</text>
</svg>
