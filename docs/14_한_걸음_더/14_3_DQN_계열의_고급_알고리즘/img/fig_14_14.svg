<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 14.5px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowReward" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" fill="#ffffff" rx="16"/>

  <text class="title" x="440" y="38">강화 학습 기반 신경망 아키텍처 탐색 (NAS) 프레임워크</text>

  <!-- Controller Agent (Left: RNN Controller) -->
  <g transform="translate(220, 200)" filter="url(#shadow)">
    <rect x="-140" y="-110" width="280" height="220" rx="16" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
    <rect x="-120" y="-98" width="240" height="32" rx="8" fill="#eff6ff"/>
    <text class="box-title" x="0" y="-76" fill="#1d4ed8">제어기 에이전트 (Controller RNN)</text>

    <g transform="translate(0, -25)">
      <rect x="-115" y="0" width="230" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text class="box-title" x="0" y="20" fill="#0f172a">신경망 구조 텍스트 시퀀스 생성</text>
      <text class="box-desc" x="0" y="38" fill="#64748b">필터 수, 스트라이드, 연결 방식 등</text>
    </g>

    <g transform="translate(0, 35)">
      <rect x="-115" y="0" width="230" height="48" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text class="box-title" x="0" y="20" fill="#15803d">REINFORCE 정책 경사 갱신</text>
      <text class="box-desc" x="0" y="38" fill="#166534">∇_θ J(θ) = E[ ∇_θ log π_θ(a) · R ]</text>
    </g>
  </g>

  <!-- Forward Flow: Action (Generated Architecture) -->
  <path d="M 360 145 L 515 145" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  
  <g transform="translate(440, 120)">
    <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="flow-label" x="0" y="5" fill="#1d4ed8">행동 (Action)</text>
  </g>
  <text class="box-desc" x="440" y="165" fill="#2563eb">자식 신경망 구조 설계안</text>

  <!-- Environment (Right: Child Network Evaluation) -->
  <g transform="translate(660, 200)" filter="url(#shadow)">
    <rect x="-140" y="-110" width="280" height="220" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="-120" y="-98" width="240" height="32" rx="8" fill="#ecfdf5"/>
    <text class="box-title" x="0" y="-76" fill="#065f46">평가 환경 (Child Network 학습)</text>

    <g transform="translate(0, -25)">
      <rect x="-115" y="0" width="230" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text class="box-title" x="0" y="20" fill="#0f172a">생성된 아키텍처 인스턴스화</text>
      <text class="box-desc" x="0" y="38" fill="#64748b">학습 데이터셋으로 가중치 훈련</text>
    </g>

    <g transform="translate(0, 35)">
      <rect x="-115" y="0" width="230" height="48" rx="8" fill="#fffbeb" stroke="#fde68a"/>
      <text class="box-title" x="0" y="20" fill="#b45309">검증 데이터셋 정확도 측정</text>
      <text class="box-desc" x="0" y="38" fill="#92400e">목표 검증 정확도 (Accuracy)</text>
    </g>
  </g>

  <!-- Backward Flow: Reward (Validation Accuracy) -->
  <path d="M 520 255 L 365 255" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowReward)"/>
  
  <g transform="translate(440, 230)">
    <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text class="flow-label" x="0" y="5" fill="#15803d">보상 (Reward R)</text>
  </g>
  <text class="box-desc" x="440" y="280" fill="#166534">검증 정확도 수치 (예: 97.4%)</text>

  <!-- Bottom Annotation -->
  <text class="box-desc" x="440" y="375" fill="#334155" font-weight="600">RNN 에이전트가 더 높은 정확도를 내는 아키텍처 패턴을 생성하도록 REINFORCE 알고리즘이 가이드함</text>
  <text class="box-desc" x="440" y="395" fill="#64748b">사람의 직관적 설계를 뛰어넘는 최적의 신경망 구조(NASNet, MobileNet 등)를 인공지능이 스스로 발견</text>
</svg>
