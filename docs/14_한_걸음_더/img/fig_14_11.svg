<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
      .axis-tick { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 600; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; fill: #64748b; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="460" fill="#ffffff" rx="16"/>

  <text class="title" x="440" y="38">아타리 2600 벤치마크: 레인보우(Rainbow) 및 DQN 계열 기법 성능 비교</text>

  <!-- Chart Layout -->
  <g transform="translate(100, 70)">
    <!-- Y-axis gridlines & ticks -->
    <!-- 200% -->
    <line x1="0" y1="40" x2="520" y2="40" stroke="#f1f5f9" stroke-width="1.5"/>
    <text class="axis-tick" x="-15" y="44" text-anchor="end">200%</text>

    <!-- 150% -->
    <line x1="0" y1="95" x2="520" y2="95" stroke="#f1f5f9" stroke-width="1.5"/>
    <text class="axis-tick" x="-15" y="99" text-anchor="end">150%</text>

    <!-- 100% (Human Level Baseline) -->
    <line x1="0" y1="150" x2="520" y2="150" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text class="axis-tick" x="-15" y="154" text-anchor="end" font-weight="700" fill="#475569">100%</text>
    <text x="525" y="154" font-family="-apple-system, BlinkMacSystemFont, Pretendard, sans-serif" font-size="11" font-weight="600" fill="#64748b">인간 평균 수준 (Human Level)</text>

    <!-- 50% -->
    <line x1="0" y1="205" x2="520" y2="205" stroke="#f1f5f9" stroke-width="1.5"/>
    <text class="axis-tick" x="-15" y="209" text-anchor="end">50%</text>

    <!-- 0% (Baseline) -->
    <line x1="0" y1="260" x2="520" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="axis-tick" x="-15" y="264" text-anchor="end">0%</text>

    <!-- X-axis Line -->
    <line x1="0" y1="260" x2="520" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Y-axis Line -->
    <line x1="0" y1="20" x2="0" y2="260" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Y-axis Title -->
    <text class="axis-title" x="-5" y="15" text-anchor="end">정규화 점수 (Median Human-Normalized Score)</text>

    <!-- X-axis Ticks -->
    <text class="axis-tick" x="0" y="280">0</text>
    <line x1="0" y1="260" x2="0" y2="265" stroke="#94a3b8"/>

    <text class="axis-tick" x="104" y="280">40M</text>
    <line x1="104" y1="260" x2="104" y2="265" stroke="#94a3b8"/>

    <text class="axis-tick" x="208" y="280">80M</text>
    <line x1="208" y1="260" x2="208" y2="265" stroke="#94a3b8"/>

    <text class="axis-tick" x="312" y="280">120M</text>
    <line x1="312" y1="260" x2="312" y2="265" stroke="#94a3b8"/>

    <text class="axis-tick" x="416" y="280">160M</text>
    <line x1="416" y1="260" x2="416" y2="265" stroke="#94a3b8"/>

    <text class="axis-tick" x="520" y="280">200M</text>
    <line x1="520" y1="260" x2="520" y2="265" stroke="#94a3b8"/>

    <text class="axis-title" x="260" y="305" text-anchor="middle">학습 프레임 수 (Millions of Frames)</text>

    <!-- Performance Curves -->
    <!-- 1. DQN (Grey/Slate) -->
    <path d="M 0 260 Q 100 240 200 225 T 520 205" fill="none" stroke="#94a3b8" stroke-width="2"/>

    <!-- 2. Double DQN (Sky Blue) -->
    <path d="M 0 260 Q 80 230 200 200 T 520 180" fill="none" stroke="#0ea5e9" stroke-width="2"/>

    <!-- 3. Dueling DQN (Emerald) -->
    <path d="M 0 260 Q 70 210 200 180 T 520 160" fill="none" stroke="#10b981" stroke-width="2"/>

    <!-- 4. Prioritized (Amber) -->
    <path d="M 0 260 Q 60 190 200 160 T 520 145" fill="none" stroke="#f59e0b" stroke-width="2"/>

    <!-- 5. Distributional C51 (Violet) -->
    <path d="M 0 260 Q 50 170 180 130 T 520 120" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>

    <!-- 6. Rainbow (Vibrant Crimson / Multi-color accent) -->
    <path d="M 0 260 Q 30 110 100 55 T 260 25 T 520 15" fill="none" stroke="#e11d48" stroke-width="3.5"/>

    <!-- Rainbow Peak Marker -->
    <circle cx="520" cy="15" r="5" fill="#e11d48"/>
    <rect x="440" y="-8" width="75" height="20" rx="4" fill="#ffe4e6" stroke="#fda4af"/>
    <text x="477" y="6" font-family="-apple-system, BlinkMacSystemFont, Pretendard, sans-serif" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">약 230% 달성</text>
  </g>

  <!-- Legend Box (Right Column) -->
  <g transform="translate(680, 95)" filter="url(#shadow)">
    <rect x="-15" y="-15" width="185" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="75" y="10" font-family="-apple-system, BlinkMacSystemFont, Pretendard, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">알고리즘 범례</text>
    <line x1="0" y1="20" x2="155" y2="20" stroke="#e2e8f0"/>

    <!-- Rainbow -->
    <line x1="5" y1="40" x2="30" y2="40" stroke="#e11d48" stroke-width="3.5"/>
    <circle cx="17" cy="40" r="3.5" fill="#e11d48"/>
    <text class="legend-text" x="38" y="44" fill="#e11d48" font-weight="bold">Rainbow</text>

    <!-- Distributional C51 -->
    <line x1="5" y1="70" x2="30" y2="70" stroke="#8b5cf6" stroke-width="2.5"/>
    <text class="legend-text" x="38" y="74" fill="#7c3aed">Distributional</text>

    <!-- Prioritized Replay -->
    <line x1="5" y1="100" x2="30" y2="100" stroke="#f59e0b" stroke-width="2"/>
    <text class="legend-text" x="38" y="104" fill="#d97706">Prioritized Replay</text>

    <!-- Dueling -->
    <line x1="5" y1="130" x2="30" y2="130" stroke="#10b981" stroke-width="2"/>
    <text class="legend-text" x="38" y="134" fill="#059669">Dueling</text>

    <!-- Double DQN -->
    <line x1="5" y1="160" x2="30" y2="160" stroke="#0ea5e9" stroke-width="2"/>
    <text class="legend-text" x="38" y="164" fill="#0284c7">Double DQN</text>

    <!-- DQN (2015) -->
    <line x1="5" y1="190" x2="30" y2="190" stroke="#94a3b8" stroke-width="2"/>
    <text class="legend-text" x="38" y="194" fill="#64748b">DQN (Nature)</text>
  </g>

  <!-- Bottom Annotation -->
  <text class="desc" x="440" y="435">레인보우는 개별 확장 기법들의 장점을 상호 보완적으로 융합하여, 학습 속도와 최종 성능 모두에서 비약적인 도약을 증명함</text>
</svg>
