<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-style: italic; text-anchor: middle; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="340" fill="#ffffff" rx="16"/>

  <text class="title" x="440" y="38">연속 행동 공간: 정책 신경망의 확률 분포 출력과 샘플링</text>

  <!-- 1. State Input -->
  <g transform="translate(100, 180)" filter="url(#shadow)">
    <rect x="-50" y="-45" width="100" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text class="box-title" x="0" y="-10" fill="#1d4ed8">상태 s</text>
    <text class="box-desc" x="0" y="10" fill="#2563eb">State Input</text>
    <text class="box-desc" x="0" y="26" fill="#64748b">환경 관측치</text>
  </g>

  <!-- Arrow -->
  <path d="M 150 180 L 210 180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Policy Neural Network -->
  <g transform="translate(290, 180)" filter="url(#shadow)">
    <rect x="-80" y="-55" width="160" height="110" rx="14" fill="#f8fafc" stroke="#6366f1" stroke-width="2"/>
    <rect x="-65" y="-45" width="130" height="24" rx="6" fill="#e0e7ff"/>
    <text class="box-title" x="0" y="-28" fill="#4338ca">정책 신경망 π_θ</text>
    <text class="box-desc" x="0" y="5" fill="#475569">완전 연결 계층 / 합성곱</text>
    <text class="box-desc" x="0" y="24" fill="#64748b">분포 모수(Parameter) 추정</text>
    <text class="math" x="0" y="44" fill="#4f46e5">μ_θ(s), σ_θ(s)</text>
  </g>

  <!-- Arrow -->
  <path d="M 370 180 L 430 180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Gaussian Probability Distribution -->
  <g transform="translate(550, 180)" filter="url(#shadow)">
    <rect x="-110" y="-70" width="220" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="box-title" x="0" y="-48" fill="#0f172a">정규분포 N(μ, σ²)</text>
    <text class="box-desc" x="0" y="-32" fill="#64748b">평균 μ = 1.7, 표준편차 σ = 0.3</text>

    <!-- Gaussian Curve Drawing -->
    <!-- Axis -->
    <line x1="-90" y1="40" x2="90" y2="40" stroke="#94a3b8" stroke-width="1"/>
    <!-- Bell Curve -->
    <path d="M -80 39 Q -50 38 -30 20 Q -10 -5 0 -25 Q 10 -5 30 20 Q 50 38 80 39 Z" fill="url(#bellGrad)"/>
    <path d="M -80 39 Q -50 38 -30 20 Q -10 -5 0 -25 Q 10 -5 30 20 Q 50 38 80 39" fill="none" stroke="#2563eb" stroke-width="2"/>
    
    <!-- Mean line -->
    <line x1="0" y1="-25" x2="0" y2="40" stroke="#2563eb" stroke-dasharray="3,2"/>
    <text class="axis-label" x="0" y="52">μ = 1.7</text>

    <!-- Sampled Point -->
    <line x1="20" y1="10" x2="20" y2="40" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="20" cy="10" r="4" fill="#dc2626"/>
    <text class="axis-label" x="20" y="52" fill="#dc2626" font-weight="700">샘플링</text>
  </g>

  <!-- Arrow -->
  <path d="M 660 180 L 720 180" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Sampled Continuous Action -->
  <g transform="translate(790, 180)" filter="url(#shadow)">
    <rect x="-60" y="-45" width="120" height="90" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text class="box-title" x="0" y="-12" fill="#b91c1c">선택된 행동 a</text>
    <text class="math" x="0" y="12" fill="#dc2626" font-size="18" font-weight="bold">a = 1.82</text>
    <text class="box-desc" x="0" y="28" fill="#991b1b">연속 제어 신호</text>
  </g>
</svg>
