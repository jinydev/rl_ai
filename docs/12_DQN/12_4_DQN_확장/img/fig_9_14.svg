<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
    <filter id="p-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="380" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">Dueling DQN의 이점: 불가피한 실점 상황에서의 상태 가치 학습</text>
  <text x="380" y="62" class="desc" text-anchor="middle">공이 패들 뒤로 지나쳐 어떤 행동을 취해도 실점이 확정된 상황</text>

  <!-- Screen showing lost ball -->
  <g transform="translate(180, 85)" filter="url(#p-sh)">
    <rect width="400" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="3"/>

    <!-- Enemy paddle left -->
    <rect x="30" y="70" width="10" height="45" rx="2" fill="#ef4444"/>

    <!-- Player paddle right (missed position) -->
    <rect x="330" y="30" width="10" height="45" rx="2" fill="#10b981"/>

    <!-- Ball has passed paddle, heading to goal line -->
    <rect x="375" y="170" width="10" height="10" rx="2" fill="#fbbf24"/>
    <path d="M 330 140 L 375 170" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Red Alert Zone -->
    <rect x="320" y="130" width="70" height="85" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="355" y="120" class="desc" text-anchor="middle" font-weight="700" fill="#ef4444">실점 불가피</text>
  </g>

  <!-- Explanation note -->
  <text x="380" y="345" class="desc" text-anchor="middle" font-weight="600" fill="#334155">모든 개별 행동 Q(s, a)를 각각 시도해보지 않고도 상태 가치 V(s) &lt; 0 하나만으로 전체 패배 가치를 즉시 학습</text>
</svg>