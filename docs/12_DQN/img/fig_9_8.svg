<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .axis-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .tick { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
    <filter id="rw-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="400" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">&lt;카트 폴&gt; 단일 실험의 에피소드별 보상 총합 추이</text>
  <text x="380" y="62" class="desc" text-anchor="middle">학습이 진행됨에 따라 보상이 증가하지만, 단일 실험은 탐색 노이즈로 변동폭이 큼</text>

  <g transform="translate(90, 85)" filter="url(#rw-sh)">
    <rect width="600" height="250" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Grid lines -->
    <line x1="0" y1="50" x2="600" y2="50" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="100" x2="600" y2="100" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="150" x2="600" y2="150" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Max score line 200 -->
    <line x1="0" y1="50" x2="600" y2="50" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="590" y="42" class="desc" text-anchor="end" font-weight="700" fill="#059669">최대 한계 점수 (200)</text>

    <!-- Axes -->
    <line x1="0" y1="250" x2="600" y2="250" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="250" stroke="#475569" stroke-width="2"/>

    <!-- X Ticks -->
    <text x="0" y="270" class="tick" text-anchor="middle">0</text>
    <text x="150" y="270" class="tick" text-anchor="middle">75</text>
    <text x="300" y="270" class="tick" text-anchor="middle">150</text>
    <text x="450" y="270" class="tick" text-anchor="middle">225</text>
    <text x="600" y="270" class="tick" text-anchor="middle">300</text>
    <text x="300" y="295" class="axis-lbl" text-anchor="middle">에피소드</text>

    <!-- Y Ticks -->
    <text x="-12" y="254" class="tick" text-anchor="end">0</text>
    <text x="-12" y="204" class="tick" text-anchor="end">50</text>
    <text x="-12" y="154" class="tick" text-anchor="end">100</text>
    <text x="-12" y="104" class="tick" text-anchor="end">150</text>
    <text x="-12" y="54" class="tick" text-anchor="end">200</text>
    <text x="-40" y="125" class="axis-lbl" text-anchor="middle" transform="rotate(-90, -40, 125)">보상 총합</text>

    <!-- Noisy Single Reward Path -->
    <path d="M 0 240 L 20 235 L 40 230 L 60 220 L 80 235 L 100 210 L 120 190 L 140 215 L 160 170 L 180 180 L 200 130 L 220 160 L 240 100 L 260 80 L 280 140 L 300 65 L 320 90 L 340 55 L 360 50 L 380 70 L 400 50 L 420 50 L 440 60 L 460 50 L 480 50 L 500 75 L 520 50 L 540 50 L 560 50 L 580 50 L 600 50" fill="none" stroke="#3b82f6" stroke-width="2"/>
  </g>
</svg>