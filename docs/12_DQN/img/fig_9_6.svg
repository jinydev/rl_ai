<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .code-txt { font-family: "SF Mono", Menlo, monospace; font-size: 13px; fill: #1e293b; }
      .shape-txt { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #1d4ed8; }
    </style>
    <filter id="box-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">미니배치 원소를 np.ndarray 로 분리 변환하는 구조</text>
  <text x="380" y="62" class="desc" text-anchor="middle">튜플 목록 [(s, a, r, s'), ...] 을 텐서 연산을 위해 각 항목별 다차원 배열로 분리 스택</text>

  <g transform="translate(60, 95)" filter="url(#box-sh)">
    <!-- Input: sampled list of tuples -->
    <rect x="0" y="0" width="260" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="130" y="28" class="desc" text-anchor="middle" font-weight="700" fill="#334155">샘플링된 배치 리스트 (B = 3)</text>
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="230" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe"/><text x="115" y="22" class="code-txt" text-anchor="middle">(s₇, a₇, r₇, s₈)</text>
      <rect x="0" y="45" width="230" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe"/><text x="115" y="67" class="code-txt" text-anchor="middle">(s₂, a₂, r₂, s₃)</text>
      <rect x="0" y="90" width="230" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe"/><text x="115" y="112" class="code-txt" text-anchor="middle">(s₅, a₅, r₅, s₆)</text>
    </g>

    <!-- Output Separated Arrays -->
    <g transform="translate(340, 0)">
      <rect x="0" y="0" width="300" height="35" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="15" y="22" class="code-txt">state</text>
      <text x="280" y="22" class="shape-txt" text-anchor="end">shape: (B, 4)</text>

      <rect x="0" y="45" width="300" height="35" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="15" y="67" class="code-txt">action</text>
      <text x="280" y="67" class="shape-txt" text-anchor="end">shape: (B,)</text>

      <rect x="0" y="90" width="300" height="35" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="15" y="112" class="code-txt">reward</text>
      <text x="280" y="112" class="shape-txt" text-anchor="end">shape: (B, 1)</text>

      <rect x="0" y="135" width="300" height="35" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="15" y="157" class="code-txt">next_state</text>
      <text x="280" y="157" class="shape-txt" text-anchor="end">shape: (B, 4)</text>
    </g>

    <!-- Transition arrows -->
    <path d="M 270 90 L 325 90" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-er)"/>
    <text x="297" y="80" class="desc" text-anchor="middle" font-size="11">언패킹</text>
  </g>
</svg>