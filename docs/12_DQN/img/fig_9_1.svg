<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 12px; fill: #64748b; }
      .badge-txt { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    </style>
    <filter id="card-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="840" height="440" fill="#ffffff" rx="16"/>

  <text x="420" y="38" class="title" text-anchor="middle">OpenAI Gym / Gymnasium 강화 학습 환경 스위트</text>
  <text x="420" y="62" class="desc" text-anchor="middle">표준화된 Python API (reset, step, render) 기반의 공통 벤치마크 환경</text>

  <!-- 4 Category Cards -->
  <g transform="translate(60, 90)">
    <!-- Card 1: Classic Control (CartPole, MountainCar) -->
    <g transform="translate(0, 0)" filter="url(#card-sh)">
      <rect width="340" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="20" y="15" width="110" height="22" rx="11" fill="#3b82f6"/>
      <text x="75" y="30" class="badge-txt" text-anchor="middle">Classic Control</text>
      <text x="20" y="65" class="card-title">CartPole-v0 / v1</text>
      <text x="20" y="88" class="card-sub">• 4차원 저차원 물리 상태 벡터 (x, v, θ, ω)</text>
      <text x="20" y="108" class="card-sub">• 이산 행동: 카트 좌/우 힘 (0, 1)</text>
    </g>

    <!-- Card 2: Atari 2600 (Pong, Breakout) -->
    <g transform="translate(380, 0)" filter="url(#card-sh)">
      <rect width="340" height="140" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
      <rect x="20" y="15" width="90" height="22" rx="11" fill="#ec4899"/>
      <text x="65" y="30" class="badge-txt" text-anchor="middle">Atari 2600</text>
      <text x="20" y="65" class="card-title">Pong / Breakout / Space Invaders</text>
      <text x="20" y="88" class="card-sub">• 고차원 원시 픽셀 이미지 입력 (84×84×4)</text>
      <text x="20" y="108" class="card-sub">• CNN 기반 심층 Q 네트워크의 핵심 벤치마크</text>
    </g>

    <!-- Card 3: Box2D (LunarLander) -->
    <g transform="translate(0, 160)" filter="url(#card-sh)">
      <rect width="340" height="140" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
      <rect x="20" y="15" width="80" height="22" rx="11" fill="#10b981"/>
      <text x="60" y="30" class="badge-txt" text-anchor="middle">Box2D</text>
      <text x="20" y="65" class="card-title">LunarLander / BipedalWalker</text>
      <text x="20" y="88" class="card-sub">• 2D 강체 물리 엔진 기반 착륙/보행 제어</text>
      <text x="20" y="108" class="card-sub">• 이산 및 연속 제어 문제 제공</text>
    </g>

    <!-- Card 4: MuJoCo (Ant, HalfCheetah) -->
    <g transform="translate(380, 160)" filter="url(#card-sh)">
      <rect width="340" height="140" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
      <rect x="20" y="15" width="80" height="22" rx="11" fill="#a855f7"/>
      <text x="60" y="30" class="badge-txt" text-anchor="middle">MuJoCo</text>
      <text x="20" y="65" class="card-title">HalfCheetah / Ant / Humanoid</text>
      <text x="20" y="88" class="card-sub">• 고성능 3D 다관절 물리 시뮬레이션</text>
      <text x="20" y="108" class="card-sub">• 연속 액션(Continuous Action) 심층 강화 학습</text>
    </g>
  </g>

  <!-- Bottom Common API -->
  <text x="420" y="420" class="desc" text-anchor="middle" font-weight="600" fill="#334155">공통 표준 인터페이스: state = env.reset() | next_state, reward, done, info = env.step(action)</text>
</svg>