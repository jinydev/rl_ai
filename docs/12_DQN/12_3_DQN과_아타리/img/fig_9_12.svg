<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .axis-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .tick { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
    <filter id="eps-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="380" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">DQN의 ε-탐욕 감쇠 스케줄 (Linear Epsilon Decay)</text>
  <text x="380" y="62" class="desc" text-anchor="middle">초기 100만 스텝까지 탐색(ε=1.0) 비중을 선형 감소시킨 뒤 0.1로 고정하여 활용 촉진</text>

  <g transform="translate(90, 85)" filter="url(#eps-sh)">
    <rect width="600" height="230" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Grid lines -->
    <line x1="0" y1="40" x2="600" y2="40" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="120" x2="600" y2="120" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Vertical line at 1M steps (x = 300) -->
    <line x1="300" y1="0" x2="300" y2="230" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="300" y="24" class="desc" text-anchor="middle" font-weight="700" fill="#b45309">100만 단계 (감소 종료)</text>

    <!-- Axes -->
    <line x1="0" y1="230" x2="600" y2="230" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="230" stroke="#475569" stroke-width="2"/>

    <!-- X Ticks -->
    <text x="0" y="250" class="tick" text-anchor="middle">0</text>
    <text x="150" y="250" class="tick" text-anchor="middle">500K</text>
    <text x="300" y="250" class="tick" text-anchor="middle">1.0M</text>
    <text x="450" y="250" class="tick" text-anchor="middle">1.5M</text>
    <text x="600" y="250" class="tick" text-anchor="middle">2.0M</text>
    <text x="300" y="275" class="axis-lbl" text-anchor="middle">학습 단계 수 (Steps)</text>

    <!-- Y Ticks -->
    <text x="-12" y="234" class="tick" text-anchor="end">0.0</text>
    <text x="-12" y="204" class="tick" text-anchor="end">0.1</text>
    <text x="-12" y="124" class="tick" text-anchor="end">0.5</text>
    <text x="-12" y="44" class="tick" text-anchor="end">1.0</text>
    <text x="-35" y="115" class="axis-lbl" text-anchor="middle" transform="rotate(-90, -35, 115)">탐색 확률 ε</text>

    <!-- Epsilon decay path: (0, 40) -> (300, 200) -> (600, 200) -->
    <path d="M 0 40 L 300 200 L 600 200" fill="none" stroke="#2563eb" stroke-width="3.5"/>
    <circle cx="0" cy="40" r="5" fill="#2563eb"/>
    <circle cx="300" cy="200" r="5" fill="#2563eb"/>
  </g>
</svg>