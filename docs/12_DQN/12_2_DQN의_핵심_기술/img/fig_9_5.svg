<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .box-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
    </style>
    <marker id="arr-er" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <filter id="er-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="840" height="420" fill="#ffffff" rx="16"/>

  <text x="420" y="38" class="title" text-anchor="middle">DQN 핵심 기술 1: 경험 재생(Experience Replay)의 학습 흐름</text>
  <text x="420" y="62" class="desc" text-anchor="middle">에피소드 전이 데이터를 큐 버퍼에 축적하고 무작위 샘플링하여 데이터 상관관계를 파괴</text>

  <g transform="translate(50, 90)" filter="url(#er-sh)">
    <!-- 1. Environment & Agent Interaction -->
    <rect x="0" y="20" width="160" height="140" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="15" y="35" width="130" height="45" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="62" class="box-txt" fill="#1d4ed8" font-size="13">에이전트 (행동 A_t)</text>
    
    <path d="M 80 80 L 80 95" stroke="#64748b" stroke-width="2" marker-end="url(#arr-er)"/>

    <rect x="15" y="100" width="130" height="45" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="80" y="127" class="box-txt" fill="#047857" font-size="13">환경 (S_t+1, R_t)</text>

    <!-- Arrow to Buffer -->
    <path d="M 160 90 L 220 90" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr-er)"/>
    <text x="190" y="78" class="desc" text-anchor="middle" font-size="11">전이 데이터 추가</text>

    <!-- 2. Replay Buffer (Circular Buffer Queue) -->
    <rect x="230" y="0" width="220" height="180" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="340" y="30" class="box-txt" fill="#b45309">경험 재생 버퍼 (Replay Buffer)</text>
    <text x="340" y="50" class="sub-txt">최대 용량 N (예: 10,000)</text>

    <!-- Slots in buffer -->
    <g transform="translate(245, 65)">
      <rect x="0" y="0" width="190" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="95" y="15" class="sub-txt" font-family="monospace">(S₀, A₀, R₀, S₁)</text>
      <rect x="0" y="26" width="190" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="95" y="41" class="sub-txt" font-family="monospace">(S₁, A₁, R₁, S₂)</text>
      <rect x="0" y="52" width="190" height="22" rx="4" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/><text x="95" y="67" class="sub-txt" font-family="monospace" font-weight="700">(S_t, A_t, R_t, S_t+1) ★</text>
      <rect x="0" y="78" width="190" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="95" y="93" class="sub-txt" font-family="monospace">...</text>
    </g>

    <!-- Arrow to Mini-batch -->
    <path d="M 450 90 L 510 90" stroke="#f59e0b" stroke-width="3" marker-end="url(#arr-er)"/>
    <text x="480" y="78" class="desc" text-anchor="middle" font-size="11">무작위 균일 추출</text>

    <!-- 3. Mini-batch Box -->
    <rect x="520" y="25" width="130" height="130" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="585" y="60" class="box-txt" fill="#047857">미니배치</text>
    <text x="585" y="85" class="sub-txt">배치 크기 = 32</text>
    <text x="585" y="105" class="sub-txt">(비상관화 완료)</text>

    <!-- Arrow to NN -->
    <path d="M 650 90 L 700 90" stroke="#10b981" stroke-width="3" marker-end="url(#arr-er)"/>

    <!-- 4. Q-Network Box -->
    <rect x="710" y="20" width="80" height="140" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="750" y="75" class="box-txt" fill="#be185d" font-size="13">신경망<tspan x="750" dy="20">Q(s, a)</tspan><tspan x="750" dy="20">갱신</tspan></text>
  </g>

  <!-- Explanation Bottom -->
  <text x="420" y="340" class="desc" text-anchor="middle" font-weight="600" fill="#334155">효과: 1) 데이터 효율성 극대화 (한 번 경험한 데이터를 여러 번 재사용)  2) 연속된 데이터 간 상관관계 파괴로 학습 안정화</text>
</svg>