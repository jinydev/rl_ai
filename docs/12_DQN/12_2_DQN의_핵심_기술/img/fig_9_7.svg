<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .code-lbl { font-family: "SF Mono", Menlo, monospace; font-size: 14px; font-weight: 700; fill: #1e293b; }
      .val-txt { font-family: "SF Mono", monospace; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
    </style>
    <filter id="idx-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">q = qs[np.arange(batch_size), action] 인덱싱 메커니즘</text>
  <text x="380" y="62" class="desc" text-anchor="middle">배치 내 각 샘플에 대해 에이전트가 실제로 취한 행동(action)의 Q값만 추출</text>

  <g transform="translate(60, 95)" filter="url(#idx-sh)">
    <!-- 1. qs matrix (B x 2) -->
    <rect x="0" y="0" width="220" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="110" y="25" class="code-lbl" text-anchor="middle">qs (Q값 행렬)</text>
    <text x="60" y="48" class="desc" font-size="11" text-anchor="middle">행동 0 (좌)</text>
    <text x="160" y="48" class="desc" font-size="11" text-anchor="middle">행동 1 (우)</text>

    <g transform="translate(15, 60)">
      <!-- Row 0: action=0 chosen -->
      <rect x="0" y="0" width="90" height="24" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="2"/><text x="45" y="12" class="val-txt" fill="#15803d">0.1 ★</text>
      <rect x="100" y="0" width="90" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="145" y="12" class="val-txt">0.3</text>
      <!-- Row 1: action=1 chosen -->
      <rect x="0" y="30" width="90" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="45" y="42" class="val-txt">0.5</text>
      <rect x="100" y="30" width="90" height="24" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="2"/><text x="145" y="42" class="val-txt" fill="#15803d">0.6 ★</text>
      <!-- Row 2: action=0 chosen -->
      <rect x="0" y="60" width="90" height="24" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="2"/><text x="45" y="72" class="val-txt" fill="#15803d">0.2 ★</text>
      <rect x="100" y="60" width="90" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="145" y="72" class="val-txt">0.8</text>
      <!-- Row 3: action=1 chosen -->
      <rect x="0" y="90" width="90" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="45" y="102" class="val-txt">0.7</text>
      <rect x="100" y="90" width="90" height="24" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="2"/><text x="145" y="102" class="val-txt" fill="#15803d">0.3 ★</text>
    </g>

    <!-- 2. Action Vector -->
    <rect x="260" y="0" width="120" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="320" y="25" class="code-lbl" text-anchor="middle">action</text>
    <g transform="translate(280, 60)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/><text x="40" y="12" class="val-txt">0</text>
      <rect x="0" y="30" width="80" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/><text x="40" y="42" class="val-txt">1</text>
      <rect x="0" y="60" width="80" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/><text x="40" y="72" class="val-txt">0</text>
      <rect x="0" y="90" width="80" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/><text x="40" y="102" class="val-txt">1</text>
    </g>

    <!-- Equal Symbol -->
    <text x="415" y="100" class="title" fill="#64748b">=</text>

    <!-- 3. Output vector q -->
    <rect x="450" y="0" width="180" height="180" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="540" y="25" class="code-lbl" fill="#047857" text-anchor="middle">q (선택된 Q값)</text>
    <g transform="translate(480, 60)">
      <rect x="0" y="0" width="120" height="24" rx="4" fill="#10b981"/><text x="60" y="12" class="val-txt" fill="#ffffff">0.1</text>
      <rect x="0" y="30" width="120" height="24" rx="4" fill="#10b981"/><text x="60" y="42" class="val-txt" fill="#ffffff">0.6</text>
      <rect x="0" y="60" width="120" height="24" rx="4" fill="#10b981"/><text x="60" y="72" class="val-txt" fill="#ffffff">0.2</text>
      <rect x="0" y="90" width="120" height="24" rx="4" fill="#10b981"/><text x="60" y="102" class="val-txt" fill="#ffffff">0.3</text>
    </g>
  </g>
</svg>