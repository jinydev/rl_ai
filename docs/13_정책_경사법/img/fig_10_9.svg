<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .col-h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .item-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #334155; }
    </style>
    <filter id="tax-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="880" height="400" fill="#ffffff" rx="16"/>

  <text x="440" y="38" class="title" text-anchor="middle">강화 학습 알고리즘의 주요 패러다임 분류</text>
  <text x="440" y="62" class="desc" text-anchor="middle">가치 기반 기법, 정책 기반 기법, 그리고 둘을 융합한 행위자-비평자(Actor-Critic)</text>

  <g transform="translate(60, 95)" filter="url(#tax-sh)">
    <!-- 1. Value-based -->
    <rect x="0" y="0" width="230" height="230" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="115" y="35" class="col-h" fill="#1d4ed8">가치 기반 (Value-based)</text>
    <g transform="translate(20, 60)">
      <text x="0" y="20" class="item-t">• 가치 함수 Q(s, a)를 학습</text>
      <text x="0" y="45" class="item-t">• argmax로 간접 정책 결정</text>
      <text x="0" y="70" class="item-t">• 이산 행동 공간에 적합</text>
      <text x="0" y="105" class="item-t" font-weight="700" fill="#1d4ed8">대표 알고리즘:</text>
      <text x="0" y="130" class="item-t" font-family="monospace">Q-learning, SARSA, DQN</text>
    </g>

    <!-- 2. Policy-based -->
    <rect x="265" y="0" width="230" height="230" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="380" y="35" class="col-h" fill="#be185d">정책 기반 (Policy-based)</text>
    <g transform="translate(285, 60)">
      <text x="0" y="20" class="item-t">• 정책 π_θ(a|s)를 직접 매개변수화</text>
      <text x="0" y="45" class="item-t">• 확률적 행동 및 연속 공간 제어</text>
      <text x="0" y="70" class="item-t">• 에피소드 수익 분산이 큰 편</text>
      <text x="0" y="105" class="item-t" font-weight="700" fill="#be185d">대표 알고리즘:</text>
      <text x="0" y="130" class="item-t" font-family="monospace">REINFORCE, Policy Gradient</text>
    </g>

    <!-- 3. Actor-Critic (Hybrid) -->
    <rect x="530" y="0" width="230" height="230" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5"/>
    <text x="645" y="35" class="col-h" fill="#047857">행위자-비평자 (Actor-Critic)</text>
    <g transform="translate(550, 60)">
      <text x="0" y="20" class="item-t">• Actor: 정책 π_θ 갱신 (행동)</text>
      <text x="0" y="45" class="item-t">• Critic: 가치 V_w 평가 (비평)</text>
      <text x="0" y="70" class="item-t">• TD 오차로 1단계마다 즉시 갱신</text>
      <text x="0" y="105" class="item-t" font-weight="700" fill="#047857">대표 알고리즘:</text>
      <text x="0" y="130" class="item-t" font-family="monospace">A2C, A3C, PPO, SAC</text>
    </g>
  </g>
</svg>