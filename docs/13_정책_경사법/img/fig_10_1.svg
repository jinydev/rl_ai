<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .math-txt { font-family: "Cambria Math", "Latin Modern Math", serif; font-size: 17px; font-weight: 700; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
    <filter id="pg-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="880" height="320" fill="#ffffff" rx="16"/>

  <text x="440" y="38" class="title" text-anchor="middle">가장 간단한 정책 경사법의 기울기 계산 구조</text>
  <text x="440" y="62" class="desc" text-anchor="middle">에피소드 전체 보상 G(τ)를 가중치로 삼아 각 타임스텝의 로그 정책 기울기를 가산</text>

  <!-- Step Boxes -->
  <g transform="translate(50, 100)" filter="url(#pg-sh)">
    <!-- Term 1: t=0 -->
    <rect x="0" y="0" width="220" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="15" y="-10" width="60" height="20" rx="10" fill="#3b82f6"/><text x="45" y="4" class="badge-txt">t = 0</text>
    <text x="110" y="48" class="math-txt" fill="#1d4ed8">G(τ) ∇_θ log π_θ(A₀|S₀)</text>

    <text x="245" y="48" class="math-txt" font-size="24" fill="#64748b">+</text>

    <!-- Term 2: t=1 -->
    <rect x="270" y="0" width="220" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="285" y="-10" width="60" height="20" rx="10" fill="#3b82f6"/><text x="315" y="4" class="badge-txt">t = 1</text>
    <text x="380" y="48" class="math-txt" fill="#1d4ed8">G(τ) ∇_θ log π_θ(A₁|S₁)</text>

    <text x="515" y="48" class="math-txt" font-size="24" fill="#64748b">+</text>

    <!-- Term 3: ... + t=T -->
    <rect x="540" y="0" width="240" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="555" y="-10" width="60" height="20" rx="10" fill="#3b82f6"/><text x="585" y="4" class="badge-txt">t = T</text>
    <text x="660" y="48" class="math-txt" fill="#1d4ed8">G(τ) ∇_θ log π_θ(A_T|S_T)</text>
  </g>

  <!-- Explanation note -->
  <text x="440" y="245" class="desc" text-anchor="middle" font-weight="600" fill="#334155">에피소드 총 수익 G(τ)가 크면 해당 에피소드에서 취한 모든 행동들의 발생 확률 π_θ(a|s)를 동시에 강화</text>
  <text x="440" y="275" class="desc" text-anchor="middle" fill="#64748b">매개변수 갱신식: θ ← θ + α ∇_θ J(θ)</text>
</svg>