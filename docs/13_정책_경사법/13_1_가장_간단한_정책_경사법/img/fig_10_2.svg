<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .axis-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .tick { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
    <filter id="plot-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="380" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">가장 간단한 정책 경사법: 에피소드별 보상 총합 추이 (단일 실행)</text>
  <text x="380" y="62" class="desc" text-anchor="middle">에피소드가 진행되면서 보상이 서서히 상승하지만 분산이 커서 변동폭이 극심함</text>

  <g transform="translate(90, 85)" filter="url(#plot-sh)">
    <rect width="600" height="230" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Grid lines -->
    <line x1="0" y1="46" x2="600" y2="46" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="92" x2="600" y2="92" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="138" x2="600" y2="138" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="184" x2="600" y2="184" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Max score line 200 -->
    <line x1="0" y1="46" x2="600" y2="46" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="590" y="38" class="desc" text-anchor="end" font-weight="700" fill="#059669">한계 보상 (200)</text>

    <!-- Axes -->
    <line x1="0" y1="230" x2="600" y2="230" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="230" stroke="#475569" stroke-width="2"/>

    <!-- X Ticks -->
    <text x="0" y="250" class="tick" text-anchor="middle">0</text>
    <text x="200" y="250" class="tick" text-anchor="middle">1000</text>
    <text x="400" y="250" class="tick" text-anchor="middle">2000</text>
    <text x="600" y="250" class="tick" text-anchor="middle">3000</text>
    <text x="300" y="275" class="axis-lbl" text-anchor="middle">에피소드</text>

    <!-- Y Ticks -->
    <text x="-12" y="234" class="tick" text-anchor="end">0</text>
    <text x="-12" y="188" class="tick" text-anchor="end">50</text>
    <text x="-12" y="142" class="tick" text-anchor="end">100</text>
    <text x="-12" y="96" class="tick" text-anchor="end">150</text>
    <text x="-12" y="50" class="tick" text-anchor="end">200</text>
    <text x="-40" y="115" class="axis-lbl" text-anchor="middle" transform="rotate(-90, -40, 115)">보상 총합</text>

    <!-- Raw oscillating path -->
    <path d="M 0 215 L 30 210 L 60 212 L 90 205 L 120 195 L 150 200 L 180 185 L 210 190 L 240 170 L 270 180 L 300 150 L 330 165 L 360 140 L 390 160 L 420 125 L 450 150 L 480 110 L 510 145 L 540 120 L 570 100 L 600 135" fill="none" stroke="#60a5fa" stroke-width="2"/>
  </g>
</svg>