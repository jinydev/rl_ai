<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .axis-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .tick { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
    <filter id="rf-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="880" height="400" fill="#ffffff" rx="16"/>

  <text x="440" y="38" class="main-title" text-anchor="middle">REINFORCE 알고리즘 학습 결과 (현재 시점 이후 보상 반영)</text>

  <!-- Left: Single Run -->
  <g transform="translate(60, 75)" filter="url(#rf-sh)">
    <rect width="360" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="180" y="28" class="col-title" text-anchor="middle">(a) 단일 실험 결과 (1회)</text>

    <g transform="translate(45, 45)">
      <line x1="0" y1="200" x2="280" y2="200" stroke="#475569" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="200" stroke="#475569" stroke-width="1.5"/>
      <line x1="0" y1="40" x2="280" y2="40" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="270" y="34" class="tick" fill="#059669" text-anchor="end">200</text>

      <text x="0" y="218" class="tick" text-anchor="middle">0</text>
      <text x="140" y="218" class="tick" text-anchor="middle">1000</text>
      <text x="280" y="218" class="tick" text-anchor="middle">2000</text>

      <path d="M 0 185 L 30 180 L 60 170 L 90 150 L 120 120 L 150 90 L 180 60 L 210 50 L 240 40 L 280 40" fill="none" stroke="#3b82f6" stroke-width="2"/>
    </g>
  </g>

  <!-- Right: 100-run Average -->
  <g transform="translate(460, 75)" filter="url(#rf-sh)">
    <rect width="360" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="180" y="28" class="col-title" text-anchor="middle">(b) 100회 실험 평균 결과</text>

    <g transform="translate(45, 45)">
      <line x1="0" y1="200" x2="280" y2="200" stroke="#475569" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="200" stroke="#475569" stroke-width="1.5"/>
      <line x1="0" y1="40" x2="280" y2="40" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="270" y="34" class="tick" fill="#059669" text-anchor="end">200</text>

      <text x="0" y="218" class="tick" text-anchor="middle">0</text>
      <text x="140" y="218" class="tick" text-anchor="middle">1000</text>
      <text x="280" y="218" class="tick" text-anchor="middle">2000</text>

      <!-- Smooth curve reaching 200 -->
      <path d="M 0 185 C 50 180, 100 130, 150 75 C 190 50, 230 42, 280 40" fill="none" stroke="#10b981" stroke-width="3.5"/>
    </g>
  </g>

  <text x="440" y="375" class="axis-lbl" text-anchor="middle" font-weight="600" fill="#334155">REINFORCE는 현재 시각 t 이전의 과거 보상을 제외함으로써 분산을 획기적으로 낮추어 200점에 빠르게 수렴합니다.</text>
</svg>