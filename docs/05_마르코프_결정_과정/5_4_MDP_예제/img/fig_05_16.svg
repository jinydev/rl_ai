<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <!-- Deterministic policy patterns matrix -->
  <g transform="translate(50, 20)">
    <rect x="0" y="0" width="400" height="200" fill="#ffffff" stroke="#2d3748" stroke-width="2.5" rx="4"/>
    <!-- Header -->
    <rect x="0" y="0" width="400" height="40" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
    <text x="220" y="26" font-family="Georgia, serif" font-size="16" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">s = L1</text>
    <text x="340" y="26" font-family="Georgia, serif" font-size="16" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">s = L2</text>
    
    <!-- Dividers -->
    <line x1="160" y1="0" x2="160" y2="200" stroke="#2d3748" stroke-width="1.5"/>
    <line x1="280" y1="0" x2="280" y2="200" stroke="#2d3748" stroke-width="1.5"/>
    
    <line x1="0" y1="80" x2="400" y2="80" stroke="#2d3748" stroke-width="1"/>
    <line x1="0" y1="120" x2="400" y2="120" stroke="#2d3748" stroke-width="1"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke="#2d3748" stroke-width="1"/>

    <!-- Row 1: mu1 -->
    <text x="80" y="65" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#2d3748" text-anchor="middle">μ1(s)</text>
    <text x="220" y="65" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">Right</text>
    <text x="340" y="65" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">Right</text>

    <!-- Row 2: mu2 -->
    <text x="80" y="105" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#2d3748" text-anchor="middle">μ2(s)</text>
    <text x="220" y="105" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">Right</text>
    <text x="340" y="105" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">Left</text>

    <!-- Row 3: mu3 -->
    <text x="80" y="145" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#2d3748" text-anchor="middle">μ3(s)</text>
    <text x="220" y="145" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">Left</text>
    <text x="340" y="145" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">Right</text>

    <!-- Row 4: mu4 -->
    <text x="80" y="185" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#2d3748" text-anchor="middle">μ4(s)</text>
    <text x="220" y="185" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">Left</text>
    <text x="340" y="185" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">Left</text>
  </g>
</svg>