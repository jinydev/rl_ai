<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 30 17 C 20 12, 10 22, 15 37 C 18 47, 25 50, 30 47 C 35 50, 42 47, 45 37 C 50 22, 40 12, 30 17 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 30 17 Q 34 8 42 11" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 34 13 Q 41 9 42 16 C 39 18, 36 16, 34 13 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon -->
    <g id="agent">
      <rect x="12" y="17" width="36" height="32" rx="12" ry="12" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="23" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="37" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="21" cy="28" r="3" fill="#2d3748"/>
      <circle cx="35" cy="28" r="3" fill="#2d3748"/>
      <path d="M 27 38 Q 30 41 33 38" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
      <path d="M 28 39 Q 30 44 32 39 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 16 49 C 16 47, 24 47, 24 49 C 24 51, 22 53, 19 53 C 15 53, 16 49, 16 49 Z" fill="#2d3748"/>
      <path d="M 36 49 C 36 47, 44 47, 44 49 C 44 51, 42 53, 39 53 C 35 53, 36 49, 36 49 Z" fill="#2d3748"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Pink Arrow Marker -->
    <marker id="pink-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6"/>
    </marker>
    <!-- Orange Arrow Marker -->
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <!-- Top part: Grid world -->
  <g transform="translate(60, 30)">
    <rect x="0" y="0" width="200" height="70" fill="#ffffff" stroke="#2d3748" stroke-width="2.5"/>
    <line x1="100" y1="0" x2="100" y2="70" stroke="#2d3748" stroke-width="2.5"/>
    
    <text x="50" y="-10" font-family="sans-serif" font-size="15" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">L1</text>
    <text x="150" y="-10" font-family="sans-serif" font-size="15" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">L2</text>
    
    <use href="#agent" x="0" y="5"/>
    <use href="#apple" x="100" y="5"/>

    <!-- Left Wall Hatching -->
    <path d="M 0 0 L -15 15 M 0 20 L -15 35 M 0 40 L -15 55 M 0 60 L -15 70" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
    <!-- Right Wall Hatching -->
    <path d="M 200 0 L 215 15 M 200 20 L 215 35 M 200 40 L 215 55 M 200 60 L 215 70" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bottom part: Table showing policy arrows -->
  <g transform="translate(60, 130)">
    <!-- Label -->
    <text x="-25" y="32" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#2d3748">
      π<tspan dy="6" font-size="13">*</tspan>
    </text>
    
    <!-- Table Grid -->
    <rect x="0" y="5" width="200" height="40" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <line x1="100" y1="5" x2="100" y2="45" stroke="#2d3748" stroke-width="2"/>
    
    <!-- Left Cell Arrow (Right action: dot to arrow-head) -->
    <circle cx="25" cy="25" r="4.5" fill="#2d3748"/>
    <line x1="25" y1="25" x2="75" y2="25" stroke="#2d3748" stroke-width="2.5" marker-end="url(#arrow)"/>
    
    <!-- Right Cell Arrow (Left action: dot to arrow-head) -->
    <circle cx="175" cy="25" r="4.5" fill="#2d3748"/>
    <line x1="175" y1="25" x2="125" y2="25" stroke="#2d3748" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
</svg>