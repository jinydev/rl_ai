<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="500" height="150">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa" rx="10" ry="10" />
  
  <!-- Steps -->
  <!-- t=0 -->
  <rect x="20" y="30" width="80" height="60" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="60" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">S_0 (맑음)</text>
  <text x="60" y="75" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">t = 0 (오늘)</text>

  <!-- Arrow 1 -->
  <path d="M 110 60 L 140 60" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="125" y="50" font-family="sans-serif" font-size="10" fill="#333" text-anchor="middle">0.3</text>

  <!-- t=1 -->
  <rect x="150" y="30" width="80" height="60" rx="5" ry="5" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" />
  <text x="190" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#01579b" text-anchor="middle">S_1 (비)</text>
  <text x="190" y="75" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">t = 1 (내일)</text>

  <!-- Arrow 2 -->
  <path d="M 240 60 L 270 60" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="255" y="50" font-family="sans-serif" font-size="10" fill="#333" text-anchor="middle">0.6</text>

  <!-- t=2 -->
  <rect x="280" y="30" width="80" height="60" rx="5" ry="5" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" />
  <text x="320" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#01579b" text-anchor="middle">S_2 (비)</text>
  <text x="320" y="75" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">t = 2 (모레)</text>

  <!-- Arrow 3 -->
  <path d="M 370 60 L 400 60" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="385" y="50" font-family="sans-serif" font-size="10" fill="#333" text-anchor="middle">0.4</text>

  <!-- t=3 -->
  <rect x="410" y="30" width="80" height="60" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="450" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">S_3 (맑음)</text>
  <text x="450" y="75" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">t = 3 (글피)</text>

  <!-- Definition of arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#333" />
    </marker>
  </defs>
</svg>
