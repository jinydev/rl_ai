<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa" rx="15" ry="15"/>
  <style>
    .title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
    .label { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4a5568; }
    .node-level1 { fill: #ebf8ff; stroke: #3182ce; stroke-width: 2; rx: 5; ry: 5; }
    .node-level2 { fill: #f0fff4; stroke: #38a169; stroke-width: 1.5; rx: 5; ry: 5; }
    .node-level3 { fill: #fffaf0; stroke: #dd6b20; stroke-width: 1; rx: 5; ry: 5; }
    .arrow { stroke: #a0aec0; stroke-width: 1.5; fill: none; }
    .text-node { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: bold; fill: #2d3748; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #cbd5e0; stroke-width: 1.5; rx: 8; ry: 8; }
    .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-style: italic; fill: #1a202c; }
  </style>

  <text class="title" x="40" y="45">팩토리얼 (factorial, n!)의 시각화</text>
  <text class="label" x="40" y="65">서로 다른 3개(A, B, C)를 일렬로 나열하는 경우의 수: 3! = 3 × 2 × 1 = 6가지</text>

  <!-- Level 1 (3 choices) -->
  <!-- Choice A -->
  <rect class="node-level1" x="100" y="100" width="60" height="40" />
  <text class="text-node" x="130" y="125">A</text>

  <!-- Choice B -->
  <rect class="node-level1" x="100" y="200" width="60" height="40" />
  <text class="text-node" x="130" y="225">B</text>

  <!-- Choice C -->
  <rect class="node-level1" x="100" y="300" width="60" height="40" />
  <text class="text-node" x="130" y="325">C</text>

  <!-- Level 2 (2 choices each) -->
  <!-- A -> B / C -->
  <path class="arrow" d="M 160 110 L 260 90" />
  <rect class="node-level2" x="260" y="70" width="60" height="40" />
  <text class="text-node" x="290" y="95">B</text>

  <path class="arrow" d="M 160 130 L 260 150" />
  <rect class="node-level2" x="260" y="130" width="60" height="40" />
  <text class="text-node" x="290" y="155">C</text>

  <!-- B -> A / C -->
  <path class="arrow" d="M 160 210 L 260 190" />
  <rect class="node-level2" x="260" y="170" width="60" height="40" />
  <text class="text-node" x="290" y="195">A</text>

  <path class="arrow" d="M 160 230 L 260 250" />
  <rect class="node-level2" x="260" y="230" width="60" height="40" />
  <text class="text-node" x="290" y="255">C</text>

  <!-- C -> A / B -->
  <path class="arrow" d="M 160 310 L 260 290" />
  <rect class="node-level2" x="260" y="270" width="60" height="40" />
  <text class="text-node" x="290" y="295">A</text>

  <path class="arrow" d="M 160 330 L 260 350" />
  <rect class="node-level2" x="260" y="330" width="60" height="40" />
  <text class="text-node" x="290" y="355">B</text>

  <!-- Level 3 (1 choice each) -->
  <!-- A -> B -> C -->
  <path class="arrow" d="M 320 90 L 420 90" />
  <rect class="node-level3" x="420" y="70" width="60" height="40" />
  <text class="text-node" x="450" y="95">C</text>
  <text class="label" x="495" y="95" text-anchor="start">→ [A, B, C]</text>

  <!-- A -> C -> B -->
  <path class="arrow" d="M 320 150 L 420 150" />
  <rect class="node-level3" x="420" y="130" width="60" height="40" />
  <text class="text-node" x="450" y="155">B</text>
  <text class="label" x="495" y="155" text-anchor="start">→ [A, C, B]</text>

  <!-- B -> A -> C -->
  <path class="arrow" d="M 320 190 L 420 190" />
  <rect class="node-level3" x="420" y="170" width="60" height="40" />
  <text class="text-node" x="450" y="195">C</text>
  <text class="label" x="495" y="195" text-anchor="start">→ [B, A, C]</text>

  <!-- B -> C -> A -->
  <path class="arrow" d="M 320 250 L 420 250" />
  <rect class="node-level3" x="420" y="230" width="60" height="40" />
  <text class="text-node" x="450" y="255">A</text>
  <text class="label" x="495" y="255" text-anchor="start">→ [B, C, A]</text>

  <!-- C -> A -> B -->
  <path class="arrow" d="M 320 290 L 420 290" />
  <rect class="node-level3" x="420" y="270" width="60" height="40" />
  <text class="text-node" x="450" y="295">B</text>
  <text class="label" x="495" y="295" text-anchor="start">→ [C, A, B]</text>

  <!-- C -> B -> A -->
  <path class="arrow" d="M 320 350 L 420 350" />
  <rect class="node-level3" x="420" y="330" width="60" height="40" />
  <text class="text-node" x="450" y="355">A</text>
  <text class="label" x="495" y="355" text-anchor="start">→ [C, B, A]</text>

  <!-- Level labels -->
  <text class="label" x="130" y="380" font-weight="bold" fill="#3182ce">1번째 자리 (3가지)</text>
  <text class="label" x="290" y="380" font-weight="bold" fill="#38a169">2번째 자리 (2가지)</text>
  <text class="label" x="450" y="380" font-weight="bold" fill="#dd6b20">3번째 자리 (1가지)</text>
</svg>
