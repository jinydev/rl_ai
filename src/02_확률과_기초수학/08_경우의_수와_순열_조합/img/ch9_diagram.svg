<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa" rx="15" ry="15"/>
  <style>
    .title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
    .label { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4a5568; }
    .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-style: italic; fill: #1a202c; }
    .math-bold { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 18px; font-weight: bold; fill: #2b6cb0; }
    .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; ry: 8; }
    .badge-p { fill: #ebf8ff; stroke: #3182ce; stroke-width: 1.5; rx: 15; ry: 15; }
    .badge-c { fill: #fff5f5; stroke: #e53e3e; stroke-width: 1.5; rx: 15; ry: 15; }
    .arrow { stroke: #718096; stroke-width: 2; fill: none; }
  </style>

  <text class="title" x="40" y="45">순열(Permutation) vs 조합(Combination)</text>
  <text class="label" x="40" y="65">대상을 뽑을 때 순서가 있는지(순열) 없는지(조합)에 따른 구분</text>

  <!-- Left: Permutation Box -->
  <g transform="translate(40, 95)">
    <rect class="box" x="0" y="0" width="340" height="260"/>
    <rect class="badge-p" x="20" y="20" width="140" height="30" />
    <text font-family="Inter" font-size="13" font-weight="bold" fill="#2b6cb0" x="90" y="40" text-anchor="middle">순열 (Permutation)</text>
    
    <text class="label" x="20" y="80" font-weight="bold">순서가 중요함 (줄 세우기)</text>
    <text class="label" x="20" y="105">예: 4개 중 3개를 골라 나열하기 (₄P₃ = 24가지)</text>

    <!-- Illustrate order elements -->
    <g transform="translate(30, 130)">
      <rect x="0" y="0" width="280" height="100" fill="#f7fafc" stroke="#edf2f7" rx="6" ry="6"/>
      <text class="label" x="20" y="30" font-weight="bold">다른 경우로 취급:</text>
      <text class="math" x="40" y="60">① (누구바, 바라바, 고고콘)</text>
      <text class="math" x="40" y="85">② (바라바, 누구바, 고고콘)</text>
    </g>
  </g>

  <!-- Middle: Arrow showing divide by 3! -->
  <g transform="translate(390, 200)">
    <path class="arrow" d="M 0 0 L 30 0" />
    <text class="label" x="15" y="-10" text-anchor="middle" font-weight="bold" fill="#e53e3e">÷ 3! (순서 제거)</text>
  </g>

  <!-- Right: Combination Box -->
  <g transform="translate(430, 95)">
    <rect class="box" x="0" y="0" width="330" height="260"/>
    <rect class="badge-c" x="20" y="20" width="140" height="30" />
    <text font-family="Inter" font-size="13" font-weight="bold" fill="#9b2c2c" x="90" y="40" text-anchor="middle">조합 (Combination)</text>

    <text class="label" x="20" y="80" font-weight="bold">순서 상관없음 (그룹 묶기)</text>
    <text class="label" x="20" y="105">예: 4개 중 3개를 그냥 고르기 (₄C₃ = 4가지)</text>

    <!-- Illustrate no order elements -->
    <g transform="translate(25, 130)">
      <rect x="0" y="0" width="280" height="100" fill="#fff5f5" stroke="#fed7d7" rx="6" ry="6"/>
      <text class="label" x="20" y="30" font-weight="bold">동일한 그룹으로 취급:</text>
      <text class="math" x="40" y="70" font-size="16">{ 누구바, 바라바, 고고콘 }</text>
    </g>
  </g>

  <!-- Formula Overlay -->
  <g transform="translate(220, 360)">
    <text class="math-bold" x="0" y="0" font-size="17">ₙCᵣ = ₙPᵣ / r! = n! / ( r!(n-r)! )   ₙCᵣ = ₙCₙ₋ᵣ</text>
  </g>
</svg>
