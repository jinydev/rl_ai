<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .node-text { font-family: "SF Pro Text", -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; fill: #ffffff; }
      .eq-text { font-family: "Cambria Math", "Latin Modern Math", -apple-system, serif; font-size: 16px; font-weight: 600; fill: #1e293b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="840" height="400" fill="#ffffff" rx="16"/>

  <text x="420" y="38" class="title" text-anchor="middle">SARSA: 시간 t와 t+1에서의 전이와 갱신</text>
  <text x="420" y="62" class="desc" text-anchor="middle">S_t, A_t 에서 실행한 행동의 결과로 R_t, S_{t+1}, A_{t+1} 을 관측하여 Q(S_t, A_t) 를 즉시 갱신</text>

  <!-- Step t Container -->
  <g transform="translate(60, 100)" filter="url(#card-shadow)">
    <rect width="320" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="15" y="15" width="80" height="24" rx="12" fill="#3b82f6"/>
    <text x="55" y="31" class="badge-text">시간 t</text>
    
    <!-- State S_t -->
    <circle cx="100" cy="100" r="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="100" y="100" class="node-text" fill="#1d4ed8">S<tspan font-size="13" dy="4">t</tspan></text>
    <text x="100" y="148" class="desc" text-anchor="middle">상태</text>

    <!-- Action A_t -->
    <path d="M 135 100 L 195 100" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="230" cy="100" r="24" fill="#1e293b"/>
    <text x="230" y="100" class="node-text" fill="#ffffff">A<tspan font-size="12" dy="3">t</tspan></text>
    <text x="230" y="148" class="desc" text-anchor="middle">선택 행동</text>
  </g>

  <!-- Transition Arrow & Reward -->
  <g transform="translate(380, 100)">
    <path d="M 20 100 L 70 100" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <!-- Reward Pill -->
    <rect x="25" y="45" width="45" height="26" rx="13" fill="#f59e0b"/>
    <text x="47" y="62" class="badge-text">R<tspan font-size="10" dy="2">t</tspan></text>
    <text x="47" y="88" class="desc" text-anchor="middle" font-size="11">보상</text>
  </g>

  <!-- Step t+1 Container -->
  <g transform="translate(460, 100)" filter="url(#card-shadow)">
    <rect width="320" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="15" y="15" width="90" height="24" rx="12" fill="#10b981"/>
    <text x="60" y="31" class="badge-text">시간 t+1</text>
    
    <!-- State S_{t+1} -->
    <circle cx="100" cy="100" r="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
    <text x="100" y="100" class="node-text" fill="#047857">S<tspan font-size="13" dy="4">t+1</tspan></text>
    <text x="100" y="148" class="desc" text-anchor="middle">다음 상태</text>

    <!-- Action A_{t+1} -->
    <path d="M 135 100 L 195 100" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="230" cy="100" r="24" fill="#0f766e"/>
    <text x="230" y="100" class="node-text" fill="#ffffff">A<tspan font-size="12" dy="3">t+1</tspan></text>
    <text x="230" y="148" class="desc" text-anchor="middle">다음 행동 (ε-탐욕)</text>
  </g>

  <!-- TD Error & Backup Arrow -->
  <path d="M 690 220 C 690 320, 290 320, 290 220" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-back)"/>
  <rect x="360" y="300" width="220" height="32" rx="16" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="470" y="321" class="badge-text" fill="#e11d48">TD 백업: Q(S_t, A_t) 즉시 갱신</text>
  <text x="470" y="356" class="eq-text" text-anchor="middle">Q(S_t, A_t) ← Q(S_t, A_t) + α [ R_t + γ Q(S_t+1, A_t+1) - Q(S_t, A_t) ]</text>
</svg>