<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .label-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "KaTeX_Math", "Times New Roman", serif; font-size: 15px; font-style: italic; }
    </style>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="440" fill="#ffffff" rx="16"/>
  <rect x="12" y="12" width="656" height="416" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="14"/>

  <!-- Title Header -->
  <text x="340" y="44" class="title" text-anchor="middle">그림 10-4: TD(0)의 백업 다이어그램 (Backup Diagram)</text>
  <text x="340" y="68" class="desc" text-anchor="middle">다음 상태 S_{t+1}의 가치를 샘플링하여 현재 상태 S_t의 가치를 즉시 갱신</text>

  <!-- Main Backup Tree Diagram (Left/Center) -->
  <g transform="translate(140, 100)">
    <!-- Root Node: State S_t -->
    <circle cx="80" cy="30" r="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
    <text x="80" y="35" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">S_t</text>
    <text x="12" y="35" class="label-bold" text-anchor="end">현재 상태</text>

    <!-- Edge from S_t to Action A_t -->
    <line x1="80" y1="52" x2="80" y2="108" stroke="#1e293b" stroke-width="2.5"/>

    <!-- Action Node: A_t (Solid Dot) -->
    <circle cx="80" cy="118" r="8" fill="#1e293b"/>
    <text x="96" y="122" class="label-bold" fill="#0f172a">A_t <tspan font-weight="normal" fill="#64748b">(선택한 행동)</tspan></text>

    <!-- Edge from A_t to S_{t+1} -->
    <line x1="80" y1="126" x2="80" y2="198" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    
    <!-- Reward Label on transition -->
    <rect x="96" y="152" width="84" height="24" fill="#fef3c7" stroke="#fcd34d" rx="4"/>
    <text x="138" y="168" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">보상 R_{t+1}</text>

    <!-- Next State Node: S_{t+1} -->
    <circle cx="80" cy="226" r="22" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
    <text x="80" y="231" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">S_{t+1}</text>
    <text x="12" y="231" class="label-bold" text-anchor="end">다음 상태</text>

    <!-- Value Estimate Annotation at S_{t+1} -->
    <rect x="110" y="214" width="94" height="24" fill="#f0fdf4" stroke="#86efac" rx="5"/>
    <text x="157" y="230" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">가치 V(S_{t+1})</text>

    <!-- Backup Arrow (Curved Orange line from S_{t+1} back to S_t) -->
    <path d="M 52 226 C -20 200, -20 60, 52 30" fill="none" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
    <rect x="-65" y="116" width="90" height="26" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" rx="6"/>
    <text x="-20" y="133" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">백업 (Backup)</text>
  </g>

  <!-- Explanation Panel on the Right -->
  <g transform="translate(410, 110)" filter="url(#card-shadow)">
    <rect width="230" height="280" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10"/>
    
    <rect x="16" y="16" width="198" height="28" fill="#1e293b" rx="6"/>
    <text x="115" y="34" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">TD 갱신 수식 구조</text>

    <text x="16" y="74" class="label-sub" font-weight="700">1. TD 목표 (Target):</text>
    <rect x="16" y="82" width="198" height="30" fill="#eff6ff" stroke="#bfdbfe" rx="6"/>
    <text x="115" y="102" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">R_{t+1} + γ V(S_{t+1})</text>

    <text x="16" y="136" class="label-sub" font-weight="700">2. TD 오차 (Error, δ):</text>
    <rect x="16" y="144" width="198" height="30" fill="#fef2f2" stroke="#fecaca" rx="6"/>
    <text x="115" y="164" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">[R + γV(S_{t+1})] - V(S_t)</text>

    <text x="16" y="198" class="label-sub" font-weight="700">3. 가치 갱신 (Update):</text>
    <rect x="16" y="206" width="198" height="42" fill="#ecfdf5" stroke="#a7f3d0" rx="6"/>
    <text x="115" y="224" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">V(S_t) ← V(S_t) + α · δ_t</text>
    <text x="115" y="240" font-family="-apple-system, sans-serif" font-size="10" fill="#047857" text-anchor="middle">(α: 학습률, 0 &lt; α ≤ 1)</text>

    <text x="115" y="268" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">단 한 걸음으로 미래를 근사!</text>
  </g>
</svg>
