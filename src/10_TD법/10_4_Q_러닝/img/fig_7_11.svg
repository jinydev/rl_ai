<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 12px; fill: #64748b; }
      .node-text { font-family: "SF Pro Text", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .label-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; font-weight: 600; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <filter id="panel-bg" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="880" height="460" fill="#ffffff" rx="16"/>

  <text x="440" y="38" class="main-title" text-anchor="middle">Q 함수의 벨만 방정식과 SARSA의 백업 비교</text>

  <!-- Left: Bellman Expectation Backup (All branches) -->
  <g transform="translate(50, 70)" filter="url(#panel-bg)">
    <rect width="360" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="180" y="30" class="col-title" text-anchor="middle">벨만 방정식 (모든 전이 기대값)</text>
    <text x="180" y="48" class="sub-title" text-anchor="middle">p(s'|s,a)와 π(a'|s')의 가능한 모든 경로를 가중 합산</text>

    <!-- Root: Q(S_t, A_t) -->
    <circle cx="180" cy="90" r="22" fill="#1e293b"/>
    <text x="180" y="90" class="node-text" fill="#ffffff">q<tspan font-size="10" dy="2">π</tspan></text>
    <text x="180" y="125" class="label-txt" fill="#0f172a" text-anchor="middle">q_π(S_t, A_t)</text>

    <!-- Branches to Next States (Open Circles) -->
    <!-- Transition arcs -->
    <path d="M 180 90 L 100 180" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <path d="M 180 90 L 180 180" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <path d="M 180 90 L 260 180" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>

    <circle cx="100" cy="180" r="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="180" cy="180" r="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="260" cy="180" r="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>

    <rect x="135" y="140" width="90" height="20" rx="10" fill="#dbeafe"/>
    <text x="180" y="154" class="sub-title" text-anchor="middle" font-weight="700" fill="#1d4ed8">p(s' | s, a) 분기</text>

    <!-- Sub-branches to Actions (Solid Circles) -->
    <path d="M 100 180 L 70 260" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 100 180 L 120 260" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="70" cy="260" r="12" fill="#334155"/>
    <circle cx="120" cy="260" r="12" fill="#334155"/>

    <path d="M 180 180 L 160 260" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 180 180 L 200 260" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="160" cy="260" r="12" fill="#334155"/>
    <circle cx="200" cy="260" r="12" fill="#334155"/>

    <path d="M 260 180 L 240 260" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 260 180 L 280 260" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="240" cy="260" r="12" fill="#334155"/>
    <circle cx="280" cy="260" r="12" fill="#334155"/>

    <text x="180" y="295" class="label-txt" fill="#047857" text-anchor="middle">모든 q_π(S_t+1, A_t+1) 고려</text>
    <rect x="70" y="308" width="220" height="22" rx="11" fill="#e2e8f0"/>
    <text x="180" y="323" class="sub-title" text-anchor="middle" font-weight="600" fill="#334155">Σ_s' p(s'|s,a) Σ_a' π(a'|s') q_π(s',a')</text>
  </g>

  <!-- Right: SARSA Backup (Single Sampled Branch) -->
  <g transform="translate(470, 70)" filter="url(#panel-bg)">
    <rect width="360" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="180" y="30" class="col-title" text-anchor="middle">SARSA (단일 샘플 경로 백업)</text>
    <text x="180" y="48" class="sub-title" text-anchor="middle">실제 환경 상호작용으로 획득한 단 1개의 궤적으로 갱신</text>

    <!-- Root: Q(S_t, A_t) -->
    <circle cx="180" cy="90" r="22" fill="#1e293b"/>
    <text x="180" y="90" class="node-text" fill="#ffffff">Q</text>
    <text x="180" y="125" class="label-txt" fill="#0f172a" text-anchor="middle">Q(S_t, A_t)</text>

    <!-- Single Sampled Next State -->
    <path d="M 180 90 L 180 180" stroke="#10b981" stroke-width="3" marker-end="url(#arr-green)"/>
    <circle cx="180" cy="180" r="20" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
    <text x="180" y="180" class="node-text" fill="#047857">S<tspan font-size="10" dy="2">t+1</tspan></text>

    <rect x="215" y="130" width="125" height="24" rx="12" fill="#10b981"/>
    <text x="277" y="146" class="badge-txt">p(s'|s,a) 에서 샘플링</text>

    <!-- Single Sampled Next Action -->
    <path d="M 180 180 L 180 260" stroke="#10b981" stroke-width="3" marker-end="url(#arr-green)"/>
    <circle cx="180" cy="260" r="18" fill="#0f766e"/>
    <text x="180" y="260" class="node-text" fill="#ffffff">A<tspan font-size="10" dy="2">t+1</tspan></text>

    <rect x="215" y="220" width="125" height="24" rx="12" fill="#0f766e"/>
    <text x="277" y="236" class="badge-txt">π(a|s) 에서 샘플링</text>

    <!-- TD Target -->
    <rect x="40" y="300" width="280" height="28" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="180" y="318" class="label-txt" fill="#065f46" text-anchor="middle">TD 목표 = R_t + γ Q(S_t+1, A_t+1)</text>
  </g>
</svg>