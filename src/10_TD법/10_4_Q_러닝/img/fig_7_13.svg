<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 12px; fill: #64748b; }
      .node-text { font-family: "SF Pro Text", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .label-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; font-weight: 600; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    </style>
    <marker id="arr-opt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-ql" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ec4899"/>
    </marker>
    <filter id="panel-shad" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="880" height="460" fill="#ffffff" rx="16"/>

  <text x="440" y="38" class="main-title" text-anchor="middle">벨만 최적 방정식과 Q 러닝의 백업 구조</text>

  <!-- Left: Bellman Optimality Equation Backup -->
  <g transform="translate(50, 70)" filter="url(#panel-shad)">
    <rect width="360" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="180" y="30" class="col-title" text-anchor="middle">벨만 최적 방정식 (이론적 최적)</text>
    <text x="180" y="48" class="sub-title" text-anchor="middle">모든 s' 전이를 고려하고 다음 행동 중 최댓값(max)을 취함</text>

    <!-- Root: q_*(S_t, A_t) -->
    <circle cx="180" cy="90" r="22" fill="#1e293b"/>
    <text x="180" y="90" class="node-text" fill="#ffffff">q<tspan font-size="11" dy="2">*</tspan></text>
    <text x="180" y="125" class="label-txt" fill="#0f172a" text-anchor="middle">q_*(S_t, A_t)</text>

    <!-- Next State Branches -->
    <path d="M 180 90 L 100 180" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-opt)"/>
    <path d="M 180 90 L 180 180" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-opt)"/>
    <path d="M 180 90 L 260 180" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-opt)"/>

    <circle cx="100" cy="180" r="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="180" cy="180" r="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="260" cy="180" r="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>

    <rect x="135" y="140" width="90" height="20" rx="10" fill="#ede9fe"/>
    <text x="180" y="154" class="sub-title" text-anchor="middle" font-weight="700" fill="#6d28d9">p(s' | s, a) 분기</text>

    <!-- MAX over next actions arc -->
    <path d="M 160 210 Q 180 230 200 210" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <rect x="165" y="222" width="30" height="18" rx="4" fill="#f59e0b"/>
    <text x="180" y="234" class="badge-txt" font-size="9">max</text>

    <path d="M 180 180 L 160 260" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 180 180 L 200 260" stroke="#8b5cf6" stroke-width="2.5"/>
    <circle cx="160" cy="260" r="10" fill="#94a3b8"/>
    <circle cx="200" cy="260" r="14" fill="#6d28d9"/>

    <text x="180" y="295" class="label-txt" fill="#6d28d9" text-anchor="middle">max_a' q_*(S_t+1, a')</text>
    <rect x="60" y="308" width="240" height="22" rx="11" fill="#ede9fe"/>
    <text x="180" y="323" class="sub-title" text-anchor="middle" font-weight="600" fill="#5b21b6">Σ_s' p(s'|s,a) [ r + γ max_a' q_*(s', a') ]</text>
  </g>

  <!-- Right: Q-Learning Backup (Sampled + Max) -->
  <g transform="translate(470, 70)" filter="url(#panel-shad)">
    <rect width="360" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="180" y="30" class="col-title" text-anchor="middle">Q 러닝 (샘플링 버전 최적 백업)</text>
    <text x="180" y="48" class="sub-title" text-anchor="middle">단일 샘플 S_t+1 에서 가상의 최대 행동 max_a' Q(S_t+1, a') 백업</text>

    <!-- Root: Q(S_t, A_t) -->
    <circle cx="180" cy="90" r="22" fill="#1e293b"/>
    <text x="180" y="90" class="node-text" fill="#ffffff">Q</text>
    <text x="180" y="125" class="label-txt" fill="#0f172a" text-anchor="middle">Q(S_t, A_t)</text>

    <!-- Sampled Next State -->
    <path d="M 180 90 L 180 180" stroke="#ec4899" stroke-width="3" marker-end="url(#arr-ql)"/>
    <circle cx="180" cy="180" r="20" fill="#fdf2f8" stroke="#ec4899" stroke-width="2.5"/>
    <text x="180" y="180" class="node-text" fill="#be185d">S<tspan font-size="10" dy="2">t+1</tspan></text>

    <rect x="215" y="130" width="125" height="24" rx="12" fill="#ec4899"/>
    <text x="277" y="146" class="badge-txt">p(s'|s,a) 에서 샘플링</text>

    <!-- MAX Operator Arc on Actions -->
    <path d="M 155 215 Q 180 238 205 215" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <rect x="163" y="228" width="34" height="20" rx="4" fill="#f59e0b"/>
    <text x="180" y="242" class="badge-txt" font-size="10">MAX</text>

    <!-- Action branches from S_{t+1} -->
    <path d="M 180 180 L 140 260" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 180 180 L 180 260" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 180 180 L 220 260" stroke="#ec4899" stroke-width="2.5"/>

    <circle cx="140" cy="260" r="10" fill="#94a3b8"/>
    <circle cx="180" cy="260" r="10" fill="#94a3b8"/>
    <circle cx="220" cy="260" r="15" fill="#be185d"/>
    <text x="220" y="260" class="node-text" fill="#ffffff" font-size="11">max</text>

    <!-- TD Target -->
    <rect x="40" y="300" width="280" height="28" rx="14" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="180" y="318" class="label-txt" fill="#9d174d" text-anchor="middle">TD 목표 = R_t + γ max_a Q(S_t+1, a)</text>
  </g>
</svg>