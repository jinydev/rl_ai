<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 16px; font-weight: 700; fill: #334155; }
      .q-val { font-family: "SF Pro Text", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .arrow-policy { stroke: #0f172a; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="panel-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="480" fill="#ffffff" rx="16"/>

  <text x="460" y="38" class="main-title" text-anchor="middle">Q 러닝으로 얻은 최적 Q 함수와 최적 정책</text>

  <!-- Left: Q-Values (3x4 Triangles) -->
  <g transform="translate(50, 70)" filter="url(#panel-shadow)">
    <text x="180" y="25" class="col-title" text-anchor="middle">(a) 최적 Q 함수 Q*(s, a)</text>
    
    <g transform="translate(0, 45)">
      <!-- Row 0 -->
      <!-- (0,0) -->
      <g transform="translate(0,0)">
        <polygon points="0,0 90,0 45,45" fill="#4ade80"/>
        <text x="45" y="16" class="q-val" fill="#14532d">0.73</text>
        <polygon points="90,0 90,90 45,45" fill="#22c55e"/>
        <text x="72" y="45" class="q-val" fill="#14532d">0.81</text>
        <polygon points="90,90 0,90 45,45" fill="#4ade80"/>
        <text x="45" y="74" class="q-val" fill="#14532d">0.66</text>
        <polygon points="0,90 0,0 45,45" fill="#4ade80"/>
        <text x="18" y="45" class="q-val" fill="#14532d">0.73</text>
        <rect width="90" height="90" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      </g>
      <!-- (0,1) -->
      <g transform="translate(90,0)">
        <polygon points="0,0 90,0 45,45" fill="#22c55e"/>
        <text x="45" y="16" class="q-val" fill="#14532d">0.81</text>
        <polygon points="90,0 90,90 45,45" fill="#16a34a"/>
        <text x="72" y="45" class="q-val" fill="#ffffff">0.90</text>
        <polygon points="90,90 0,90 45,45" fill="#22c55e"/>
        <text x="45" y="74" class="q-val" fill="#14532d">0.81</text>
        <polygon points="0,90 0,0 45,45" fill="#4ade80"/>
        <text x="18" y="45" class="q-val" fill="#14532d">0.73</text>
        <rect width="90" height="90" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      </g>
      <!-- (0,2) -->
      <g transform="translate(180,0)">
        <polygon points="0,0 90,0 45,45" fill="#16a34a"/>
        <text x="45" y="16" class="q-val" fill="#ffffff">0.90</text>
        <polygon points="90,0 90,90 45,45" fill="#15803d"/>
        <text x="72" y="45" class="q-val" fill="#ffffff">1.00</text>
        <polygon points="90,90 0,90 45,45" fill="#22c55e"/>
        <text x="45" y="74" class="q-val" fill="#14532d">0.81</text>
        <polygon points="0,90 0,0 45,45" fill="#22c55e"/>
        <text x="18" y="45" class="q-val" fill="#14532d">0.81</text>
        <rect width="90" height="90" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      </g>
      <!-- (0,3) GOAL -->
      <g transform="translate(270,0)">
        <rect width="90" height="90" fill="#10b981"/>
        <text x="45" y="38" class="q-val" fill="#ffffff" font-size="14">GOAL</text>
        <text x="45" y="58" class="q-val" fill="#ffffff" font-size="11">+1.0</text>
        <rect width="90" height="90" fill="none" stroke="#059669" stroke-width="2"/>
      </g>

      <!-- Row 1 -->
      <!-- (1,0) -->
      <g transform="translate(0,90)">
        <polygon points="0,0 90,0 45,45" fill="#4ade80"/>
        <text x="45" y="16" class="q-val" fill="#14532d">0.73</text>
        <polygon points="90,0 90,90 45,45" fill="#4ade80"/>
        <text x="72" y="45" class="q-val" fill="#14532d">0.66</text>
        <polygon points="90,90 0,90 45,45" fill="#86efac"/>
        <text x="45" y="74" class="q-val" fill="#14532d">0.59</text>
        <polygon points="0,90 0,0 45,45" fill="#4ade80"/>
        <text x="18" y="45" class="q-val" fill="#14532d">0.66</text>
        <rect width="90" height="90" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      </g>
      <!-- (1,1) WALL -->
      <g transform="translate(90,90)">
        <rect width="90" height="90" fill="#334155"/>
        <text x="45" y="45" class="q-val" fill="#94a3b8" font-size="14">WALL</text>
        <rect width="90" height="90" fill="none" stroke="#1e293b" stroke-width="1.5"/>
      </g>
      <!-- (1,2) -->
      <g transform="translate(180,90)">
        <polygon points="0,0 90,0 45,45" fill="#16a34a"/>
        <text x="45" y="16" class="q-val" fill="#ffffff">0.90</text>
        <polygon points="90,0 90,90 45,45" fill="#fee2e2"/>
        <text x="72" y="45" class="q-val" fill="#991b1b">-0.10</text>
        <polygon points="90,90 0,90 45,45" fill="#4ade80"/>
        <text x="45" y="74" class="q-val" fill="#14532d">0.73</text>
        <polygon points="0,90 0,0 45,45" fill="#22c55e"/>
        <text x="18" y="45" class="q-val" fill="#14532d">0.81</text>
        <rect width="90" height="90" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      </g>
      <!-- (1,3) TRAP -->
      <g transform="translate(270,90)">
        <rect width="90" height="90" fill="#ef4444"/>
        <text x="45" y="38" class="q-val" fill="#ffffff" font-size="14">TRAP</text>
        <text x="45" y="58" class="q-val" fill="#ffffff" font-size="11">-1.0</text>
        <rect width="90" height="90" fill="none" stroke="#dc2626" stroke-width="2"/>
      </g>

      <!-- Row 2 -->
      <!-- (2,0) -->
      <g transform="translate(0,180)">
        <polygon points="0,0 90,0 45,45" fill="#4ade80"/>
        <text x="45" y="16" class="q-val" fill="#14532d">0.66</text>
        <polygon points="90,0 90,90 45,45" fill="#4ade80"/>
        <text x="72" y="45" class="q-val" fill="#14532d">0.66</text>
        <polygon points="90,90 0,90 45,45" fill="#86efac"/>
        <text x="45" y="74" class="q-val" fill="#14532d">0.59</text>
        <polygon points="0,90 0,0 45,45" fill="#86efac"/>
        <text x="18" y="45" class="q-val" fill="#14532d">0.59</text>
        <rect width="90" height="90" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      </g>
      <!-- (2,1) -->
      <g transform="translate(90,180)">
        <polygon points="0,0 90,0 45,45" fill="#4ade80"/>
        <text x="45" y="16" class="q-val" fill="#14532d">0.66</text>
        <polygon points="90,0 90,90 45,45" fill="#22c55e"/>
        <text x="72" y="45" class="q-val" fill="#14532d">0.81</text>
        <polygon points="90,90 0,90 45,45" fill="#4ade80"/>
        <text x="45" y="74" class="q-val" fill="#14532d">0.66</text>
        <polygon points="0,90 0,0 45,45" fill="#4ade80"/>
        <text x="18" y="45" class="q-val" fill="#14532d">0.59</text>
        <rect width="90" height="90" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      </g>
      <!-- (2,2) -->
      <g transform="translate(180,180)">
        <polygon points="0,0 90,0 45,45" fill="#22c55e"/>
        <text x="45" y="16" class="q-val" fill="#14532d">0.81</text>
        <polygon points="90,0 90,90 45,45" fill="#4ade80"/>
        <text x="72" y="45" class="q-val" fill="#14532d">0.66</text>
        <polygon points="90,90 0,90 45,45" fill="#4ade80"/>
        <text x="45" y="74" class="q-val" fill="#14532d">0.73</text>
        <polygon points="0,90 0,0 45,45" fill="#22c55e"/>
        <text x="18" y="45" class="q-val" fill="#14532d">0.73</text>
        <rect width="90" height="90" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      </g>
      <!-- (2,3) -->
      <g transform="translate(270,180)">
        <polygon points="0,0 90,0 45,45" fill="#fee2e2"/>
        <text x="45" y="16" class="q-val" fill="#991b1b">-0.10</text>
        <polygon points="90,0 90,90 45,45" fill="#4ade80"/>
        <text x="72" y="45" class="q-val" fill="#14532d">0.66</text>
        <polygon points="90,90 0,90 45,45" fill="#4ade80"/>
        <text x="45" y="74" class="q-val" fill="#14532d">0.66</text>
        <polygon points="0,90 0,0 45,45" fill="#4ade80"/>
        <text x="18" y="45" class="q-val" fill="#14532d">0.73</text>
        <rect width="90" height="90" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <!-- Right: Policy Arrows (3x4) -->
  <g transform="translate(500, 70)" filter="url(#panel-shadow)">
    <text x="180" y="25" class="col-title" text-anchor="middle">(b) 최적 탐욕 정책 π*(s)</text>
    
    <g transform="translate(0, 45)">
      <!-- Row 0 -->
      <g transform="translate(0,0)"><rect width="90" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="25" y1="45" x2="65" y2="45" class="arrow-policy"/><polyline points="55,35 65,45 55,55" fill="none" class="arrow-policy"/></g>
      <g transform="translate(90,0)"><rect width="90" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="25" y1="45" x2="65" y2="45" class="arrow-policy"/><polyline points="55,35 65,45 55,55" fill="none" class="arrow-policy"/></g>
      <g transform="translate(180,0)"><rect width="90" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="25" y1="45" x2="65" y2="45" class="arrow-policy"/><polyline points="55,35 65,45 55,55" fill="none" class="arrow-policy"/></g>
      <g transform="translate(270,0)"><rect width="90" height="90" fill="#10b981" stroke="#059669" stroke-width="2"/><text x="45" y="48" class="q-val" fill="#ffffff" font-size="15">GOAL</text></g>

      <!-- Row 1 -->
      <g transform="translate(0,90)"><rect width="90" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="45" y1="65" x2="45" y2="25" class="arrow-policy"/><polyline points="35,35 45,25 55,35" fill="none" class="arrow-policy"/></g>
      <g transform="translate(90,90)"><rect width="90" height="90" fill="#334155" stroke="#1e293b" stroke-width="1.5"/><text x="45" y="48" class="q-val" fill="#94a3b8" font-size="14">WALL</text></g>
      <g transform="translate(180,90)"><rect width="90" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="45" y1="65" x2="45" y2="25" class="arrow-policy"/><polyline points="35,35 45,25 55,35" fill="none" class="arrow-policy"/></g>
      <g transform="translate(270,90)"><rect width="90" height="90" fill="#ef4444" stroke="#dc2626" stroke-width="2"/><text x="45" y="48" class="q-val" fill="#ffffff" font-size="15">TRAP</text></g>

      <!-- Row 2 -->
      <g transform="translate(0,180)"><rect width="90" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="45" y1="65" x2="45" y2="25" class="arrow-policy"/><polyline points="35,35 45,25 55,35" fill="none" class="arrow-policy"/></g>
      <g transform="translate(90,180)"><rect width="90" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="25" y1="45" x2="65" y2="45" class="arrow-policy"/><polyline points="55,35 65,45 55,55" fill="none" class="arrow-policy"/></g>
      <g transform="translate(180,180)"><rect width="90" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="45" y1="65" x2="45" y2="25" class="arrow-policy"/><polyline points="35,35 45,25 55,35" fill="none" class="arrow-policy"/></g>
      <g transform="translate(270,180)"><rect width="90" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="65" y1="45" x2="25" y2="45" class="arrow-policy"/><polyline points="35,35 25,45 35,55" fill="none" class="arrow-policy"/></g>
    </g>
    <!-- Note on optimal direct path -->
    <path d="M 225 180 C 245 160, 260 140, 260 95" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="270" y="140" class="desc-text" fill="#047857" font-weight="700">최단 경로 선택 (함정 옆으로 직행)</text>
  </g>

  <!-- Bottom Annotation -->
  <text x="460" y="445" class="desc-text" text-anchor="middle">Q 러닝은 max 연산자를 통해 행동 정책의 탐색 위험과 무관하게 수학적 최단 경로(최적 정책)를 정확히 찾아냅니다.</text>
</svg>