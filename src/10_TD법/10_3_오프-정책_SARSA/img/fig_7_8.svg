<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .sub-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
      .math-txt { font-family: "Cambria Math", "Latin Modern Math", serif; font-size: 18px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <filter id="shadow-light" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="360" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">SARSA 갱신식에 대응하는 백업 다이어그램</text>
  <text x="380" y="64" class="sub-label">상태와 행동을 묶은 (S_t, A_t) 가 갱신 대상이며, 다음 단계의 (S_t+1, A_t+1) 샘플로 백업</text>

  <!-- Diagram Sequence -->
  <g transform="translate(60, 150)">
    <!-- Connecting Line -->
    <line x1="80" y1="40" x2="560" y2="40" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Step 1: S_t (Open Circle) -->
    <circle cx="80" cy="40" r="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
    <text x="80" y="40" class="math-txt" fill="#1d4ed8">S<tspan font-size="13" dy="4">t</tspan></text>
    <text x="80" y="90" class="label" fill="#1e293b">S<tspan font-size="11">t</tspan></text>

    <!-- Arrow S_t -> A_t -->
    <path d="M 108 40 L 190 40" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

    <!-- Step 2: A_t (Solid Circle) -->
    <circle cx="210" cy="40" r="20" fill="#1e293b"/>
    <text x="210" y="40" class="math-txt" fill="#ffffff">A<tspan font-size="12" dy="3">t</tspan></text>
    <text x="210" y="90" class="label" fill="#1e293b">A<tspan font-size="11">t</tspan></text>

    <!-- Transition: Reward R_t -->
    <rect x="270" y="24" width="48" height="32" rx="16" fill="#f59e0b" filter="url(#shadow-light)"/>
    <text x="294" y="44" class="pill-text">R<tspan font-size="10" dy="2">t</tspan></text>
    <text x="294" y="90" class="label" fill="#b45309">R<tspan font-size="11">t</tspan></text>

    <!-- Arrow A_t -> S_{t+1} -->
    <path d="M 230 40 L 370 40" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow-blue)"/>

    <!-- Step 3: S_{t+1} (Open Circle) -->
    <circle cx="390" cy="40" r="28" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
    <text x="390" y="40" class="math-txt" fill="#047857">S<tspan font-size="13" dy="4">t+1</tspan></text>
    <text x="390" y="90" class="label" fill="#1e293b">S<tspan font-size="11">t+1</tspan></text>

    <!-- Arrow S_{t+1} -> A_{t+1} -->
    <path d="M 418 40 L 500 40" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

    <!-- Step 4: A_{t+1} (Solid Circle) -->
    <circle cx="520" cy="40" r="20" fill="#0f766e"/>
    <text x="520" y="40" class="math-txt" fill="#ffffff">A<tspan font-size="12" dy="3">t+1</tspan></text>
    <text x="520" y="90" class="label" fill="#1e293b">A<tspan font-size="11">t+1</tspan></text>
  </g>

  <!-- Annotations / Callouts -->
  <!-- Target Tag (S_t, A_t) -->
  <g transform="translate(130, 95)">
    <rect width="140" height="32" rx="16" fill="#3b82f6" filter="url(#shadow-light)"/>
    <text x="70" y="21" class="pill-text">갱신 대상 Q(S_t, A_t)</text>
    <path d="M 70 32 L 70 70" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- Policy Tag (S_{t+1}, A_{t+1}) -->
  <g transform="translate(440, 95)">
    <rect width="180" height="32" rx="16" fill="#059669" filter="url(#shadow-light)"/>
    <text x="90" y="21" class="pill-text">정책 π(a|s) 또는 b(a|s)</text>
    <path d="M 90 32 L 90 70" stroke="#059669" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- Environment Dynamics Tag -->
  <g transform="translate(300, 275)">
    <rect width="140" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="70" y="20" class="sub-label" font-weight="700" fill="#334155">전이 확률 p(s'|s, a)</text>
    <path d="M 70 0 L 70 -50" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
</svg>