<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .pong-score { font-family: "SF Mono", monospace; font-size: 32px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
    <filter id="pong-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="420" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">아타리(Atari) 2600 &lt;퐁(Pong)&gt; 게임 화면 구성</text>
  <text x="380" y="62" class="desc" text-anchor="middle">양쪽 패들로 공을 받아쳐 상대편 골라인을 통과시키면 1점 획득</text>

  <!-- Pong Retro CRT Screen -->
  <g transform="translate(180, 85)" filter="url(#pong-sh)">
    <rect width="400" height="280" rx="12" fill="#0f172a" stroke="#334155" stroke-width="4"/>

    <!-- Scoreboard -->
    <text x="140" y="55" class="pong-score">1</text>
    <text x="260" y="55" class="pong-score">0</text>

    <!-- Center Net Dashed Line -->
    <line x1="200" y1="75" x2="200" y2="265" stroke="#475569" stroke-width="4" stroke-dasharray="10 8"/>

    <!-- Left Enemy Paddle -->
    <rect x="30" y="110" width="12" height="50" rx="3" fill="#ef4444"/>
    <rect x="15" y="170" width="70" height="22" rx="11" fill="#ef4444"/>
    <text x="50" y="185" class="tag">적 (컴퓨터)</text>

    <!-- Right Player Paddle -->
    <rect x="358" y="140" width="12" height="50" rx="3" fill="#10b981"/>
    <rect x="320" y="200" width="70" height="22" rx="11" fill="#10b981"/>
    <text x="355" y="215" class="tag">플레이어</text>

    <!-- Moving Ball & Trajectory -->
    <line x1="100" y1="120" x2="270" y2="160" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="270" y="155" width="10" height="10" rx="2" fill="#fbbf24"/>
    <text x="275" y="145" class="tag" fill="#fbbf24">공</text>
  </g>
</svg>