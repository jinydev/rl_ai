<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .label-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; }
      .math-txt { font-family: "Cambria Math", "Latin Modern Math", serif; font-size: 16px; font-weight: 700; }
    </style>
    <marker id="arr-force" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <filter id="cart-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="380" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">&lt;카트 폴&gt; 환경 구조 및 4개 관찰 상태 변수</text>
  <text x="380" y="62" class="desc" text-anchor="middle">카트 위치 x, 카트 속도 v, 막대 각도 θ, 막대 각속도 ω</text>

  <!-- CartPole Illustration Area -->
  <g transform="translate(60, 90)">
    <!-- Track -->
    <line x1="40" y1="210" x2="480" y2="210" stroke="#94a3b8" stroke-width="4"/>
    <line x1="260" y1="205" x2="260" y2="215" stroke="#475569" stroke-width="2"/>
    <text x="260" y="235" class="desc" text-anchor="middle">중심 (x = 0)</text>

    <!-- Limit ranges -->
    <line x1="60" y1="195" x2="60" y2="225" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="60" y="245" class="desc" text-anchor="middle" fill="#ef4444">-2.4 m</text>
    <line x1="460" y1="195" x2="460" y2="225" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="460" y="245" class="desc" text-anchor="middle" fill="#ef4444">+2.4 m</text>

    <!-- Cart Box -->
    <g transform="translate(200, 160)" filter="url(#cart-sh)">
      <rect width="120" height="50" rx="8" fill="#1e293b"/>
      <circle cx="25" cy="50" r="10" fill="#475569"/>
      <circle cx="95" cy="50" r="10" fill="#475569"/>
      <text x="60" y="30" class="label-txt" fill="#ffffff" text-anchor="middle">카트 (Cart)</text>
    </g>

    <!-- Pivot Pin -->
    <circle cx="260" cy="160" r="7" fill="#f59e0b"/>

    <!-- Vertical reference line for angle theta -->
    <line x1="260" y1="160" x2="260" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Tilted Pole -->
    <!-- Pivot at (260, 160), angle ~15 degrees -->
    <g transform="rotate(15, 260, 160)">
      <rect x="254" y="30" width="12" height="130" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
      <circle cx="260" cy="30" r="8" fill="#d97706"/>
    </g>

    <!-- Angle Arc theta -->
    <path d="M 260 90 A 70 70 0 0 1 278 92" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="290" y="92" class="math-txt" fill="#ef4444">θ</text>

    <!-- Force Arrows -->
    <path d="M 170 185 L 120 185" stroke="#ef4444" stroke-width="3" marker-end="url(#arr-force)"/>
    <text x="145" y="175" class="desc" text-anchor="middle" font-weight="700" fill="#ef4444">행동 0 (좌)</text>

    <path d="M 350 185 L 400 185" stroke="#ef4444" stroke-width="3" marker-end="url(#arr-force)"/>
    <text x="375" y="175" class="desc" text-anchor="middle" font-weight="700" fill="#ef4444">행동 1 (우)</text>
  </g>

  <!-- Right State Table -->
  <g transform="translate(530, 95)" filter="url(#cart-sh)">
    <rect width="200" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="100" y="25" class="label-txt" text-anchor="middle">상태 벡터 [4]</text>

    <rect x="15" y="45" width="170" height="35" rx="6" fill="#eff6ff"/>
    <text x="25" y="67" class="math-txt" fill="#1d4ed8">x</text>
    <text x="175" y="67" class="desc" text-anchor="end">카트 위치</text>

    <rect x="15" y="90" width="170" height="35" rx="6" fill="#eff6ff"/>
    <text x="25" y="112" class="math-txt" fill="#1d4ed8">v</text>
    <text x="175" y="112" class="desc" text-anchor="end">카트 속도</text>

    <rect x="15" y="135" width="170" height="35" rx="6" fill="#fef2f2"/>
    <text x="25" y="157" class="math-txt" fill="#b91c1c">θ</text>
    <text x="175" y="157" class="desc" text-anchor="end">막대 각도</text>

    <rect x="15" y="180" width="170" height="35" rx="6" fill="#fef2f2"/>
    <text x="25" y="202" class="math-txt" fill="#b91c1c">ω</text>
    <text x="175" y="202" class="desc" text-anchor="end">막대 각속도</text>
  </g>

  <!-- Bottom Notice -->
  <text x="380" y="355" class="desc" text-anchor="middle">종료 조건: 막대 각도 |θ| &gt; 12° 또는 카트 위치 |x| &gt; 2.4m 초과 시 즉시 에피소드 종료</text>
</svg>