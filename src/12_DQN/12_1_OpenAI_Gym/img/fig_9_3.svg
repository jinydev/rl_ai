<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .status-pass { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #059669; }
      .status-fail { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #dc2626; }
    </style>
    <filter id="sim-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="360" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">&lt;카트 폴&gt; 렌더링 시각화: 균형 유지 vs 실패</text>
  <text x="380" y="62" class="desc" text-anchor="middle">무작위 행동 시 조기 붕괴 / DQN 에이전트 학습 시 200단계 완벽 균형 유지</text>

  <!-- Left: Success Balance -->
  <g transform="translate(60, 85)" filter="url(#sim-sh)">
    <rect width="300" height="230" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="150" y="28" class="status-pass" text-anchor="middle">안정 균형 상태 (|θ| &lt; 5°)</text>

    <!-- Track -->
    <line x1="30" y1="180" x2="270" y2="180" stroke="#94a3b8" stroke-width="3"/>

    <!-- Upright Cart & Pole -->
    <rect x="110" y="145" width="80" height="35" rx="6" fill="#1e293b"/>
    <circle cx="125" cy="180" r="7" fill="#475569"/>
    <circle cx="175" cy="180" r="7" fill="#475569"/>

    <circle cx="150" cy="145" r="5" fill="#f59e0b"/>
    <!-- Nearly vertical pole -->
    <rect x="146" y="55" width="8" height="90" rx="4" fill="#10b981"/>

    <text x="150" y="212" class="desc" text-anchor="middle" font-weight="600" fill="#047857">보상: 스텝당 +1.0 획득</text>
  </g>

  <!-- Right: Failure Fall -->
  <g transform="translate(400, 85)" filter="url(#sim-sh)">
    <rect width="300" height="230" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="150" y="28" class="status-fail" text-anchor="middle">전도 실패 상태 (|θ| &gt; 12°)</text>

    <!-- Track -->
    <line x1="30" y1="180" x2="270" y2="180" stroke="#94a3b8" stroke-width="3"/>

    <!-- Tilted Fall Cart & Pole -->
    <rect x="70" y="145" width="80" height="35" rx="6" fill="#1e293b"/>
    <circle cx="85" cy="180" r="7" fill="#475569"/>
    <circle cx="135" cy="180" r="7" fill="#475569"/>

    <circle cx="110" cy="145" r="5" fill="#f59e0b"/>
    <!-- Severely fallen pole -->
    <g transform="rotate(35, 110, 145)">
      <rect x="106" y="55" width="8" height="90" rx="4" fill="#ef4444"/>
    </g>

    <text x="150" y="212" class="desc" text-anchor="middle" font-weight="600" fill="#b91c1c">에피소드 종료 (done = True)</text>
  </g>
</svg>