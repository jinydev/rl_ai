<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .head-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .box-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-duel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <filter id="duel-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="880" height="440" fill="#ffffff" rx="16"/>

  <text x="440" y="38" class="title" text-anchor="middle">DQN(기본)과 Dueling DQN(확장) 아키텍처 비교</text>
  <text x="440" y="62" class="desc" text-anchor="middle">Dueling DQN은 상태 가치 V(s)와 행동 어드밴티지 A(s, a)를 별도 스트림으로 분리 추정</text>

  <!-- Top: Standard DQN -->
  <g transform="translate(60, 85)" filter="url(#duel-sh)">
    <rect width="760" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="30" class="head-txt">기존 DQN 구조</text>

    <!-- Conv Layers -->
    <rect x="140" y="45" width="130" height="55" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="205" y="77" class="box-lbl" fill="#1d4ed8">합성곱 계층 (Conv)</text>

    <path d="M 270 72 L 340 72" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-duel)"/>

    <!-- Fully Connected -->
    <rect x="350" y="45" width="150" height="55" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="425" y="77" class="box-lbl" fill="#7e22ce">완전연결 계층 (FC)</text>

    <path d="M 500 72 L 570 72" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arr-duel)"/>

    <!-- Q-values output -->
    <rect x="580" y="45" width="140" height="55" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2.5"/>
    <text x="650" y="77" class="box-lbl" fill="#be185d">Q(s, a) 출력</text>
  </g>

  <!-- Bottom: Dueling DQN -->
  <g transform="translate(60, 235)" filter="url(#duel-sh)">
    <rect width="760" height="175" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="25" y="30" class="head-txt" fill="#047857">Dueling DQN 구조</text>

    <!-- Conv Layers -->
    <rect x="140" y="65" width="130" height="55" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="205" y="97" class="box-lbl" fill="#1d4ed8">합성곱 계층 (공유)</text>

    <!-- Branching Arrows -->
    <path d="M 270 80 L 340 55" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-duel)"/>
    <path d="M 270 105 L 340 130" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-duel)"/>

    <!-- Value Stream V(s) -->
    <rect x="350" y="35" width="150" height="42" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="425" y="60" class="box-lbl" fill="#047857">상태 가치 V(s) (1)</text>

    <!-- Advantage Stream A(s, a) -->
    <rect x="350" y="110" width="150" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="425" y="135" class="box-lbl" fill="#b45309">어드밴티지 A(s, a) (|A|)</text>

    <!-- Aggregating Arrows -->
    <path d="M 500 55 L 570 80" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-duel)"/>
    <path d="M 500 130 L 570 105" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr-duel)"/>

    <!-- Combine Module -->
    <rect x="580" y="65" width="150" height="55" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2.5"/>
    <text x="655" y="87" class="box-lbl" fill="#be185d">Q = V + (A - mean(A))</text>
    <text x="655" y="105" class="desc" font-size="10" text-anchor="middle">식 (9.3) 결합 모듈</text>
  </g>
</svg>