<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .layer-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .dim-txt { font-family: "SF Mono", monospace; font-size: 11px; fill: #64748b; text-anchor: middle; }
    </style>
    <marker id="arr-cnn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <filter id="cnn-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="920" height="400" fill="#ffffff" rx="16"/>

  <text x="460" y="38" class="title" text-anchor="middle">DQN 논문(Mnih et al., 2015)의 아타리 게임 CNN 아키텍처</text>
  <text x="460" y="62" class="desc" text-anchor="middle">전처리된 4프레임 누적 이미지(84×84×4)에서 18개 조이스틱 행동의 Q값을 직접 예측</text>

  <g transform="translate(40, 100)" filter="url(#cnn-sh)">
    <!-- 1. Input: 4 x 84 x 84 -->
    <rect x="0" y="20" width="80" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="40" y="90" class="layer-name" fill="#1d4ed8">입력 화면</text>
    <text x="40" y="110" class="dim-txt">4 × 84 × 84</text>
    <text x="40" y="130" class="dim-txt">(4 프레임)</text>

    <path d="M 80 95 L 125 95" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-cnn)"/>

    <!-- 2. Conv1: 32 x 20 x 20 -->
    <rect x="135" y="35" width="85" height="120" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="177" y="85" class="layer-name" fill="#047857">Conv 1</text>
    <text x="177" y="105" class="dim-txt">8×8 필터, s4</text>
    <text x="177" y="125" class="dim-txt">32 × 20 × 20</text>

    <path d="M 220 95 L 265 95" stroke="#10b981" stroke-width="2" marker-end="url(#arr-cnn)"/>

    <!-- 3. Conv2: 64 x 9 x 9 -->
    <rect x="275" y="50" width="85" height="90" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="317" y="85" class="layer-name" fill="#047857">Conv 2</text>
    <text x="317" y="105" class="dim-txt">4×4 필터, s2</text>
    <text x="317" y="125" class="dim-txt">64 × 9 × 9</text>

    <path d="M 360 95 L 405 95" stroke="#10b981" stroke-width="2" marker-end="url(#arr-cnn)"/>

    <!-- 4. Conv3: 64 x 7 x 7 -->
    <rect x="415" y="55" width="85" height="80" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="457" y="85" class="layer-name" fill="#047857">Conv 3</text>
    <text x="457" y="105" class="dim-txt">3×3 필터, s1</text>
    <text x="457" y="125" class="dim-txt">64 × 7 × 7</text>

    <path d="M 500 95 L 545 95" stroke="#10b981" stroke-width="2" marker-end="url(#arr-cnn)"/>

    <!-- 5. Flatten & Linear1: 512 -->
    <rect x="555" y="30" width="90" height="130" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="600" y="85" class="layer-name" fill="#7e22ce">FC 1 (ReLU)</text>
    <text x="600" y="110" class="dim-txt">512 노드</text>

    <path d="M 645 95 L 690 95" stroke="#a855f7" stroke-width="2" marker-end="url(#arr-cnn)"/>

    <!-- 6. Output Layer: 18 actions -->
    <rect x="700" y="45" width="120" height="100" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2.5"/>
    <text x="760" y="85" class="layer-name" fill="#be185d">출력층 (Q값)</text>
    <text x="760" y="105" class="dim-txt">18개 행동 가치</text>
    <text x="760" y="125" class="dim-txt">[Q(s, a₁)...Q(s, a₁₈)]</text>
  </g>

  <!-- Explanation note -->
  <text x="460" y="340" class="desc" text-anchor="middle">합성곱 계층으로 공간적 시각 특징을 자동 추출하고, 완전연결 계층으로 행동 가치를 회귀</text>
</svg>