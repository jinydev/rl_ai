<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .box-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
    </style>
    <marker id="arr-sl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <filter id="sl-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="320" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">지도 학습(Supervised Learning)의 미니배치 학습 흐름</text>
  <text x="380" y="62" class="desc" text-anchor="middle">고정된 데이터셋에서 독립항등분포(i.i.d.) 무작위 추출을 통한 안정적인 경사하강법 갱신</text>

  <g transform="translate(60, 95)" filter="url(#sl-sh)">
    <!-- 1. Dataset Box -->
    <rect x="0" y="0" width="180" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="40" class="box-txt" fill="#1d4ed8">훈련 데이터셋</text>
    <text x="90" y="65" class="sub-txt">(이미지, 정답 레이블)</text>
    <text x="90" y="85" class="sub-txt">N = 60,000 (i.i.d.)</text>

    <!-- Arrow 1 -->
    <path d="M 180 65 L 240 65" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-sl)"/>
    <text x="210" y="55" class="desc" text-anchor="middle" font-size="11">무작위 추출</text>

    <!-- 2. Mini-batch Box -->
    <rect x="250" y="15" width="150" height="100" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="325" y="55" class="box-txt" fill="#047857">미니배치</text>
    <text x="325" y="80" class="sub-txt">Batch Size = 32</text>

    <!-- Arrow 2 -->
    <path d="M 400 65 L 460 65" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-sl)"/>
    <text x="430" y="55" class="desc" text-anchor="middle" font-size="11">순전파/역전파</text>

    <!-- 3. Neural Network Box -->
    <rect x="470" y="0" width="170" height="130" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="555" y="45" class="box-txt" fill="#be185d">신경망 학습</text>
    <text x="555" y="70" class="sub-txt">손실 계산: L(θ)</text>
    <text x="555" y="90" class="sub-txt">매개변수 θ 갱신</text>
  </g>

  <!-- Note -->
  <text x="380" y="275" class="desc" text-anchor="middle" font-weight="600" fill="#334155">데이터 샘플 간 시간적 상관관계가 없으므로 신경망이 발산하지 않고 안정적으로 수렴합니다.</text>
</svg>