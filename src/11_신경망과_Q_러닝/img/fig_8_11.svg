<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .formula { font-family: "Cambria Math", "Latin Modern Math", serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .axis-lbl { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
    <filter id="panel-box" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="880" height="440" fill="#ffffff" rx="16"/>

  <text x="440" y="38" class="main-title" text-anchor="middle">대표적인 비선형 활성화 함수: 시그모이드와 ReLU</text>

  <!-- Left: Sigmoid -->
  <g transform="translate(60, 75)" filter="url(#panel-box)">
    <rect width="360" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="180" y="32" class="col-title" text-anchor="middle">시그모이드 (Sigmoid) 함수</text>
    <text x="180" y="60" class="formula" fill="#3b82f6">y = 1 / (1 + e⁻ˣ)</text>

    <!-- Plot Area -->
    <g transform="translate(40, 80)">
      <!-- Axes -->
      <line x1="0" y1="200" x2="280" y2="200" stroke="#64748b" stroke-width="1.5"/>
      <line x1="140" y1="20" x2="140" y2="210" stroke="#64748b" stroke-width="1.5"/>

      <!-- Asymptotes (y=0, y=1) -->
      <line x1="0" y1="40" x2="280" y2="40" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="130" y="44" class="axis-lbl" text-anchor="end">1.0</text>
      <text x="130" y="124" class="axis-lbl" text-anchor="end">0.5</text>
      <text x="130" y="196" class="axis-lbl" text-anchor="end">0.0</text>

      <text x="275" y="192" class="axis-lbl" text-anchor="end">x</text>
      <text x="150" y="25" class="axis-lbl">y</text>

      <!-- Sigmoid S-curve -->
      <path d="M 10 196 C 80 196, 110 170, 140 120 C 170 70, 200 44, 270 44" fill="none" stroke="#3b82f6" stroke-width="3.5"/>
    </g>
    <text x="180" y="300" class="axis-lbl" text-anchor="middle">출력 범위: (0, 1) 매끄러운 S자 곡선</text>
  </g>

  <!-- Right: ReLU -->
  <g transform="translate(460, 75)" filter="url(#panel-box)">
    <rect width="360" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="180" y="32" class="col-title" text-anchor="middle">ReLU (Rectified Linear Unit)</text>
    <text x="180" y="60" class="formula" fill="#10b981">y = max(0, x)</text>

    <!-- Plot Area -->
    <g transform="translate(40, 80)">
      <!-- Axes -->
      <line x1="0" y1="200" x2="280" y2="200" stroke="#64748b" stroke-width="1.5"/>
      <line x1="140" y1="20" x2="140" y2="210" stroke="#64748b" stroke-width="1.5"/>

      <text x="130" y="196" class="axis-lbl" text-anchor="end">0.0</text>
      <text x="275" y="192" class="axis-lbl" text-anchor="end">x</text>
      <text x="150" y="25" class="axis-lbl">y</text>

      <!-- ReLU Ramp: flat at y=200 for x <= 140, then 45 degree up -->
      <path d="M 10 200 L 140 200 L 260 80" fill="none" stroke="#10b981" stroke-width="3.5"/>
    </g>
    <text x="180" y="300" class="axis-lbl" text-anchor="middle">0 이하 차단, 0 초과 비례 (기울기 소실 방지)</text>
  </g>
</svg>