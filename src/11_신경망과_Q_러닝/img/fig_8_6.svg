<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .callout { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 14px; font-weight: 700; }
      .math { font-family: "Cambria Math", "Latin Modern Math", serif; font-size: 16px; font-weight: 600; fill: #1e293b; }
    </style>
    <filter id="plot-bg" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">선형 회귀 모델과 잔차(Residual)</text>
  <text x="380" y="62" class="desc" text-anchor="middle">실제 데이터값과 모델 예측값(직선) 사이의 수직 거리(잔차)를 최소화</text>

  <g transform="translate(100, 90)" filter="url(#plot-bg)">
    <rect width="560" height="280" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Axes -->
    <line x1="20" y1="260" x2="540" y2="260" stroke="#475569" stroke-width="2"/>
    <line x1="20" y1="20" x2="20" y2="260" stroke="#475569" stroke-width="2"/>
    <text x="540" y="280" class="desc" text-anchor="end">x</text>
    <text x="10" y="25" class="desc">y</text>

    <!-- Fitted Regression Line: y = Wx + b -->
    <line x1="40" y1="230" x2="520" y2="50" stroke="#f43f5e" stroke-width="3.5"/>

    <!-- Sample Data Points & Residual Dashed Lines -->
    <!-- Point 1 -->
    <line x1="120" y1="200" x2="120" y2="160" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="120" cy="160" r="6" fill="#3b82f6"/>
    
    <!-- Point 2 -->
    <line x1="220" y1="162" x2="220" y2="195" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="220" cy="195" r="6" fill="#3b82f6"/>

    <!-- Point 3 -->
    <line x1="320" y1="125" x2="320" y2="80" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="320" cy="80" r="6" fill="#3b82f6"/>

    <!-- Point 4 -->
    <line x1="420" y1="87" x2="420" y2="130" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="420" cy="130" r="6" fill="#3b82f6"/>

    <!-- Callouts -->
    <!-- Model Line Tag -->
    <rect x="360" y="35" width="160" height="30" rx="15" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="440" y="55" class="callout" fill="#e11d48" text-anchor="middle">예측 모델: y = Wx + b</text>

    <!-- Residual Tag -->
    <rect x="150" y="100" width="130" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="215" y="120" class="callout" fill="#b45309" text-anchor="middle">잔차 (Residual)</text>
    <path d="M 215 130 L 220 170" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Data Point Tag -->
    <rect x="50" y="90" width="110" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="105" y="110" class="callout" fill="#1d4ed8" text-anchor="middle">실제 데이터</text>
    <path d="M 105 120 L 118 155" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- Formula -->
  <text x="380" y="410" class="math" text-anchor="middle">평균 제곱 오차 손실 함수: L = (1/N) Σ (y_pred - y_true)²</text>
</svg>