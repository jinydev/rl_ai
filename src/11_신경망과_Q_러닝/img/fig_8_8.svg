<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .mat-name { font-family: "Cambria Math", "Latin Modern Math", serif; font-size: 26px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .shape-txt { font-family: "SF Pro Text", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; fill: #475569; }
      .op-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 700; text-anchor: middle; fill: #64748b; }
    </style>
    <filter id="mat-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="300" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">행렬 곱의 형상(Shape) 변화 (D = 4차원 입력)</text>
  <text x="380" y="62" class="desc" text-anchor="middle">100개의 4차원 입력 벡터와 (4, 1) 가중치 행렬의 내적 연산</text>

  <g transform="translate(60, 95)" filter="url(#mat-shadow)">
    <!-- Matrix x: (100, 4) -->
    <rect x="0" y="0" width="180" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="90" y="55" class="mat-name" fill="#1d4ed8">x</text>
    <text x="90" y="135" class="shape-txt">(100, 4)</text>

    <!-- Dot Product Symbol -->
    <text x="215" y="62" class="op-txt">×</text>

    <!-- Matrix W: (4, 1) -->
    <rect x="250" y="0" width="100" height="110" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5"/>
    <text x="300" y="55" class="mat-name" fill="#047857">W</text>
    <text x="300" y="135" class="shape-txt">(4, 1)</text>

    <!-- Equal Symbol -->
    <text x="390" y="62" class="op-txt">=</text>

    <!-- Matrix y: (100, 1) -->
    <rect x="430" y="0" width="110" height="110" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
    <text x="485" y="55" class="mat-name" fill="#b91c1c">y</text>
    <text x="485" y="135" class="shape-txt">(100, 1)</text>
  </g>

  <!-- Dimension Match Arrow -->
  <path d="M 230 250 C 270 270, 330 270, 360 250" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="4 3"/>
  <rect x="255" y="240" width="130" height="26" rx="13" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="320" y="258" class="desc" text-anchor="middle" font-weight="700" fill="#6d28d9">내적 차원 일치 (4)</text>
</svg>