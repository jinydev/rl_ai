<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .axis-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #475569; }
      .tick { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
    <filter id="loss-bg" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="420" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">에피소드별 손실(Loss) 추이</text>
  <text x="380" y="62" class="desc" text-anchor="middle">1000 에피소드 동안 Q-learning 손실이 진동하면서 점진적으로 감소</text>

  <g transform="translate(100, 90)" filter="url(#loss-bg)">
    <rect width="580" height="260" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Grid lines -->
    <line x1="0" y1="65" x2="580" y2="65" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="130" x2="580" y2="130" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="195" x2="580" y2="195" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Axes -->
    <line x1="0" y1="260" x2="580" y2="260" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="260" stroke="#475569" stroke-width="2"/>

    <!-- X Ticks -->
    <text x="0" y="278" class="tick" text-anchor="middle">0</text>
    <text x="145" y="278" class="tick" text-anchor="middle">250</text>
    <text x="290" y="278" class="tick" text-anchor="middle">500</text>
    <text x="435" y="278" class="tick" text-anchor="middle">750</text>
    <text x="580" y="278" class="tick" text-anchor="middle">1000</text>
    <text x="290" y="305" class="axis-lbl" text-anchor="middle">에피소드 (Episodes)</text>

    <!-- Y Ticks -->
    <text x="-12" y="264" class="tick" text-anchor="end">0.0</text>
    <text x="-12" y="199" class="tick" text-anchor="end">0.1</text>
    <text x="-12" y="134" class="tick" text-anchor="end">0.2</text>
    <text x="-12" y="69" class="tick" text-anchor="end">0.3</text>
    <text x="-12" y="8" class="tick" text-anchor="end">0.4</text>
    <text x="-40" y="130" class="axis-lbl" text-anchor="middle" transform="rotate(-90, -40, 130)">평균 손실 (Loss)</text>

    <!-- Raw oscillating loss path -->
    <path d="M 0 40 L 15 110 L 30 70 L 45 130 L 60 90 L 75 140 L 90 100 L 105 160 L 120 120 L 135 150 L 150 110 L 165 170 L 180 140 L 195 180 L 210 150 L 225 190 L 240 160 L 255 180 L 270 170 L 285 200 L 300 180 L 315 210 L 330 190 L 345 220 L 360 200 L 375 225 L 390 210 L 405 230 L 420 215 L 435 235 L 450 220 L 465 240 L 480 230 L 495 242 L 510 235 L 525 245 L 540 238 L 555 248 L 570 242 L 580 245" fill="none" stroke="#93c5fd" stroke-width="1.5"/>

    <!-- Smoothed trend line -->
    <path d="M 0 55 C 80 110, 180 160, 290 185 C 400 210, 490 235, 580 245" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  </g>
</svg>