<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #475569; }
      .tick { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .badge-txt { font-family: "SF Pro Text", -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #059669; }
    </style>
    <filter id="plot-fit" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="720" height="440" fill="#ffffff" rx="16"/>

  <text x="360" y="38" class="title" text-anchor="middle">학습이 끝난 신경망이 예측한 비선형 회귀 곡선</text>
  <text x="360" y="62" class="desc" text-anchor="middle">선형 변환과 활성화 함수의 결합으로 sin 함수의 굽이치는 곡선을 성공적으로 적합</text>

  <g transform="translate(100, 90)" filter="url(#plot-fit)">
    <rect width="540" height="280" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Grid -->
    <line x1="0" y1="70" x2="540" y2="70" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="140" x2="540" y2="140" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="0" y1="210" x2="540" y2="210" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Axes -->
    <line x1="0" y1="280" x2="540" y2="280" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="280" stroke="#475569" stroke-width="2"/>

    <!-- Ticks -->
    <text x="0" y="298" class="tick" text-anchor="middle">0.0</text>
    <text x="135" y="298" class="tick" text-anchor="middle">0.25</text>
    <text x="270" y="298" class="tick" text-anchor="middle">0.5</text>
    <text x="405" y="298" class="tick" text-anchor="middle">0.75</text>
    <text x="540" y="298" class="tick" text-anchor="middle">1.0</text>
    <text x="270" y="325" class="axis-label" text-anchor="middle">x</text>

    <text x="-10" y="284" class="tick" text-anchor="end">-1.0</text>
    <text x="-10" y="144" class="tick" text-anchor="end">0.0</text>
    <text x="-10" y="10" class="tick" text-anchor="end">1.0</text>
    <text x="-40" y="140" class="axis-label" text-anchor="middle" transform="rotate(-90, -40, 140)">y</text>

    <!-- Data points -->
    <g fill="#8b5cf6" fill-opacity="0.5" stroke="#6d28d9" stroke-width="1">
      <circle cx="20" cy="140" r="4"/><circle cx="50" cy="90" r="4"/><circle cx="80" cy="50" r="4"/><circle cx="110" cy="40" r="4"/><circle cx="140" cy="65" r="4"/>
      <circle cx="170" cy="100" r="4"/><circle cx="200" cy="140" r="4"/><circle cx="230" cy="175" r="4"/><circle cx="260" cy="210" r="4"/><circle cx="290" cy="235" r="4"/>
      <circle cx="320" cy="245" r="4"/><circle cx="350" cy="230" r="4"/><circle cx="380" cy="195" r="4"/><circle cx="410" cy="155" r="4"/><circle cx="440" cy="115" r="4"/>
      <circle cx="470" cy="75" r="4"/><circle cx="500" cy="50" r="4"/><circle cx="530" cy="55" r="4"/>
    </g>

    <!-- Smooth Fitted Curve -->
    <path d="M 0 140 C 60 20, 140 20, 200 140 C 260 260, 340 260, 400 140 C 460 20, 520 20, 540 80" fill="none" stroke="#10b981" stroke-width="4"/>

    <!-- Legend -->
    <rect x="290" y="20" width="230" height="34" rx="17" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <line x1="305" y1="37" x2="335" y2="37" stroke="#10b981" stroke-width="3.5"/>
    <text x="425" y="42" class="badge-txt" text-anchor="middle">신경망 학습 예측 곡선</text>
  </g>
</svg>