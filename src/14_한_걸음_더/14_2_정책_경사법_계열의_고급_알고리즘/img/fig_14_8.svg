<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 19px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; font-weight: 500; text-anchor: middle; }
      .year-tag { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 10px; font-weight: 700; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="dqnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="25%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="540" fill="#ffffff" rx="16"/>

  <text class="title" x="460" y="38">DQN 계열 알고리즘의 진화 및 발전 계보</text>

  <!-- 1. Origin: DQN (2013/2015) -->
  <g transform="translate(110, 240)" filter="url(#shadow)">
    <rect x="-80" y="-45" width="160" height="90" rx="14" fill="url(#dqnGrad)"/>
    <rect x="-65" y="-35" width="130" height="18" rx="4" fill="#93c5fd"/>
    <text class="year-tag" x="0" y="-22" fill="#1e3a8a">2013 / 2015</text>
    <text class="box-title" x="0" y="3" fill="#ffffff" font-size="16">DQN</text>
    <text class="box-desc" x="0" y="24" fill="#bfdbfe">경험 재생 + 타깃망</text>
  </g>

  <!-- Connecting Lines from DQN to 5 extensions -->
  <path d="M 190 240 L 250 240 L 250 90 L 280 90" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 190 240 L 250 240 L 250 165 L 280 165" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 190 240 L 280 240" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 190 240 L 250 240 L 250 315 L 280 315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 190 240 L 250 240 L 250 390 L 280 390" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 5 Extension Cards -->
  <!-- 1. Double DQN -->
  <g transform="translate(365, 90)" filter="url(#shadow)">
    <rect x="-80" y="-26" width="160" height="52" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="box-title" x="0" y="-5" fill="#1e40af">Double DQN (2015)</text>
    <text class="box-desc" x="0" y="14" fill="#64748b">행동 선택/평가 분리</text>
  </g>

  <!-- 2. PER -->
  <g transform="translate(365, 165)" filter="url(#shadow)">
    <rect x="-80" y="-26" width="160" height="52" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="box-title" x="0" y="-5" fill="#1e40af">우선순위 경험재생 (2015)</text>
    <text class="box-desc" x="0" y="14" fill="#64748b">TD 오차 비례 샘플링</text>
  </g>

  <!-- 3. Dueling DQN -->
  <g transform="translate(365, 240)" filter="url(#shadow)">
    <rect x="-80" y="-26" width="160" height="52" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="box-title" x="0" y="-5" fill="#1e40af">Dueling DQN (2016)</text>
    <text class="box-desc" x="0" y="14" fill="#64748b">V(s)와 A(s,a) 분리</text>
  </g>

  <!-- 4. Categorical DQN -->
  <g transform="translate(365, 315)" filter="url(#shadow)">
    <rect x="-80" y="-26" width="160" height="52" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="box-title" x="0" y="-5" fill="#1e40af">범주형 DQN (2017)</text>
    <text class="box-desc" x="0" y="14" fill="#64748b">C51 가치 확률 분포</text>
  </g>

  <!-- 5. Noisy Net -->
  <g transform="translate(365, 390)" filter="url(#shadow)">
    <rect x="-80" y="-26" width="160" height="52" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="box-title" x="0" y="-5" fill="#1e40af">Noisy Net (2017)</text>
    <text class="box-desc" x="0" y="14" fill="#64748b">파라미터 노이즈 탐색</text>
  </g>

  <!-- Convergence to Rainbow -->
  <path d="M 445 90 L 480 90 L 480 240 L 510 240" fill="none" stroke="#ec4899" stroke-width="1.8"/>
  <path d="M 445 165 L 480 165 L 480 240 L 510 240" fill="none" stroke="#8b5cf6" stroke-width="1.8"/>
  <path d="M 445 240 L 510 240" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 445 315 L 480 315 L 480 240 L 510 240" fill="none" stroke="#10b981" stroke-width="1.8"/>
  <path d="M 445 390 L 480 390 L 480 240 L 510 240" fill="none" stroke="#f59e0b" stroke-width="1.8"/>

  <!-- Rainbow Box -->
  <g transform="translate(585, 240)" filter="url(#shadow)">
    <rect x="-65" y="-55" width="130" height="110" rx="14" fill="#ffffff" stroke="url(#rainbowGrad)" stroke-width="3"/>
    <rect x="-50" y="-45" width="100" height="18" rx="4" fill="#fef3c7"/>
    <text class="year-tag" x="0" y="-32" fill="#b45309">2017 결합</text>
    <text class="box-title" x="0" y="-6" fill="#0f172a" font-size="16">레인보우</text>
    <text class="box-title" x="0" y="12" fill="#4338ca" font-size="12">(Rainbow)</text>
    <text class="box-desc" x="0" y="32" fill="#475569">6대 확장 완벽 통합</text>
    <text class="box-desc" x="0" y="46" fill="#059669" font-weight="700">압도적 최고 성능</text>
  </g>

  <!-- Arrow to Post-Rainbow -->
  <path d="M 650 240 L 700 240" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowGold)"/>

  <!-- Post-Rainbow Advancements (Right Column) -->
  <g transform="translate(800, 240)">
    <rect x="-95" y="-180" width="190" height="360" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text class="box-title" x="0" y="-155" fill="#92400e">레인보우 이후의 발전</text>

    <!-- Ape-X -->
    <g transform="translate(0, -110)">
      <rect x="-85" y="-22" width="170" height="44" rx="8" fill="#ffffff" stroke="#fcd34d"/>
      <text class="box-title" x="0" y="-4" fill="#78350f">Ape-X (2018)</text>
      <text class="box-desc" x="0" y="12" fill="#92400e">대규모 분산 병렬화</text>
    </g>

    <!-- R2D2 -->
    <g transform="translate(0, -35)">
      <rect x="-85" y="-22" width="170" height="44" rx="8" fill="#ffffff" stroke="#fcd34d"/>
      <text class="box-title" x="0" y="-4" fill="#78350f">R2D2 (2018)</text>
      <text class="box-desc" x="0" y="12" fill="#92400e">순환 신경망(LSTM) 결합</text>
    </g>

    <!-- NGU -->
    <g transform="translate(0, 40)">
      <rect x="-85" y="-22" width="170" height="44" rx="8" fill="#ffffff" stroke="#fcd34d"/>
      <text class="box-title" x="0" y="-4" fill="#78350f">NGU (2020)</text>
      <text class="box-desc" x="0" y="12" fill="#92400e">내적 호기심 보상 (Never Give Up)</text>
    </g>

    <!-- Agent57 -->
    <g transform="translate(0, 115)">
      <rect x="-85" y="-22" width="170" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text class="box-title" x="0" y="-4" fill="#b45309" font-weight="bold">Agent57 (2020)</text>
      <text class="box-desc" x="0" y="12" fill="#78350f" font-weight="700">57개 전 아타리 인간 초과</text>
    </g>
  </g>
</svg>
