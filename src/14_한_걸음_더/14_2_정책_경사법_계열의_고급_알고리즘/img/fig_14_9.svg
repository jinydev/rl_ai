<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 14.5px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-style: italic; text-anchor: middle; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="distGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="340" fill="#ffffff" rx="16"/>

  <text class="title" x="440" y="38">수익의 확률 분포 Z_π(s, a)와 Q 함수의 관계</text>

  <!-- Left: Distributional RL (Full Probability Distribution Z) -->
  <g transform="translate(230, 180)" filter="url(#shadow)">
    <rect x="-170" y="-95" width="340" height="190" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="-155" y="-85" width="310" height="26" rx="6" fill="#eff6ff"/>
    <text class="box-title" x="0" y="-68" fill="#1e40af">수익의 확률 분포 Z_π(s, a)</text>
    <text class="box-desc" x="0" y="-48" fill="#64748b">불확실성과 다양한 보상 가능성(분산, 왜도) 포함</text>

    <!-- Graph Drawing -->
    <line x1="-140" y1="45" x2="140" y2="45" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-140" y1="45" x2="-140" y2="-30" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="axis-label" x="-140" y="-36">확률 밀도</text>
    <text class="axis-label" x="135" y="58">수익 G</text>

    <!-- Bimodal / Multimodal Distribution Curve -->
    <path d="M -130 44 Q -100 44 -80 0 Q -60 -40 -40 20 Q -20 30 10 -25 Q 30 -50 60 10 Q 90 44 130 44 Z" fill="url(#distGrad)"/>
    <path d="M -130 44 Q -100 44 -80 0 Q -60 -40 -40 20 Q -20 30 10 -25 Q 30 -50 60 10 Q 90 44 130 44" fill="none" stroke="#2563eb" stroke-width="2"/>

    <!-- Mean dashed line -->
    <line x1="5" y1="-50" x2="5" y2="45" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="5" cy="45" r="3.5" fill="#dc2626"/>
    <text class="axis-label" x="5" y="58" fill="#dc2626" font-weight="700">기댓값 위치</text>
  </g>

  <!-- Center Arrow: Expectation Operator -->
  <g transform="translate(480, 180)">
    <path d="M -40 0 L 30 0" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="-45" y="-32" width="90" height="24" rx="6" fill="#dbeafe"/>
    <text class="box-title" x="0" y="-16" fill="#1d4ed8">기댓값 계산</text>
    <text class="math" x="0" y="24" fill="#1e40af">E[Z_π]</text>
  </g>

  <!-- Right: Standard Q-learning (Scalar Value Q) -->
  <g transform="translate(710, 180)" filter="url(#shadow)">
    <rect x="-130" y="-95" width="260" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="-115" y="-85" width="230" height="26" rx="6" fill="#f8fafc"/>
    <text class="box-title" x="0" y="-68" fill="#334155">기존 Q 함수 Q_π(s, a)</text>
    <text class="box-desc" x="0" y="-48" fill="#64748b">기댓값 하나로 축약된 단일 스칼라</text>

    <!-- Scalar Output Box -->
    <rect x="-70" y="-15" width="140" height="60" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text class="math" x="0" y="14" fill="#15803d" font-size="22" font-weight="bold">Q = 1.8</text>
    <text class="box-desc" x="0" y="34" fill="#166534">단일 기대 수익값</text>

    <text class="box-desc" x="0" y="72" fill="#94a3b8">분산과 위험(Risk) 정보 상실</text>
  </g>
</svg>
