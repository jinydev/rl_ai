<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-style: italic; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="260" fill="#ffffff" rx="16"/>

  <text class="title" x="390" y="38">결정적 정책 신경망 (Deterministic Policy Network)</text>

  <!-- 1. State Input -->
  <g transform="translate(130, 140)" filter="url(#shadow)">
    <rect x="-60" y="-45" width="120" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text class="box-title" x="0" y="-12" fill="#1d4ed8">상태 s</text>
    <text class="box-desc" x="0" y="8" fill="#2563eb">State Input</text>
    <text class="box-desc" x="0" y="24" fill="#64748b">환경 관측치</text>
  </g>

  <!-- Arrow -->
  <path d="M 190 140 L 270 140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Deterministic Policy Network -->
  <g transform="translate(390, 140)" filter="url(#shadow)">
    <rect x="-110" y="-55" width="220" height="110" rx="14" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="-95" y="-45" width="190" height="24" rx="6" fill="#ede9fe"/>
    <text class="box-title" x="0" y="-28" fill="#6d28d9">결정적 정책 신경망 μ_θ(s)</text>
    <text class="box-desc" x="0" y="6" fill="#475569">확률 분포 없이 행동을 직접 계산</text>
    <text class="box-desc" x="0" y="24" fill="#64748b">출력층: Tanh × 행동 스케일링</text>
    <text class="box-desc" x="0" y="42" fill="#7c3aed" font-weight="700">종단간 역전파 가능</text>
  </g>

  <!-- Arrow -->
  <path d="M 500 140 L 580 140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Direct Continuous Action Output -->
  <g transform="translate(660, 140)" filter="url(#shadow)">
    <rect x="-70" y="-45" width="140" height="90" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text class="box-title" x="0" y="-14" fill="#be185d">결정적 행동 a</text>
    <text class="math" x="0" y="10" fill="#db2777" font-weight="bold" font-size="18">a = 1.6</text>
    <text class="box-desc" x="0" y="28" fill="#9d174d">샘플링 없는 고유 값</text>
  </g>

  <!-- Bottom Annotation -->
  <text class="box-desc" x="390" y="235" fill="#64748b">특정 상태 s가 주어지면 단 하나의 행동 a가 결정되므로 Q 함수를 통한 직접적인 미분 및 매개변수 갱신이 가능</text>
</svg>
