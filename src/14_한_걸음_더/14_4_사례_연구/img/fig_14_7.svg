<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 14.5px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-style: italic; text-anchor: middle; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" fill="#ffffff" rx="16"/>

  <text class="title" x="440" y="38">DDPG: 정책 신경망과 Q 신경망의 순전파 및 역전파 흐름</text>

  <!-- State Input -->
  <g transform="translate(100, 160)" filter="url(#shadow)">
    <rect x="-55" y="-45" width="110" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text class="box-title" x="0" y="-12" fill="#1d4ed8">상태 s</text>
    <text class="box-desc" x="0" y="10" fill="#2563eb">State Input</text>
  </g>

  <!-- Split paths for state s -->
  <!-- Path 1 to Policy Network -->
  <path d="M 155 160 L 225 160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Path 2 bypasses to Q Network below -->
  <path d="M 100 205 L 100 310 L 520 310 L 520 230" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="250" y="298" width="130" height="22" rx="4" fill="#f1f5f9"/>
  <text class="flow-label" x="315" y="313" fill="#64748b">상태 s 직접 입력</text>

  <!-- Policy Network (Actor) -->
  <g transform="translate(330, 160)" filter="url(#shadow)">
    <rect x="-95" y="-60" width="190" height="120" rx="14" fill="#fdf4ff" stroke="#c084fc" stroke-width="2"/>
    <rect x="-80" y="-50" width="160" height="24" rx="6" fill="#fae8ff"/>
    <text class="box-title" x="0" y="-33" fill="#86198f">정책 신경망 (Actor)</text>
    <text class="math" x="0" y="-3" fill="#701a75" font-size="17">a = μ_θ(s)</text>
    <text class="box-desc" x="0" y="20" fill="#a21caf">결정적 연속 행동 산출</text>
    <rect x="-70" y="30" width="140" height="18" rx="4" fill="#ede9fe"/>
    <text class="box-desc" x="0" y="43" fill="#6d28d9" font-weight="700">매개변수: θ</text>
  </g>

  <!-- Action a Arrow -->
  <path d="M 425 160 L 525 160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="445" y="138" width="60" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="math" x="475" y="154" fill="#0f172a" font-weight="bold">a</text>

  <!-- Q Network (Critic) -->
  <g transform="translate(630, 160)" filter="url(#shadow)">
    <rect x="-95" y="-60" width="190" height="120" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <rect x="-80" y="-50" width="160" height="24" rx="6" fill="#dcfce7"/>
    <text class="box-title" x="0" y="-33" fill="#166534">가치 신경망 (Critic)</text>
    <text class="math" x="0" y="-3" fill="#14532d" font-size="17">q = Q_ϕ(s, a)</text>
    <text class="box-desc" x="0" y="20" fill="#15803d">행동 가치 평가 (Q 러닝)</text>
    <rect x="-70" y="30" width="140" height="18" rx="4" fill="#ecfdf5"/>
    <text class="box-desc" x="0" y="43" fill="#047857" font-weight="700">매개변수: ϕ</text>
  </g>

  <!-- Output q Arrow -->
  <path d="M 725 160 L 785 160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output q -->
  <g transform="translate(825, 160)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text class="math" x="0" y="7" fill="#b45309" font-size="20" font-weight="bold">q</text>
  </g>

  <!-- Backpropagation Gradient Flow (Red Line) -->
  <path d="M 630 85 L 630 65 L 330 65 L 330 85" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowBack)"/>
  
  <g transform="translate(480, 65)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text class="flow-label" x="0" y="5" fill="#b91c1c">역전파 체인룰: ∇_θ J ≈ ∇_a Q_ϕ(s, a) · ∇_θ μ_θ(s)</text>
  </g>

  <!-- Bottom Explanatory Box -->
  <g transform="translate(440, 395)">
    <rect x="-350" y="-22" width="700" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="box-desc" x="0" y="-4" fill="#334155" font-weight="600">행동 a가 샘플링 없이 결정적으로 전달되므로, Q 함수로부터 행동 a를 거쳐 정책 매개변수 θ까지</text>
    <text class="box-desc" x="0" y="14" fill="#475569">기울기 ∇_a Q가 차단되지 않고 부드럽게 역전파되어 정책을 효율적으로 최적화함</text>
  </g>
</svg>
