<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="450" fill="#ffffff" rx="16"/>

  <text class="title" x="460" y="38">온라인 강화 학습 (일반적) vs 오프라인 강화 학습 (Offline RL)</text>

  <!-- Divider Line -->
  <line x1="460" y1="70" x2="460" y2="400" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Left Side: 일반적인 (온라인) 강화 학습 -->
  <g transform="translate(230, 75)">
    <!-- Container Card -->
    <rect x="-205" y="0" width="410" height="325" rx="14" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="-190" y="12" width="380" height="28" rx="6" fill="#eff6ff"/>
    <text class="box-title" x="0" y="31" fill="#1d4ed8">일반적인 (온라인) 강화 학습</text>

    <!-- Agent Box -->
    <g transform="translate(0, 95)" filter="url(#shadow)">
      <rect x="-120" y="-30" width="240" height="60" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
      <text class="sub-title" x="0" y="-4" fill="#1e40af">에이전트 (Agent)</text>
      <text class="box-desc" x="0" y="15" fill="#64748b">실시간 정책 실행 및 탐색</text>
    </g>

    <!-- Interaction Flows -->
    <!-- Down Arrow: Action -->
    <path d="M 70 125 L 70 205" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <rect x="75" y="153" width="75" height="22" rx="4" fill="#dbeafe"/>
    <text class="flow-label" x="112" y="168" fill="#1e40af">행동 A_t</text>

    <!-- Up Arrow: State & Reward -->
    <path d="M -70 205 L -70 125" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <rect x="-160" y="153" width="85" height="22" rx="4" fill="#d1fae5"/>
    <text class="flow-label" x="-117" y="168" fill="#047857">상태 S_t, 보상 R_t</text>

    <!-- Environment Box -->
    <g transform="translate(0, 235)" filter="url(#shadow)">
      <rect x="-120" y="-30" width="240" height="60" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <text class="sub-title" x="0" y="-4" fill="#065f46">환경 (Environment)</text>
      <text class="box-desc" x="0" y="15" fill="#64748b">실시간 물리 세계 / 시뮬레이터 상호작용</text>
    </g>

    <text class="box-desc" x="0" y="295" fill="#475569" font-weight="600">에이전트가 환경과 지속적으로 직접 상호작용하며 시행착오 학습</text>
    <text class="box-desc" x="0" y="312" fill="#94a3b8">(안전성 위험, 로봇 마모, 데이터 수집 비용 발생)</text>
  </g>

  <!-- Right Side: 오프라인 강화 학습 (Offline RL) -->
  <g transform="translate(690, 75)">
    <!-- Container Card -->
    <rect x="-205" y="0" width="410" height="325" rx="14" fill="#f8fafc" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="-190" y="12" width="380" height="28" rx="6" fill="#fdf4ff"/>
    <text class="box-title" x="0" y="31" fill="#86198f">오프라인 강화 학습 (Offline RL)</text>

    <!-- Agent Box -->
    <g transform="translate(0, 95)" filter="url(#shadow)">
      <rect x="-120" y="-30" width="240" height="60" rx="10" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
      <text class="sub-title" x="0" y="-4" fill="#6b21a8">에이전트 (Agent)</text>
      <text class="box-desc" x="0" y="15" fill="#64748b">정적 데이터로부터 최적 정책 추정</text>
    </g>

    <!-- Flow: Dataset to Agent -->
    <path d="M 0 205 L 0 125" fill="none" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <rect x="-115" y="153" width="230" height="22" rx="4" fill="#fae8ff"/>
    <text class="flow-label" x="0" y="168" fill="#701a75">사전 수집된 배치 데이터만 공급 (s, a, r, s')</text>

    <!-- Static Dataset Box -->
    <g transform="translate(0, 235)" filter="url(#shadow)">
      <rect x="-135" y="-30" width="270" height="60" rx="10" fill="#ffffff" stroke="#d946ef" stroke-width="2"/>
      <text class="sub-title" x="0" y="-4" fill="#a21caf">고정 데이터셋 (Static Dataset D)</text>
      <text class="box-desc" x="0" y="15" fill="#64748b">사람의 조작 로그, 과거 에이전트들의 기록</text>
    </g>

    <!-- No Environment Interaction Cross Badge -->
    <g transform="translate(0, 276)">
      <rect x="-105" y="0" width="210" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text class="flow-label" x="0" y="16" fill="#dc2626">환경과의 실시간 상호작용 완전 배제</text>
    </g>

    <text class="box-desc" x="0" y="316" fill="#475569" font-weight="600">위험한 물리 환경에서도 안전하게 기존 빅데이터로 정책 최적화</text>
  </g>

  <!-- Bottom Annotation -->
  <text class="box-desc" x="460" y="430" fill="#334155">오프라인 강화 학습은 데이터셋에 없는 미지의 행동(OOD)에 대한 가치 과대평가 문제를 완화하는 보수적 Q 학습(CQL 등)이 핵심</text>
</svg>
