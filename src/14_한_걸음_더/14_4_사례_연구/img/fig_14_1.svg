<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; fill: #334155; text-anchor: middle; }
      .leaf-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .leaf-items { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <linearGradient id="gradRoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradMB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="gradMF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="540" fill="#ffffff" rx="16"/>

  <!-- Root: 심층 강화 학습 알고리즘 -->
  <g transform="translate(460, 45)" filter="url(#shadow)">
    <rect x="-160" y="-25" width="320" height="50" rx="25" fill="url(#gradRoot)"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, Pretendard, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor: middle;">심층 강화 학습 알고리즘 분류</text>
    <text x="0" y="21" font-family="-apple-system, BlinkMacSystemFont, Pretendard, sans-serif" font-size="11" font-weight="500" fill="#bfdbfe" text-anchor: middle;">Deep Reinforcement Learning Taxonomy</text>
  </g>

  <!-- Connecting Lines from Root -->
  <path d="M 460 70 L 460 95 L 230 95 L 230 125" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 460 70 L 460 95 L 670 95 L 670 125" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch 1: 모델 기반 (Model-Based) -->
  <g transform="translate(230, 150)" filter="url(#shadow)">
    <rect x="-160" y="-25" width="320" height="50" rx="12" fill="url(#gradMB)" stroke="#86efac" stroke-width="2"/>
    <text class="box-title" x="0" y="-3">모델 기반 기법 (Model-Based)</text>
    <text class="box-desc" x="0" y="16">환경의 전이 확률 및 보상 함수 p(s'|s,a), r 활용</text>
  </g>

  <!-- Branch 2: 모델 프리 (Model-Free) -->
  <g transform="translate(670, 150)" filter="url(#shadow)">
    <rect x="-210" y="-25" width="420" height="50" rx="12" fill="url(#gradMF)" stroke="#93c5fd" stroke-width="2"/>
    <text class="box-title" x="0" y="-3">모델 프리 기법 (Model-Free)</text>
    <text class="box-desc" x="0" y="16">환경 모델 없이 시행착오와 경험 샘플로부터 직접 학습</text>
  </g>

  <!-- Model-Based Children Lines -->
  <path d="M 230 175 L 230 205 L 140 205 L 140 235" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 230 175 L 230 205 L 320 205 L 320 235" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MB Leaf 1: 주어진 모델 이용 -->
  <g transform="translate(140, 275)" filter="url(#shadow)">
    <rect x="-85" y="-40" width="170" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="-70" y="-32" width="140" height="20" rx="4" fill="#dcfce7"/>
    <text class="leaf-title" x="0" y="-18" fill="#15803d">주어진 모델 이용</text>
    <text class="leaf-items" x="0" y="6">규칙 완비 보드게임</text>
    <text class="leaf-items" x="0" y="24" font-weight="700" fill="#166534">알파고, 알파제로</text>
  </g>

  <!-- MB Leaf 2: 환경 모델 학습 -->
  <g transform="translate(320, 275)" filter="url(#shadow)">
    <rect x="-85" y="-40" width="170" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="-70" y="-32" width="140" height="20" rx="4" fill="#fef3c7"/>
    <text class="leaf-title" x="0" y="-18" fill="#b45309">환경 모델 학습</text>
    <text class="leaf-items" x="0" y="6">상태 전이 함수 모델링</text>
    <text class="leaf-items" x="0" y="24" font-weight="700" fill="#92400e">World Models, MBVE</text>
  </g>

  <!-- Model-Free Children Lines -->
  <path d="M 540 175 L 540 235" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 800 175 L 800 235" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MF Child 1: 정책 기반 (Policy-Based) -->
  <g transform="translate(540, 275)" filter="url(#shadow)">
    <rect x="-90" y="-40" width="180" height="82" rx="10" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5"/>
    <rect x="-75" y="-32" width="150" height="20" rx="4" fill="#fae8ff"/>
    <text class="leaf-title" x="0" y="-18" fill="#a21caf">정책 기반 (Policy-Based)</text>
    <text class="leaf-items" x="0" y="6">정책 π_θ 직접 최적화</text>
    <text class="leaf-items" x="0" y="24" font-weight="700" fill="#86198f">정책 경사법, REINFORCE</text>
  </g>

  <!-- MF Child 2: 가치 기반 (Value-Based) -->
  <g transform="translate(800, 275)" filter="url(#shadow)">
    <rect x="-90" y="-40" width="180" height="82" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="-75" y="-32" width="150" height="20" rx="4" fill="#e0f2fe"/>
    <text class="leaf-title" x="0" y="-18" fill="#0369a1">가치 기반 (Value-Based)</text>
    <text class="leaf-items" x="0" y="6">행동 가치 함수 Q(s,a) 학습</text>
    <text class="leaf-items" x="0" y="24" font-weight="700" fill="#075985">DQN, Double DQN, Rainbow</text>
  </g>

  <!-- Intersection/Combined: 행위자-비평자 (Actor-Critic) -->
  <path d="M 540 316 L 540 375 L 660 375" fill="none" stroke="#a855f7" stroke-dasharray="4,4" stroke-width="2"/>
  <path d="M 800 316 L 800 375 L 680 375" fill="none" stroke="#0ea5e9" stroke-dasharray="4,4" stroke-width="2"/>
  <path d="M 670 375 L 670 405" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(670, 455)" filter="url(#shadow)">
    <rect x="-210" y="-50" width="420" height="100" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
    <rect x="-195" y="-42" width="390" height="22" rx="6" fill="#e0e7ff"/>
    <text class="leaf-title" x="0" y="-27" fill="#4338ca">두 영역의 교집합: 행위자-비평자 (Actor-Critic)</text>
    <text class="leaf-items" x="0" y="-5" fill="#312e81" font-weight="600">행위자(Actor, 정책 π) + 비평자(Critic, 가치 V) 동시 학습</text>
    <line x1="-190" y1="6" x2="190" y2="6" stroke="#e2e8f0" stroke-width="1"/>
    <text class="leaf-items" x="0" y="25" font-weight="700" fill="#4f46e5">A3C / A2C  •  DDPG  •  TRPO  •  PPO  •  SAC</text>
    <text class="leaf-items" x="0" y="40" font-size="10.5" fill="#64748b">(분산 병렬 학습, 연속 행동 공간 최적화, 신뢰 영역 제약)</text>
  </g>
</svg>
