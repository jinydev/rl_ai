<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .axis-tick { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="400" fill="#ffffff" rx="16"/>

  <text class="title" x="440" y="38">범주형 DQN (C51): 수익의 범주형 분포(Categorical Distribution) 모델링</text>

  <!-- Legend -->
  <g transform="translate(620, 60)">
    <rect x="0" y="0" width="16" height="12" rx="2" fill="#93c5fd" stroke="#3b82f6"/>
    <text class="legend-text" x="24" y="11">이산 범주별 확률 p_i (51개 빈)</text>

    <line x1="0" y1="26" x2="16" y2="26" stroke="#2563eb" stroke-width="2.5"/>
    <text class="legend-text" x="24" y="30">실제 연속 확률 밀도 곡선</text>
  </g>

  <!-- Main Chart Area -->
  <g transform="translate(100, 80)">
    <!-- Grid and Axes -->
    <line x1="50" y1="240" x2="680" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="50" y1="240" x2="50" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
    
    <text class="axis-title" x="30" y="25" text-anchor="end">확률 (Probability)</text>
    <text class="axis-title" x="690" y="245" text-anchor="start">수익 (Return z)</text>

    <!-- Support ticks on X axis -->
    <text class="axis-tick" x="90" y="260">V_min (-10)</text>
    <line x1="90" y1="240" x2="90" y2="245" stroke="#94a3b8"/>

    <text class="axis-tick" x="365" y="260">0</text>
    <line x1="365" y1="240" x2="365" y2="245" stroke="#94a3b8"/>

    <text class="axis-tick" x="640" y="260">V_max (+10)</text>
    <line x1="640" y1="240" x2="640" y2="245" stroke="#94a3b8"/>

    <!-- 25 representative bins (histogram bars) -->
    <!-- Heights calculated from smooth bimodal distribution -->
    <g fill="#bfdbfe" stroke="#60a5fa" stroke-width="1">
      <rect x="80" y="235" width="16" height="5"/>
      <rect x="102" y="230" width="16" height="10"/>
      <rect x="124" y="215" width="16" height="25"/>
      <rect x="146" y="180" width="16" height="60"/>
      <rect x="168" y="140" width="16" height="100"/>
      <rect x="190" y="105" width="16" height="135"/>
      <rect x="212" y="90" width="16" height="150"/>
      <rect x="234" y="110" width="16" height="130"/>
      <rect x="256" y="150" width="16" height="90"/>
      <rect x="278" y="185" width="16" height="55"/>
      <rect x="300" y="200" width="16" height="40"/>
      <rect x="322" y="195" width="16" height="45"/>
      <rect x="344" y="175" width="16" height="65"/>
      <rect x="366" y="145" width="16" height="95"/>
      <rect x="388" y="100" width="16" height="140"/>
      <rect x="410" y="65" width="16" height="175"/>
      <rect x="432" y="55" width="16" height="185"/>
      <rect x="454" y="70" width="16" height="170"/>
      <rect x="476" y="105" width="16" height="135"/>
      <rect x="498" y="150" width="16" height="90"/>
      <rect x="520" y="190" width="16" height="50"/>
      <rect x="542" y="215" width="16" height="25"/>
      <rect x="564" y="228" width="16" height="12"/>
      <rect x="586" y="235" width="16" height="5"/>
      <rect x="608" y="238" width="16" height="2"/>
    </g>

    <!-- Overlay smooth curve representing true continuous distribution -->
    <path d="M 70 239 C 120 238 160 170 220 90 C 260 110 280 200 320 200 C 370 180 400 65 440 52 C 480 65 520 180 570 225 C 610 238 640 239 660 240" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>

    <!-- Atom indicator -->
    <g transform="translate(440, 240)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1d4ed8" stroke-width="2"/>
      <text class="axis-tick" x="0" y="20" fill="#1d4ed8" font-weight="700">원자(Atom) z_i</text>
    </g>
  </g>

  <!-- Bottom Explanatory Box -->
  <g transform="translate(440, 365)">
    <text class="box-desc" x="0" y="0">수익 구간 [V_min, V_max]을 51개의 이산 원자(atom)로 균등 분할하여 각 빈에 속할 확률 p_i를 신경망으로 직접 예측</text>
    <text class="box-desc" x="0" y="18" fill="#475569">벨만 투영 연산자(Projected Bellman Operator)를 통해 전체 분포의 형상을 보존하며 안정적으로 학습</text>
  </g>
</svg>
