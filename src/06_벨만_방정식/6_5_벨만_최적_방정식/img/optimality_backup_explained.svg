<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-selected" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 1. Current State S_t = s -->
  <g transform="translate(310, 45)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">s</text>
  </g>
  <text x="310" y="15" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">최적 상태 가치 v_*(s)</text>

  <!-- Max Operator Arc over branches -->
  <path d="M 282 66 Q 310 77 338 66" fill="none" stroke="#be123c" stroke-width="2.5"/>
  <text x="310" y="86" font-family="sans-serif" font-size="10" font-weight="bold" fill="#be123c" text-anchor="middle">max_a</text>

  <!-- Action Branches -->
  <!-- Left path (not chosen - thin, gray, dashed) -->
  <line x1="292" y1="61" x2="190" y2="116" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Right path (chosen as max - thick, orange/amber) -->
  <line x1="328" y1="61" x2="430" y2="116" stroke="#f59e0b" stroke-width="3"/>

  <!-- Value labels showing why right is max -->
  <text x="210" y="90" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">가치 = -2</text>
  <text x="410" y="90" font-family="sans-serif" font-size="9" fill="#d97706" font-weight="bold" text-anchor="middle">최대 가치 = 4 (선택됨)</text>

  <!-- Action Nodes -->
  <circle cx="190" cy="118" r="6" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <circle cx="430" cy="118" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="190" y="135" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">a_1</text>
  <text x="430" y="138" font-family="sans-serif" font-size="12" fill="#d97706" font-weight="bold" text-anchor="middle">a_2</text>

  <!-- Transitions from chosen action a_2 -->
  <line x1="430" y1="125" x2="350" y2="185" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="430" y1="125" x2="510" y2="185" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Dotted transition from ignored action a_1 -->
  <line x1="190" y1="124" x2="140" y2="185" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="190" y1="124" x2="240" y2="185" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Transition probability & Reward labels for the chosen path -->
  <text x="365" y="152" font-family="sans-serif" font-size="9" fill="#047857" text-anchor="end">p(s_3|s,a_2)</text>
  <text x="365" y="164" font-family="sans-serif" font-size="9" fill="#b45309" text-anchor="end">r(s,a_2,s_3)</text>

  <text x="495" y="152" font-family="sans-serif" font-size="9" fill="#047857" text-anchor="start">p(s_4|s,a_2)</text>
  <text x="495" y="164" font-family="sans-serif" font-size="9" fill="#b45309" text-anchor="start">r(s,a_2,s_4)</text>

  <!-- States -->
  <!-- Ignored states -->
  <circle cx="140" cy="200" r="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="240" cy="200" r="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Chosen states -->
  <g transform="translate(340, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">s_3</text>
  </g>
  <text x="340" y="232" font-family="sans-serif" font-size="10" fill="#047857" text-anchor="middle">v_*(s_3)</text>

  <g transform="translate(520, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">s_4</text>
  </g>
  <text x="520" y="232" font-family="sans-serif" font-size="10" fill="#047857" text-anchor="middle">v_*(s_4)</text>

  <!-- Summary Bracket & Formula Map -->
  <path d="M 60 245 H 560" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="310" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#be123c" text-anchor="middle">v_*(s) = max_a ∑_s' p(s'|s,a) [ r(s,a,s') + γ v_*(s') ]</text>
</svg>
