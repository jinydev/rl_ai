  <circle cx="215" cy="260" r="6" fill="#2d3748"/>
  <text x="230" y="264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d3748">Right</text>

  <line x1="330" y1="210" x2="295" y2="250" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="285" cy="260" r="6" fill="#2d3748"/>
  <text x="300" y="264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d3748">Left</text>

  <line x1="360" y1="210" x2="395" y2="250" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="405" cy="260" r="6" fill="#2d3748"/>
  <text x="420" y="264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d3748">Right</text>

  <!-- Level 4 State Nodes -->
  <line x1="95" y1="266" x2="95" y2="304" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="85" y="290" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="end">-1</text>
