  <line x1="140" y1="210" x2="105" y2="250" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="95" cy="260" r="6" fill="#2d3748"/>
  <text x="110" y="264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d3748">Left</text>

