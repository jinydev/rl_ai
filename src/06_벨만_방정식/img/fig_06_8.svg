  <circle cx="155" cy="200" r="18" fill="#ffffff" stroke="#2d3748" stroke-width="2.5"/>
  <text x="155" y="204" font-family="sans-serif" font-size="13" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">L1</text>

  <line x1="345" y1="116" x2="345" y2="182" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
