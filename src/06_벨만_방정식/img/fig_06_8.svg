  <circle cx="345" cy="200" r="18" fill="#ffffff" stroke="#2d3748" stroke-width="2.5"/>
  <text x="345" y="204" font-family="sans-serif" font-size="13" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">L2</text>

