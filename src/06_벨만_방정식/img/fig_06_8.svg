  <text x="95" y="324" font-family="sans-serif" font-size="10" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">L1</text>

  <line x1="215" y1="266" x2="215" y2="304" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="290" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="end">+1</text>
  <circle cx="215" cy="320" r="14" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
  <text x="215" y="324" font-family="sans-serif" font-size="10" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">L2</text>

  <line x1="285" y1="266" x2="285" y2="304" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="290" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="end">0</text>
  <circle cx="285" cy="320" r="14" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
  <text x="285" y="324" font-family="sans-serif" font-size="10" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">L1</text>

  <line x1="405" y1="266" x2="405" y2="304" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="290" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="end">-1</text>
  <circle cx="405" cy="320" r="14" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
  <text x="405" y="324" font-family="sans-serif" font-size="10" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">L2</text>

  <!-- Level 5 dashed pointers -->
  <line x1="85" y1="334" x2="75" y2="348" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="105" y1="334" x2="115" y2="348" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="205" y1="334" x2="195" y2="348" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="225" y1="334" x2="235" y2="348" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="275" y1="334" x2="265" y2="348" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="295" y1="334" x2="305" y2="348" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="395" y1="334" x2="385" y2="348" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="415" y1="334" x2="425" y2="348" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
</svg>