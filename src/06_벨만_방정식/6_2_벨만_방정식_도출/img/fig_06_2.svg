<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 30 17 C 20 12, 10 22, 15 37 C 18 47, 25 50, 30 47 C 35 50, 42 47, 45 37 C 50 22, 40 12, 30 17 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 30 17 Q 34 8 42 11" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 34 13 Q 41 9 42 16 C 39 18, 36 16, 34 13 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon -->
    <g id="agent">
      <rect x="12" y="17" width="36" height="32" rx="12" ry="12" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="23" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="37" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="21" cy="28" r="3" fill="#2d3748"/>
      <circle cx="35" cy="28" r="3" fill="#2d3748"/>
      <path d="M 27 38 Q 30 41 33 38" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
      <path d="M 28 39 Q 30 44 32 39 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 16 49 C 16 47, 24 47, 24 49 C 24 51, 22 53, 19 53 C 15 53, 16 49, 16 49 Z" fill="#2d3748"/>
      <path d="M 36 49 C 36 47, 44 47, 44 49 C 44 51, 42 53, 39 53 C 35 53, 36 49, 36 49 Z" fill="#2d3748"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
  </defs>
  <!-- Dice action node at top -->
  <circle cx="200" cy="40" r="8" fill="#2d3748"/>
  
  <!-- 6 outcome state branches -->
  <!-- 1/6 label over the left branch -->
  <line x1="200" y1="48" x2="50" y2="112" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="110" y="70" font-family="sans-serif" font-size="16" fill="#2d3748" font-weight="bold">1/6</text>
  <circle cx="50" cy="130" r="16" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
  <text x="50" y="135" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">1</text>

  <line x1="200" y1="48" x2="110" y2="112" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="110" cy="130" r="16" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
  <text x="110" y="135" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">2</text>

  <line x1="200" y1="48" x2="170" y2="112" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="170" cy="130" r="16" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
  <text x="170" y="135" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">3</text>

  <line x1="200" y1="48" x2="230" y2="112" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="230" cy="130" r="16" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
  <text x="230" y="135" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">4</text>

  <line x1="200" y1="48" x2="290" y2="112" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="290" cy="130" r="16" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
  <text x="290" y="135" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">5</text>

  <line x1="200" y1="48" x2="350" y2="112" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="350" cy="130" r="16" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
  <text x="350" y="135" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">6</text>
</svg>