<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="100%" height="220">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&amp;family=Noto+Sans+KR:wght@400;700&amp;display=swap');
      
      .svg-bg {
        fill: #FAFAFB;
        stroke: #E4E7EC;
        stroke-width: 2;
        rx: 16px;
      }
      
      .badge-r-bg {
        fill: #FEF3C7; /* Soft amber */
        stroke: #F59E0B;
        stroke-width: 1.5;
        rx: 8px;
      }
      
      .badge-g-bg {
        fill: #E0E7FF; /* Soft indigo */
        stroke: #6366F1;
        stroke-width: 1.5;
        rx: 8px;
      }
      
      .label-text {
        font-family: 'Noto Sans KR', sans-serif;
        font-size: 13px;
        font-weight: bold;
      }
      
      .arrow-line {
        stroke: #98A2B3;
        stroke-width: 1.5;
        stroke-dasharray: 4 4;
        fill: none;
      }
    </style>
  </defs>
  
  <rect class="svg-bg" width="620" height="220" />
  
  <!-- Title / Label -->
  <text x="30" y="35" font-family="'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#667085">식 06.6 전개 상태 지도</text>
  
  <!-- Equation Row -->
  <!-- v_π(s) = -->
  <text x="30" y="80" font-family="'Outfit', sans-serif" font-size="20" font-weight="600" fill="#1D2939">v</text>
  <text x="41" y="85" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#1D2939">π</text>
  <text x="52" y="80" font-family="'Outfit', sans-serif" font-size="20" font-weight="600" fill="#1D2939">(s) =</text>
  
  <!-- First Term Badge (R_t Expectation) -->
  <g transform="translate(110, 52)">
    <rect class="badge-r-bg" width="170" height="40" />
    <text x="15" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#B45309">E</text>
    <text x="27" y="31" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#B45309">π</text>
    <text x="37" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#B45309">[R</text>
    <text x="54" y="31" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#B45309">t</text>
    <text x="61" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#B45309"> | S</text>
    <text x="89" y="31" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#B45309">t</text>
    <text x="96" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#B45309"> = s]</text>
  </g>
  
  <!-- + -->
  <text x="292" y="80" font-family="'Outfit', sans-serif" font-size="20" font-weight="600" fill="#1D2939">+</text>
  <text x="312" y="80" font-family="'Outfit', sans-serif" font-size="20" font-weight="600" fill="#1D2939">γ</text>
  
  <!-- Second Term Badge (G_t+1 Expectation) -->
  <g transform="translate(335, 52)">
    <rect class="badge-g-bg" width="255" height="40" />
    <text x="15" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#4F46E5">E</text>
    <text x="27" y="31" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#4F46E5">π</text>
    <text x="37" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#4F46E5">[G</text>
    <text x="56" y="31" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#4F46E5">t+1</text>
    <text x="79" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#4F46E5"> | S</text>
    <text x="107" y="31" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#4F46E5">t</text>
    <text x="114" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#4F46E5"> = s]</text>
  </g>
  
  <!-- Left Arrow and Explanations -->
  <g>
    <!-- Arrow pointing down-left -->
    <path d="M 195 97 L 140 145" class="arrow-line" />
    <polygon points="140,145 148,141 144,137" fill="#98A2B3" />
    
    <text x="115" y="125" class="label-text" fill="#D97706" text-anchor="end">첫 번째 항 전개 완료! 🎯</text>
    
    <!-- Sum Formula -->
    <g transform="translate(10, 150)">
      <text x="30" y="32" font-family="'Outfit', sans-serif" font-size="34" font-weight="600" fill="#B45309">∑</text>
      <text x="24" y="44" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" fill="#B45309">a, s'</text>
      <text x="60" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#B45309">π(a|s) p(s'|s, a) r(s, a, s')</text>
    </g>
  </g>
  
  <!-- Right Arrow and Explanations -->
  <g>
    <!-- Arrow pointing down-right -->
    <path d="M 462 97 L 490 145" class="arrow-line" />
    <polygon points="490,145 486,137 482,141" fill="#98A2B3" />
    
    <text x="475" y="125" class="label-text" fill="#4F46E5" text-anchor="start">다음 단계: 두 번째 항 전개 시작 🚀</text>
    
    <!-- Right Formula -->
    <g transform="translate(385, 150)">
      <text x="10" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#4F46E5">γ E</text>
      <text x="39" y="31" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#4F46E5">π</text>
      <text x="49" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#4F46E5">[G</text>
      <text x="68" y="31" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#4F46E5">t+1</text>
      <text x="91" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#4F46E5"> | S</text>
      <text x="119" y="31" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#4F46E5">t</text>
      <text x="126" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#4F46E5"> = s]</text>
    </g>
  </g>
</svg>