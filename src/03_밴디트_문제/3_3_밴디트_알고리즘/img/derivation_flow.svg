<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="550" rx="12" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  
  <text x="400" y="35" font-family="'Noto Sans KR', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333333">증분 공식(Incremental Formula) 유도 단계</text>

  <!-- Step 1 -->
  <g transform="translate(50, 60)">
    <rect width="700" height="70" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
    <text x="20" y="40" font-family="'Noto Sans KR', sans-serif" font-size="14" font-weight="bold" fill="#e65100">1단계: 이전 시점(n-1)의 평균 정의</text>
    
    <!-- Formula: Q_{n-1} = (R_1 + ... + R_{n-1}) / (n-1) -->
    <g transform="translate(420, 15)">
      <text x="0" y="25" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#333">Q</text>
      <text x="10" y="32" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#333">n-1</text>
      <text x="40" y="25" font-family="Consolas, monospace" font-size="18" fill="#333">=</text>
      
      <!-- Fraction -->
      <g transform="translate(65, 0)">
        <text x="95" y="15" font-family="Consolas, monospace" font-size="14" text-anchor="middle" fill="#333">R₁ + R₂ + ... + R_n-1</text>
        <line x1="0" y1="21" x2="190" y2="21" stroke="#333" stroke-width="1.5"/>
        <text x="95" y="36" font-family="Consolas, monospace" font-size="14" text-anchor="middle" fill="#333">n - 1</text>
      </g>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M 400,130 L 400,150" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(50, 155)">
    <rect width="700" height="70" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
    <text x="20" y="40" font-family="'Noto Sans KR', sans-serif" font-size="14" font-weight="bold" fill="#1b5e20">2단계: 양변에 (n-1)을 곱해 과거 보상의 합 도출</text>
    
    <!-- Formula: R_1 + ... + R_{n-1} = (n-1) * Q_{n-1} -->
    <g transform="translate(390, 20)">
      <text x="0" y="20" font-family="Consolas, monospace" font-size="16" fill="#333">R₁ + R₂ + ... + R</text>
      <text x="145" y="25" font-family="Consolas, monospace" font-size="11" fill="#333">n-1</text>
      <text x="175" y="20" font-family="Consolas, monospace" font-size="16" fill="#333">=</text>
      <text x="200" y="20" font-family="Consolas, monospace" font-size="16" fill="#333">(n - 1) Q</text>
      <text x="275" y="25" font-family="Consolas, monospace" font-size="11" fill="#333">n-1</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <path d="M 400,225 L 400,245" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(50, 250)">
    <rect width="700" height="70" rx="8" fill="#e3f2fd" stroke="#0077c2" stroke-width="1.5"/>
    <text x="20" y="40" font-family="'Noto Sans KR', sans-serif" font-size="14" font-weight="bold" fill="#0d47a1">3단계: n번째 평균(Q_n) 공식에 2단계 결과 대입</text>
    
    <!-- Formula: Q_n = ((n-1)*Q_{n-1} + R_n) / n -->
    <g transform="translate(420, 15)">
      <text x="0" y="25" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#333">Q</text>
      <text x="10" y="32" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#333">n</text>
      <text x="35" y="25" font-family="Consolas, monospace" font-size="18" fill="#333">=</text>
      
      <!-- Fraction -->
      <g transform="translate(60, 0)">
        <text x="95" y="15" font-family="Consolas, monospace" font-size="14" text-anchor="middle" fill="#333">(n - 1) Q_n-1 + R_n</text>
        <line x1="0" y1="21" x2="190" y2="21" stroke="#333" stroke-width="1.5"/>
        <text x="95" y="36" font-family="Consolas, monospace" font-size="14" text-anchor="middle" fill="#333">n</text>
      </g>
    </g>
  </g>

  <!-- Arrow 3 -->
  <path d="M 400,320 L 400,340" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g transform="translate(50, 345)">
    <rect width="700" height="70" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
    <text x="20" y="40" font-family="'Noto Sans KR', sans-serif" font-size="14" font-weight="bold" fill="#880e4f">4단계: 분자를 분해하여 정리</text>
    
    <!-- Formula: Q_n = (n*Q_{n-1} - Q_{n-1} + R_n) / n -->
    <g transform="translate(420, 15)">
      <text x="0" y="25" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#333">Q</text>
      <text x="10" y="32" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#333">n</text>
      <text x="35" y="25" font-family="Consolas, monospace" font-size="18" fill="#333">=</text>
      
      <!-- Fraction -->
      <g transform="translate(60, 0)">
        <text x="95" y="15" font-family="Consolas, monospace" font-size="14" text-anchor="middle" fill="#333">n Q_n-1 - Q_n-1 + R_n</text>
        <line x1="0" y1="21" x2="190" y2="21" stroke="#333" stroke-width="1.5"/>
        <text x="95" y="36" font-family="Consolas, monospace" font-size="14" text-anchor="middle" fill="#333">n</text>
      </g>
    </g>
  </g>

  <!-- Arrow 4 -->
  <path d="M 400,415 L 400,435" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <g transform="translate(50, 440)">
    <rect width="700" height="80" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2.5"/>
    <text x="20" y="45" font-family="'Noto Sans KR', sans-serif" font-size="14" font-weight="bold" fill="#4527a0">5단계: 최종 점화식(증분 공식) 도출</text>
    
    <!-- Formula: Q_n = Q_{n-1} + (1/n) * (R_n - Q_{n-1}) -->
    <g transform="translate(360, 25)">
      <text x="0" y="25" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#4527a0">Q</text>
      <text x="10" y="32" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4527a0">n</text>
      
      <text x="35" y="25" font-family="Consolas, monospace" font-size="20" fill="#4527a0">=</text>
      
      <text x="60" y="25" font-family="Consolas, monospace" font-size="20" fill="#4527a0">Q</text>
      <text x="70" y="32" font-family="Consolas, monospace" font-size="13" fill="#4527a0">n-1</text>
      
      <text x="110" y="25" font-family="Consolas, monospace" font-size="20" fill="#4527a0">+</text>
      
      <!-- Fraction (1/n) -->
      <g transform="translate(135, 0)">
        <text x="15" y="14" font-family="Consolas, monospace" font-size="13" text-anchor="middle" fill="#4527a0">1</text>
        <line x1="0" y1="20" x2="30" y2="20" stroke="#4527a0" stroke-width="1.5"/>
        <text x="15" y="34" font-family="Consolas, monospace" font-size="13" text-anchor="middle" fill="#4527a0">n</text>
      </g>
      
      <text x="175" y="25" font-family="Consolas, monospace" font-size="20" fill="#4527a0">(</text>
      
      <text x="190" y="25" font-family="Consolas, monospace" font-size="20" fill="#4527a0">R</text>
      <text x="200" y="32" font-family="Consolas, monospace" font-size="13" fill="#4527a0">n</text>
      
      <text x="220" y="25" font-family="Consolas, monospace" font-size="20" fill="#4527a0">-</text>
      
      <text x="240" y="25" font-family="Consolas, monospace" font-size="20" fill="#4527a0">Q</text>
      <text x="250" y="32" font-family="Consolas, monospace" font-size="13" fill="#4527a0">n-1</text>
      
      <text x="285" y="25" font-family="Consolas, monospace" font-size="20" fill="#4527a0">)</text>
    </g>
  </g>

  <!-- Definition of Arrowhead Marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#757575"/>
    </marker>
  </defs>
</svg>