<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <!-- Background container -->
  <rect width="800" height="240" rx="12" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Title or description -->
  <text x="400" y="32" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">증분식(Incremental Equation)의 개념 구조</text>

  <!-- Blocks -->
  <!-- 1. 새로운 추정치 (Q_n) -->
  <rect x="35" y="60" width="140" height="80" rx="8" fill="#e3f2fd" stroke="#0077c2" stroke-width="2"/>
  <text x="105" y="92" font-family="'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">새로운 추정치</text>
  <text x="105" y="122" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="bold" text-anchor="middle" fill="#0d47a1">Q_n</text>

  <!-- Operator = -->
  <text x="195" y="108" font-family="'Inter', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#757575">=</text>

  <!-- 2. 이전 추정치 (Q_{n-1}) -->
  <rect x="210" y="60" width="120" height="80" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="270" y="92" font-family="'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">이전 추정치</text>
  <text x="270" y="122" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#e65100">Q_n-1</text>

  <!-- Operator + -->
  <text x="348" y="108" font-family="'Inter', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#757575">+</text>

  <!-- 3. 학습률 (1/n) -->
  <rect x="365" y="60" width="90" height="80" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="410" y="92" font-family="'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#880e4f">학습률</text>
  <text x="410" y="122" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#880e4f">1 / n</text>

  <!-- Operator * -->
  <text x="472" y="112" font-family="'Inter', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#757575">×</text>

  <!-- Parenthesis ( -->
  <text x="490" y="110" font-family="'Inter', sans-serif" font-size="34" font-weight="light" text-anchor="middle" fill="#9e9e9e">(</text>

  <!-- 4. 새로운 보상 (R_n) -->
  <rect x="502" y="60" width="110" height="80" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="557" y="92" font-family="'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">새로운 보상</text>
  <text x="557" y="122" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#1b5e20">R_n</text>

  <!-- Operator - -->
  <text x="627" y="108" font-family="'Inter', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#757575">-</text>

  <!-- 5. 이전 추정치 (Q_{n-1}) -->
  <rect x="642" y="60" width="110" height="80" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="697" y="92" font-family="'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">이전 추정치</text>
  <text x="697" y="122" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#e65100">Q_n-1</text>

  <!-- Parenthesis ) -->
  <text x="765" y="110" font-family="'Inter', sans-serif" font-size="34" font-weight="light" text-anchor="middle" fill="#9e9e9e">)</text>

  <!-- Bracket/Helper Lines for Prediction Error (R_n - Q_{n-1}) -->
  <path d="M 502,152 L 502,165 L 620,165 L 620,175 L 620,165 L 752,165 L 752,152" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="620" y="192" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">예측 오차 (Prediction Error)</text>
  <text x="620" y="209" font-family="'Noto Sans KR', sans-serif" font-size="10" text-anchor="middle" fill="#666666">실제 얻은 값과 예상치 사이의 오차</text>

  <!-- Help line for learning rate -->
  <line x1="410" y1="145" x2="410" y2="175" stroke="#c2185b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="410" y="192" font-family="'Noto Sans KR', sans-serif" font-size="11" text-anchor="middle" fill="#880e4f">오차를 반영할 강도</text>
</svg>
