<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <!-- Definitions for shadows and gradients -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a202c" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#fcfcfd" rx="12" />
  <rect x="2" y="2" width="676" height="176" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12" />

  <!-- Equation Flow: Q_n = Q_{n-1} + 1/n * (R_n - Q_{n-1}) -->
  
  <!-- Left Side: Result (New Average) -->
  <g transform="translate(30, 45)" filter="url(#shadow)">
    <rect width="130" height="90" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="2" />
    <text x="65" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#276749" text-anchor="middle">새로운 평균</text>
    <text x="65" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#22543d" text-anchor="middle">Q<sub>n</sub></text>
    <text x="65" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#48bb78" text-anchor="middle">(현재 단계의 예측값)</text>
  </g>

  <!-- Equal sign -->
  <text x="185" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#718096" text-anchor="middle">=</text>

  <!-- Old Average Q_{n-1} -->
  <g transform="translate(210, 45)" filter="url(#shadow)">
    <rect width="120" height="90" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2" />
    <text x="60" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#2b6cb0" text-anchor="middle">이전 평균</text>
    <text x="60" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#2b6cb0" text-anchor="middle">Q<sub>n-1</sub></text>
    <text x="60" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4299e1" text-anchor="middle">(직전 단계의 예측값)</text>
  </g>

  <!-- Plus Sign -->
  <text x="355" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#718096" text-anchor="middle">+</text>

  <!-- Learning Rate / Weight (1/n) -->
  <g transform="translate(380, 45)" filter="url(#shadow)">
    <rect width="90" height="90" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="2" />
    <text x="45" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#553c9a" text-anchor="middle">가중치</text>
    <text x="45" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#553c9a" text-anchor="middle">1 / n</text>
    <text x="45" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9f7aea" text-anchor="middle">(학습률 alpha)</text>
  </g>

  <!-- Multiply/Parenthesis Connection -->
  <text x="488" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#718096" text-anchor="middle">×</text>

  <!-- Error / Difference (R_n - Q_{n-1}) -->
  <g transform="translate(510, 45)" filter="url(#shadow)">
    <rect width="140" height="90" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" />
    <text x="70" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#9c4221" text-anchor="middle">예측 오차</text>
    <text x="70" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#dd6b20" text-anchor="middle">( R<sub>n</sub> - Q<sub>n-1</sub> )</text>
    <text x="70" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a0aec0" text-anchor="middle">실제보상 - 예상치</text>
    <text x="70" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#718096" text-anchor="middle">(신선한 변화 피드백)</text>
  </g>
</svg>
