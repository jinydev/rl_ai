<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" width="100%" height="100%">
  <defs>
    <!-- Agent Icon -->
    <g id="agent">
      <rect x="12" y="17" width="36" height="32" rx="12" ry="12" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="23" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="37" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="21" cy="28" r="3" fill="#2d3748"/>
      <circle cx="35" cy="28" r="3" fill="#2d3748"/>
      <path d="M 27 38 Q 30 41 33 38" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
      <path d="M 28 39 Q 30 44 32 39 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 16 49 C 16 47, 24 47, 24 49 C 24 51, 22 53, 19 53 C 15 53, 16 49, 16 49 Z" fill="#2d3748"/>
      <path d="M 36 49 C 36 47, 44 47, 44 49 C 44 51, 42 53, 39 53 C 35 53, 36 49, 36 49 Z" fill="#2d3748"/>
    </g>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e53e3e"/>
    </marker>
    <g id="grid_3">
      <rect x="0" y="0" width="180" height="60" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
      <line x1="60" y1="0" x2="60" y2="60" stroke="#2d3748" stroke-width="2"/>
      <line x1="120" y1="0" x2="120" y2="60" stroke="#2d3748" stroke-width="2"/>
    </g>
  </defs>

  <!-- Title -->
  <text x="190" y="35" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">확률적 전이 (Stochastic)</text>
  
  <!-- Top Grid (Current State) -->
  <g transform="translate(100, 60)">
    <use href="#grid_3"/>
    <use href="#agent" x="60" y="0"/>
    <line x1="55" y1="30" x2="20" y2="30" stroke="#e53e3e" stroke-width="3" marker-end="url(#red-arrow)"/>
  </g>

  <!-- Branch Arrows -->
  <line x1="190" y1="135" x2="100" y2="195" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="135" x2="290" y2="195" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="125" y="160" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4a5568">0.9</text>
  <text x="255" y="160" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4a5568">0.1</text>

  <!-- Bottom Left Grid (Succeed) -->
  <g transform="translate(10, 210)">
    <use href="#grid_3"/>
    <use href="#agent" x="0" y="0"/>
  </g>

  <!-- Bottom Right Grid (Fail/Stay) -->
  <g transform="translate(200, 210)">
    <use href="#grid_3"/>
    <use href="#agent" x="60" y="0"/>
  </g>
</svg>
