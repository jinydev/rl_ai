<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 30 17 C 20 12, 10 22, 15 37 C 18 47, 25 50, 30 47 C 35 50, 42 47, 45 37 C 50 22, 40 12, 30 17 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 30 17 Q 34 8 42 11" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 34 13 Q 41 9 42 16 C 39 18, 36 16, 34 13 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon -->
    <g id="agent">
      <rect x="12" y="17" width="36" height="32" rx="12" ry="12" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="23" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="37" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="21" cy="28" r="3" fill="#2d3748"/>
      <circle cx="35" cy="28" r="3" fill="#2d3748"/>
      <path d="M 27 38 Q 30 41 33 38" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
      <path d="M 28 39 Q 30 44 32 39 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 16 49 C 16 47, 24 47, 24 49 C 24 51, 22 53, 19 53 C 15 53, 16 49, 16 49 Z" fill="#2d3748"/>
      <path d="M 36 49 C 36 47, 44 47, 44 49 C 44 51, 42 53, 39 53 C 35 53, 36 49, 36 49 Z" fill="#2d3748"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
  </defs>
  <!-- Vertical Axis -->
  <line x1="80" y1="300" x2="80" y2="40" stroke="#2d3748" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text x="65" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748">Value</text>

  <!-- Horizontal Axis -->
  <line x1="80" y1="300" x2="550" y2="300" stroke="#2d3748" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text x="560" y="305" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748">State</text>

  <!-- Horizontal Ticks & Labels (L1-L5) -->
  <line x1="140" y1="300" x2="140" y2="305" stroke="#2d3748" stroke-width="1.5"/>
  <text x="140" y="325" font-family="sans-serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="middle">L1</text>
  
  <line x1="230" y1="300" x2="230" y2="305" stroke="#2d3748" stroke-width="1.5"/>
  <text x="230" y="325" font-family="sans-serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="middle">L2</text>
  
  <line x1="320" y1="300" x2="320" y2="305" stroke="#2d3748" stroke-width="1.5"/>
  <text x="320" y="325" font-family="sans-serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="middle">L3</text>
  
  <line x1="410" y1="300" x2="410" y2="305" stroke="#2d3748" stroke-width="1.5"/>
  <text x="410" y="325" font-family="sans-serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="middle">L4</text>
  
  <line x1="500" y1="300" x2="500" y2="305" stroke="#2d3748" stroke-width="1.5"/>
  <text x="500" y="325" font-family="sans-serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="middle">L5</text>

  <!-- Curves -->
  <!-- pi_* (orange) -->
  <path d="M 140 110 L 230 80 L 320 90 L 410 85 L 500 60" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <!-- pi_1 (blue) -->
  <path d="M 140 240 L 230 110 L 320 180 L 410 220 L 500 190" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- pi_2 (green) -->
  <path d="M 140 200 L 230 170 L 320 125 L 410 170 L 500 220" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <!-- pi_3 (red) -->
  <path d="M 140 165 L 230 200 L 320 85 L 410 170 L 500 90" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <!-- pi_4 (purple) -->
  <path d="M 140 160 L 230 90 L 320 90 L 410 130 L 500 165" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ticks points -->
  <circle cx="140" cy="110" r="3.5" fill="#f59e0b"/>
  <circle cx="230" cy="80" r="3.5" fill="#f59e0b"/>
  <circle cx="320" cy="90" r="3.5" fill="#f59e0b"/>
  <circle cx="410" cy="85" r="3.5" fill="#f59e0b"/>
  <circle cx="500" cy="60" r="3.5" fill="#f59e0b"/>

  <circle cx="500" cy="190" r="3" fill="#3b82f6"/>
  <circle cx="500" cy="220" r="3" fill="#10b981"/>
  <circle cx="500" cy="90" r="3" fill="#ef4444"/>
  <circle cx="500" cy="165" r="3" fill="#8b5cf6"/>

  <!-- Labels -->
  <text x="515" y="195" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#3b82f6">π1</text>
  <text x="515" y="225" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#10b981">π2</text>
  <text x="515" y="95" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#ef4444">π3</text>
  <text x="515" y="170" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#8b5cf6">π4</text>
  
  <!-- Optimal policy arrow -->
  <path d="M 430 40 Q 450 35 480 50" fill="none" stroke="#2d3748" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="420" y="42" font-family="Georgia, serif" font-size="15" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="end">π*</text>
</svg>