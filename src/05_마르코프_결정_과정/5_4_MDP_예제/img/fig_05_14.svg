<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 30 17 C 20 12, 10 22, 15 37 C 18 47, 25 50, 30 47 C 35 50, 42 47, 45 37 C 50 22, 40 12, 30 17 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 30 17 Q 34 8 42 11" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 34 13 Q 41 9 42 16 C 39 18, 36 16, 34 13 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon -->
    <g id="agent">
      <rect x="12" y="17" width="36" height="32" rx="12" ry="12" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="23" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="37" cy="28" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="21" cy="28" r="3" fill="#2d3748"/>
      <circle cx="35" cy="28" r="3" fill="#2d3748"/>
      <path d="M 27 38 Q 30 41 33 38" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
      <path d="M 28 39 Q 30 44 32 39 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 16 49 C 16 47, 24 47, 24 49 C 24 51, 22 53, 19 53 C 15 53, 16 49, 16 49 Z" fill="#2d3748"/>
      <path d="M 36 49 C 36 47, 44 47, 44 49 C 44 51, 42 53, 39 53 C 35 53, 36 49, 36 49 Z" fill="#2d3748"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
  </defs>
  <!-- State Node L1 -->
  <circle cx="150" cy="40" r="18" fill="#ffffff" stroke="#2d3748" stroke-width="2.5"/>
  <text x="150" y="44" font-family="sans-serif" font-size="13" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">L1</text>

  <!-- Action Node Right -->
  <line x1="150" y1="58" x2="150" y2="82" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="150" cy="90" r="6" fill="#2d3748"/>
  <text x="170" y="94" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748">Right</text>

  <!-- State Node L2 -->
  <line x1="150" y1="96" x2="150" y2="142" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="135" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="end">(보상) +1</text>
  <circle cx="150" cy="160" r="18" fill="#ffffff" stroke="#2d3748" stroke-width="2.5"/>
  <text x="150" y="164" font-family="sans-serif" font-size="13" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">L2</text>

  <!-- Action Node Right -->
  <line x1="150" y1="178" x2="150" y2="202" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="150" cy="210" r="6" fill="#2d3748"/>
  <text x="170" y="214" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748">Right</text>

  <!-- State Node L2 -->
  <line x1="150" y1="216" x2="150" y2="262" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="135" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="end">-1</text>
  <circle cx="150" cy="280" r="18" fill="#ffffff" stroke="#2d3748" stroke-width="2.5"/>
  <text x="150" y="284" font-family="sans-serif" font-size="13" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">L2</text>

  <!-- Action Node Right -->
  <line x1="150" y1="298" x2="150" y2="322" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="150" cy="330" r="6" fill="#2d3748"/>
  <text x="170" y="334" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748">Right</text>

  <!-- Dashed line at bottom -->
  <line x1="150" y1="336" x2="150" y2="382" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="135" y="365" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="end">-1</text>
  <line x1="150" y1="384" x2="150" y2="405" stroke="#2d3748" stroke-width="1.5" stroke-dasharray="4,4"/>
</svg>