<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .box-h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; }
      .eq-txt { font-family: "Cambria Math", "Latin Modern Math", serif; font-size: 17px; font-weight: 700; }
    </style>
    <marker id="arr-tgt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <filter id="mctd-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">가치 함수 갱신 방식 비교: 몬테카를로법 vs TD법</text>
  <text x="380" y="62" class="desc" text-anchor="middle">행위자-비평자는 TD법을 도입하여 에피소드가 끝나지 않아도 매 스텝마다 실시간 갱신</text>

  <g transform="translate(60, 95)" filter="url(#mctd-sh)">
    <!-- 1. Monte Carlo Method -->
    <rect x="0" y="0" width="300" height="180" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="25" y="35" class="box-h" fill="#1d4ed8">몬테카를로법 (MC)</text>
    <text x="25" y="70" class="desc">갱신 목표: 실제 에피소드 총 수익</text>
    <rect x="25" y="85" width="250" height="40" rx="8" fill="#dbeafe"/>
    <text x="150" y="110" class="eq-txt" fill="#1d4ed8" text-anchor="middle">V_w(S_t) → G_t</text>
    <text x="25" y="150" class="desc" fill="#dc2626">한계: 에피소드 종료까지 대기 필수</text>

    <!-- 2. TD Method -->
    <rect x="340" y="0" width="300" height="180" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="365" y="35" class="box-h" fill="#047857">시간차법 (TD법, Actor-Critic)</text>
    <text x="365" y="70" class="desc">갱신 목표: 1스텝 보상 + 다음 상태 가치</text>
    <rect x="365" y="85" width="250" height="40" rx="8" fill="#d1fae5"/>
    <text x="490" y="110" class="eq-txt" fill="#047857" text-anchor="middle">V_w(S_t) → R_t + γ V_w(S_t+1)</text>
    <text x="365" y="150" class="desc" font-weight="700" fill="#059669">장점: 매 타임스텝 실시간 온라인 학습</text>
  </g>
</svg>