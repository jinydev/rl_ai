<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .td { font-family: "SF Mono", Menlo, monospace; font-size: 14px; font-weight: 600; text-anchor: middle; }
    </style>
    <filter id="tbl-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="300" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">베이스라인(평균 예측값) 차감을 통한 분산 감소 효과</text>
  <text x="380" y="62" class="desc" text-anchor="middle">실제 결과값에서 기준값(베이스라인)을 빼주면 평균이 0 주위로 집중되어 분산이 감소</text>

  <g transform="translate(80, 90)" filter="url(#tbl-sh)">
    <rect width="600" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Table Header -->
    <rect x="0" y="0" width="600" height="40" rx="10" fill="#e2e8f0"/>
    <text x="100" y="25" class="th">학생 / 상태</text>
    <text x="250" y="25" class="th">실제 결과 (G_t)</text>
    <text x="400" y="25" class="th">예측 평균 b(s)</text>
    <text x="520" y="25" class="th" fill="#047857">차이 (G_t - b)</text>

    <!-- Row A -->
    <line x1="0" y1="40" x2="600" y2="40" stroke="#cbd5e1"/>
    <text x="100" y="66" class="td">학생 A</text>
    <text x="250" y="66" class="td">90 점</text>
    <text x="400" y="66" class="td">82 점</text>
    <text x="520" y="66" class="td" fill="#059669">+8 (기대 이상)</text>

    <!-- Row B -->
    <line x1="0" y1="75" x2="600" y2="75" stroke="#cbd5e1"/>
    <text x="100" y="101" class="td">학생 B</text>
    <text x="250" y="101" class="td">40 점</text>
    <text x="400" y="101" class="td">46 점</text>
    <text x="520" y="101" class="td" fill="#dc2626">-6 (기대 이하)</text>

    <!-- Row C -->
    <line x1="0" y1="110" x2="600" y2="110" stroke="#cbd5e1"/>
    <text x="100" y="136" class="td">학생 C</text>
    <text x="250" y="136" class="td">50 점</text>
    <text x="400" y="136" class="td">49 점</text>
    <text x="520" y="136" class="td" fill="#059669">+1 (평균 수준)</text>
  </g>

  <text x="380" y="275" class="desc" text-anchor="middle" font-weight="600" fill="#334155">베이스라인 b(s)는 정책 경사의 기댓값(편향)을 바꾸지 않으면서 분산(Variance)만 대폭 줄여줍니다.</text>
</svg>