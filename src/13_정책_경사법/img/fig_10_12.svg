<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .label-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; }
      .math-txt { font-family: "Cambria Math", "Latin Modern Math", serif; font-size: 16px; font-weight: 700; }
    </style>
    <marker id="arr-torque" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <filter id="pen-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="380" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">연속적인 행동 공간 과제: OpenAI Gym &lt;Pendulum-v0&gt;</text>
  <text x="380" y="62" class="desc" text-anchor="middle">행동이 이산적이지 않고 연속적인 실수 토크 [-2.0, 2.0] 로 주어지는 물리 제어 환경</text>

  <g transform="translate(60, 90)">
    <!-- Pendulum Sim View -->
    <g transform="translate(40, 20)" filter="url(#pen-sh)">
      <rect width="280" height="220" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Center Fixed Pivot -->
      <circle cx="140" cy="110" r="14" fill="#334155"/>
      <circle cx="140" cy="110" r="6" fill="#94a3b8"/>

      <!-- Rotating Pendulum Rod -->
      <g transform="rotate(-30, 140, 110)">
        <rect x="134" y="20" width="12" height="90" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
        <circle cx="140" cy="20" r="12" fill="#ef4444"/>
      </g>

      <!-- Continuous Torque Arrow -->
      <path d="M 175 110 A 35 35 0 0 1 140 145" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arr-torque)"/>
      <text x="180" y="150" class="desc" font-weight="700" fill="#b45309">회전력 (토크 u)</text>
    </g>

    <!-- Right: Continuous Policy Explanation -->
    <g transform="translate(380, 20)" filter="url(#pen-sh)">
      <rect width="280" height="220" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
      <text x="140" y="30" class="label-txt" fill="#047857" text-anchor="middle">가우시안 정책 (Gaussian Policy)</text>

      <g transform="translate(20, 50)">
        <text x="0" y="20" class="desc">• 연속 행동 공간에서는 Q 함수</text>
        <text x="0" y="40" class="desc">  max_a Q(s, a) 계산이 어려움</text>
        
        <text x="0" y="70" class="desc">• 정책 기반 기법은 신경망이</text>
        <text x="0" y="90" class="desc">  평균 μ(s)과 표준편차 σ(s)를 출력</text>
        
        <rect x="0" y="110" width="240" height="40" rx="6" fill="#ecfdf5" stroke="#10b981"/>
        <text x="120" y="135" class="math-txt" fill="#047857" text-anchor="middle">a ~ N(μ(s), σ²(s))</text>
      </g>
    </g>
  </g>

  <text x="380" y="355" class="desc" text-anchor="middle" font-weight="600" fill="#334155">정책 경사법은 복잡한 양자화 없이도 연속 행동 제어를 자연스럽고 부드럽게 학습할 수 있는 결정적 강점이 있습니다.</text>
</svg>