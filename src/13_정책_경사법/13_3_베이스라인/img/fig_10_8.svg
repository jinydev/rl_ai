<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 13px; fill: #64748b; }
      .callout { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size: 14px; font-weight: 700; }
    </style>
    <filter id="fall-sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="360" fill="#ffffff" rx="16"/>

  <text x="380" y="38" class="title" text-anchor="middle">막대가 균형을 완전히 잃은 상태와 베이스라인의 필요성</text>
  <text x="380" y="62" class="desc" text-anchor="middle">종료 직전 3단계 동안 어떤 행동을 해도 보상 G_t = 3 이 나오는 상황</text>

  <g transform="translate(60, 85)" filter="url(#fall-sh)">
    <!-- Simulation box -->
    <rect width="320" height="200" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="20" y1="160" x2="300" y2="160" stroke="#94a3b8" stroke-width="3"/>

    <!-- Tilted cart & fallen pole -->
    <rect x="70" y="125" width="80" height="35" rx="6" fill="#1e293b"/>
    <circle cx="85" cy="160" r="7" fill="#475569"/>
    <circle cx="135" cy="160" r="7" fill="#475569"/>

    <circle cx="110" cy="125" r="5" fill="#f59e0b"/>
    <g transform="rotate(40, 110, 125)">
      <rect x="106" y="35" width="8" height="90" rx="4" fill="#ef4444"/>
    </g>

    <text x="160" y="190" class="desc" text-anchor="middle" font-weight="700" fill="#dc2626">3스텝 후 전도 확정 (G_t = 3)</text>

    <!-- Right Comparison Card -->
    <g transform="translate(360, 0)">
      <rect width="280" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      
      <!-- Without Baseline -->
      <rect x="15" y="15" width="250" height="75" rx="6" fill="#fee2e2"/>
      <text x="30" y="38" class="callout" fill="#b91c1c">베이스라인 없음:</text>
      <text x="30" y="60" class="desc" fill="#991b1b">G_t = +3 &gt; 0 이므로</text>
      <text x="30" y="78" class="desc" font-weight="700" fill="#b91c1c">이 실패 행동의 확률을 잘못 증가시킴!</text>

      <!-- With Baseline -->
      <rect x="15" y="105" width="250" height="80" rx="6" fill="#dcfce7"/>
      <text x="30" y="128" class="callout" fill="#15803d">베이스라인 적용 (b = 3):</text>
      <text x="30" y="150" class="desc" fill="#166534">G_t - b(s) = 3 - 3 = 0</text>
      <text x="30" y="168" class="desc" font-weight="700" fill="#15803d">잘못된 확률 상승을 정확히 방지!</text>
    </g>
  </g>

  <text x="380" y="325" class="desc" text-anchor="middle" font-weight="600" fill="#334155">베이스라인으로 상태 가치 V(s)를 사용하면 행동의 순수한 우수성(어드밴티지)만 학습에 반영됩니다.</text>
</svg>