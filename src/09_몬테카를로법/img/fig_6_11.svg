<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Axis Arrow Marker -->
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 40 22 C 26 15, 12 30, 20 50 C 24 64, 34 68, 40 64 C 46 68, 56 64, 60 50 C 68 30, 54 15, 40 22 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 40 22 Q 45 10 56 14" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 45 17 Q 55 12 56 22 C 52 24, 48 22, 45 17 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    <!-- Bomb Icon -->
    <g id="bomb">
      <circle cx="40" cy="45" r="20" fill="#2d3748" stroke="#1a202c" stroke-width="2.5"/>
      <path d="M 50 29 Q 58 18 62 20" fill="none" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
      <path d="M 62 20 L 66 16 L 62 12 L 59 16 Z" fill="#f59e0b"/>
      <path d="M 58 12 L 64 6 M 70 14 L 76 12 M 64 22 L 70 26" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Mini Agent (for grid cell) -->
    <g id="mini-agent-grid">
      <rect x="5" y="10" width="30" height="26" rx="9" ry="9" fill="#a0ecff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="13" cy="18" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="27" cy="18" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="12" cy="18" r="2" fill="#2d3748"/>
      <circle cx="26" cy="18" r="2" fill="#2d3748"/>
      <path d="M 17 26 Q 20 29 23 26" fill="none" stroke="#2d3748" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 18 27 Q 20 31 22 27 Z" fill="#ff7070" stroke="#2d3748" stroke-width="0.8"/>
      <path d="M 8 36 C 8 35, 14 35, 14 36 C 14 37, 12 38, 10 38 C 7 38, 8 36, 8 36 Z" fill="#2d3748"/>
      <path d="M 26 36 C 26 35, 32 35, 32 36 C 32 37, 30 38, 28 38 C 25 38, 26 36, 26 36 Z" fill="#2d3748"/>
    </g>
  </defs>
  <!-- Agent Box -->
  <rect x="210" y="20" width="130" height="45" rx="5" ry="5" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
  <text x="275" y="47" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">에이전트</text>

  <!-- Environment Box -->
  <rect x="210" y="140" width="130" height="45" rx="5" ry="5" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
  <text x="275" y="167" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">환경</text>

  <!-- Reward Arrow (Up in center) -->
  <line x1="275" y1="140" x2="275" y2="73" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="100" font-family="sans-serif" font-size="12" fill="#2d3748" text-anchor="end">보상</text>
  <text x="260" y="120" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="end">R<tspan font-size="10" dy="4">t</tspan></text>
  
  <rect x="140" y="94" width="70" height="24" rx="10" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1"/>
  <text x="175" y="110" font-family="monospace" font-size="12" fill="#1e3a8a" text-anchor="middle">reward</text>

  <!-- Action Arrow (Right and down) -->
  <path d="M 340 42 L 390 42 L 390 162 L 348 162" fill="none" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="402" y="100" font-family="sans-serif" font-size="12" fill="#2d3748">행동</text>
  <text x="402" y="120" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2d3748">A<tspan font-size="10" dy="4">t</tspan></text>

  <rect x="440" y="94" width="70" height="24" rx="10" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1"/>
  <text x="475" y="110" font-family="monospace" font-size="12" fill="#1e3a8a" text-anchor="middle">action</text>

  <!-- State Arrow (Left and up) -->
  <path d="M 210 162 L 120 162 L 120 42 L 202 42" fill="none" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="150" x2="120" y2="175" stroke="#2d3748" stroke-dasharray="2,2" stroke-width="1.5"/>
  
  <!-- Labels on vertical left segment -->
  <text x="105" y="100" font-family="sans-serif" font-size="12" fill="#2d3748" text-anchor="end">상태</text>
  <text x="105" y="120" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2d3748" text-anchor="end">S<tspan font-size="10" dy="4">t</tspan></text>

  <rect x="15" y="94" width="60" height="24" rx="10" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1"/>
  <text x="45" y="110" font-family="monospace" font-size="12" fill="#1e3a8a" text-anchor="middle">state</text>

  <!-- Labels under dashed line next_state -->
  <text x="135" y="192" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2d3748">S<tspan font-size="10" dy="4">t+1</tspan></text>
  
  <rect x="90" y="208" width="90" height="24" rx="10" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1"/>
  <text x="135" y="224" font-family="monospace" font-size="12" fill="#1e3a8a" text-anchor="middle">next_state</text>
</svg>