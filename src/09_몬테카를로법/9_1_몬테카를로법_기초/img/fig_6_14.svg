<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Axis Arrow Marker -->
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 40 22 C 26 15, 12 30, 20 50 C 24 64, 34 68, 40 64 C 46 68, 56 64, 60 50 C 68 30, 54 15, 40 22 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 40 22 Q 45 10 56 14" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 45 17 Q 55 12 56 22 C 52 24, 48 22, 45 17 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    <!-- Bomb Icon -->
    <g id="bomb">
      <circle cx="40" cy="45" r="20" fill="#2d3748" stroke="#1a202c" stroke-width="2.5"/>
      <path d="M 50 29 Q 58 18 62 20" fill="none" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
      <path d="M 62 20 L 66 16 L 62 12 L 59 16 Z" fill="#f59e0b"/>
      <path d="M 58 12 L 64 6 M 70 14 L 76 12 M 64 22 L 70 26" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Mini Agent (for grid cell) -->
    <g id="mini-agent-grid">
      <rect x="5" y="10" width="30" height="26" rx="9" ry="9" fill="#a0ecff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="13" cy="18" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="27" cy="18" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="12" cy="18" r="2" fill="#2d3748"/>
      <circle cx="26" cy="18" r="2" fill="#2d3748"/>
      <path d="M 17 26 Q 20 29 23 26" fill="none" stroke="#2d3748" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 18 27 Q 20 31 22 27 Z" fill="#ff7070" stroke="#2d3748" stroke-width="0.8"/>
      <path d="M 8 36 C 8 35, 14 35, 14 36 C 14 37, 12 38, 10 38 C 7 38, 8 36, 8 36 Z" fill="#2d3748"/>
      <path d="M 26 36 C 26 35, 32 35, 32 36 C 32 37, 30 38, 28 38 C 25 38, 26 36, 26 36 Z" fill="#2d3748"/>
    </g>
  </defs>
  <g transform="translate(10, 20)">
    <!-- Obstacle Cell (1,1) -->
    <rect x="80" y="80" width="80" height="80" fill="#2d3748"/>

    <!-- Grid borders -->
    <rect x="0" y="0" width="320" height="240" fill="none" stroke="#2d3748" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="240" stroke="#cbd5e0" stroke-width="1.2"/>
    <line x1="160" y1="0" x2="160" y2="240" stroke="#cbd5e0" stroke-width="1.2"/>
    <line x1="240" y1="0" x2="240" y2="240" stroke="#cbd5e0" stroke-width="1.2"/>
    
    <line x1="0" y1="80" x2="320" y2="80" stroke="#cbd5e0" stroke-width="1.2"/>
    <line x1="0" y1="160" x2="320" y2="160" stroke="#cbd5e0" stroke-width="1.2"/>

    <!-- Non-agent cells with center arrows -->
    <!-- (1,2) Up arrow -->
    <line x1="200" y1="135" x2="200" y2="105" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <!-- (1,3) Bomb + Up arrow -->
    <use href="#bomb" x="240" y="80"/>
    <line x1="220" y1="135" x2="220" y2="105" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    
    <!-- (2,1) Left arrow -->
    <line x1="135" y1="200" x2="105" y2="200" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <!-- (2,2) Up arrow -->
    <line x1="200" y1="215" x2="200" y2="185" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <!-- (2,3) Left arrow -->
    <line x1="295" y1="200" x2="265" y2="200" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>

    <!-- Agent along the path cells -->
    <!-- (2,0): Agent + Up arrow -->
    <use href="#mini-agent-grid" x="5" y="180"/>
    <line x1="65" y1="215" x2="65" y2="185" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>

    <!-- (1,0): Agent + Up arrow -->
    <use href="#mini-agent-grid" x="5" y="100"/>
    <line x1="65" y1="135" x2="65" y2="105" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>

    <!-- (0,0): Agent + Right arrow -->
    <use href="#mini-agent-grid" x="5" y="20"/>
    <line x1="50" y1="40" x2="80" y2="40" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>

    <!-- (0,1): Agent + Right arrow -->
    <use href="#mini-agent-grid" x="85" y="20"/>
    <line x1="130" y1="40" x2="160" y2="40" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>

    <!-- (0,2): Agent + Right arrow -->
    <use href="#mini-agent-grid" x="165" y="20"/>
    <line x1="210" y1="40" x2="240" y2="40" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>

    <!-- Goal Apple -->
    <use href="#apple" x="240" y="0"/>
  </g>
</svg>