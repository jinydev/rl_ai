<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    
    <!-- White Die (1) -->
    <g id="die1">
      <rect x="0" y="0" width="30" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="15" cy="15" r="3.5" fill="#ef4444"/> <!-- Red dot for 1 -->
    </g>

    <!-- White Die (3) -->
    <g id="die3">
      <rect x="0" y="0" width="30" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="7" cy="7" r="2.5" fill="#2d3748"/>
      <circle cx="15" cy="15" r="2.5" fill="#2d3748"/>
      <circle cx="23" cy="23" r="2.5" fill="#2d3748"/>
    </g>

    <!-- White Die (5) -->
    <g id="die5">
      <rect x="0" y="0" width="30" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="7" cy="7" r="2.5" fill="#2d3748"/>
      <circle cx="23" cy="7" r="2.5" fill="#2d3748"/>
      <circle cx="15" cy="15" r="2.5" fill="#2d3748"/>
      <circle cx="7" cy="23" r="2.5" fill="#2d3748"/>
      <circle cx="23" cy="23" r="2.5" fill="#2d3748"/>
    </g>
    
    <!-- Cartoon Agent Icon -->
    <g id="mini-agent">
      <rect x="0" y="0" width="28" height="24" rx="8" ry="8" fill="#a0ecff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="8" cy="8" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="20" cy="8" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="7" cy="8" r="2" fill="#2d3748"/>
      <circle cx="19" cy="8" r="2" fill="#2d3748"/>
      <path d="M 11 16 Q 14 19 17 16" fill="none" stroke="#2d3748" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 4 24 C 4 23, 8 23, 8 24 C 8 25, 7 26, 5 26 C 2 26, 4 24, 4 24 Z" fill="#2d3748"/>
      <path d="M 20 24 C 20 23, 24 23, 24 24 C 24 25, 23 26, 21 26 C 18 26, 20 24, 20 24 Z" fill="#2d3748"/>
    </g>
  </defs>
  <!-- Left Column: 분포 모델 -->
  <g transform="translate(10, 10)">
    <!-- Cyan label -->
    <rect x="30" y="20" width="160" height="50" rx="14" ry="14" fill="#c7f5ff" stroke="#2d3748" stroke-width="1.8"/>
    <text x="110" y="52" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2d3748" text-anchor="middle">분포 모델</text>

    <!-- Table Container -->
    <rect x="10" y="105" width="200" height="75" rx="8" ry="8" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
    <path d="M 110 105 L 105 85 L 115 85 Z" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
    <line x1="105" y1="85" x2="115" y2="85" stroke="#ffffff" stroke-width="2"/> <!-- clean boundary -->

    <!-- Small Table inside -->
    <g transform="translate(20, 115)" font-family="sans-serif" font-size="10" fill="#2d3748">
      <!-- Grid lines -->
      <line x1="0" y1="25" x2="180" y2="25" stroke="#cbd5e0" stroke-width="1"/>
      <line x1="75" y1="0" x2="75" y2="50" stroke="#cbd5e0" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="50" stroke="#cbd5e0" stroke-width="1"/>
      <line x1="125" y1="0" x2="125" y2="50" stroke="#cbd5e0" stroke-width="1"/>
      <line x1="155" y1="0" x2="155" y2="50" stroke="#cbd5e0" stroke-width="1"/>

      <text x="37" y="16" text-anchor="middle">주사위 눈의 합</text>
      <text x="87" y="16" text-anchor="middle">2</text>
      <text x="112" y="16" text-anchor="middle">3</text>
      <text x="140" y="16" text-anchor="middle">...</text>
      <text x="167" y="16" text-anchor="middle">12</text>

      <text x="37" y="41" text-anchor="middle">확률</text>
      <text x="87" y="41" text-anchor="middle">1/36</text>
      <text x="112" y="41" text-anchor="middle">2/36</text>
      <text x="140" y="41" text-anchor="middle">...</text>
      <text x="167" y="41" text-anchor="middle">1/36</text>
    </g>
  </g>

  <!-- Right Column: 샘플 모델 -->
  <g transform="translate(300, 10)">
    <!-- Orange label -->
    <rect x="30" y="20" width="160" height="50" rx="14" ry="14" fill="#f59e0b" stroke="#2d3748" stroke-width="1.8"/>
    <text x="110" y="52" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">샘플 모델</text>

    <!-- Branching lines -->
    <line x1="110" y1="80" x2="50" y2="185" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="110" y1="80" x2="170" y2="185" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="110" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">샘플링</text>

    <!-- Left Sampled Dice (1 and 5) -->
    <use href="#die1" x="20" y="195"/>
    <use href="#die5" x="55" y="195"/>
    <text x="52" y="250" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2d3748" text-anchor="middle">6</text>

    <!-- Right Sampled Dice (3 and 1) -->
    <use href="#die3" x="140" y="195"/>
    <use href="#die1" x="175" y="195"/>
    <text x="172" y="250" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2d3748" text-anchor="middle">4</text>
  </g>
</svg>