<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    
    <!-- White Die (1) -->
    <g id="die1">
      <rect x="0" y="0" width="30" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="15" cy="15" r="3.5" fill="#ef4444"/> <!-- Red dot for 1 -->
    </g>

    <!-- White Die (3) -->
    <g id="die3">
      <rect x="0" y="0" width="30" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="7" cy="7" r="2.5" fill="#2d3748"/>
      <circle cx="15" cy="15" r="2.5" fill="#2d3748"/>
      <circle cx="23" cy="23" r="2.5" fill="#2d3748"/>
    </g>

    <!-- White Die (5) -->
    <g id="die5">
      <rect x="0" y="0" width="30" height="30" rx="5" ry="5" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="7" cy="7" r="2.5" fill="#2d3748"/>
      <circle cx="23" cy="7" r="2.5" fill="#2d3748"/>
      <circle cx="15" cy="15" r="2.5" fill="#2d3748"/>
      <circle cx="7" cy="23" r="2.5" fill="#2d3748"/>
      <circle cx="23" cy="23" r="2.5" fill="#2d3748"/>
    </g>
    
    <!-- Cartoon Agent Icon -->
    <g id="mini-agent">
      <rect x="0" y="0" width="28" height="24" rx="8" ry="8" fill="#a0ecff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="8" cy="8" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="20" cy="8" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="7" cy="8" r="2" fill="#2d3748"/>
      <circle cx="19" cy="8" r="2" fill="#2d3748"/>
      <path d="M 11 16 Q 14 19 17 16" fill="none" stroke="#2d3748" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 4 24 C 4 23, 8 23, 8 24 C 8 25, 7 26, 5 26 C 2 26, 4 24, 4 24 Z" fill="#2d3748"/>
      <path d="M 20 24 C 20 23, 24 23, 24 24 C 24 25, 23 26, 21 26 C 18 26, 20 24, 20 24 Z" fill="#2d3748"/>
    </g>
  </defs>
  <g font-family="Cambria Math, Georgia, serif" fill="#2d3748">
    <!-- Row 1: 일반적인 방식 -->
    <text x="20" y="55" font-family="sans-serif" font-size="15" font-weight="bold">〈일반적인 방식〉</text>
    <text x="160" y="52" font-size="18">
      V<tspan font-size="12" dy="5">n</tspan><tspan font-size="18" dy="-5"> = </tspan>
    </text>
    <!-- Fraction structure -->
    <line x1="200" y1="44" x2="350" y2="44" stroke="#2d3748" stroke-width="1.5"/>
    <text x="275" y="35" font-size="17" text-anchor="middle">s<tspan font-size="11" dy="3">1</tspan><tspan font-size="17" dy="-3"> + s</tspan><tspan font-size="11" dy="3">2</tspan><tspan font-size="17" dy="-3"> + ··· + s</tspan><tspan font-size="11" dy="3">n</tspan></text>
    <text x="275" y="65" font-size="17" text-anchor="middle">n</text>

    <!-- Row 2: 증분 방식 -->
    <text x="20" y="145" font-family="sans-serif" font-size="15" font-weight="bold">〈증분 방식〉</text>
    <text x="160" y="142" font-size="18">
      V<tspan font-size="12" dy="5">n</tspan><tspan font-size="18" dy="-5"> = V</tspan><tspan font-size="12" dy="5">n-1</tspan><tspan font-size="18" dy="-5"> + </tspan>
      <tspan font-size="20">1</tspan>/<tspan font-size="15">n</tspan> (s<tspan font-size="12" dy="5">n</tspan><tspan font-size="18" dy="-5"> - V</tspan><tspan font-size="12" dy="5">n-1</tspan><tspan font-size="18" dy="-5">)</tspan>
    </text>
  </g>
</svg>