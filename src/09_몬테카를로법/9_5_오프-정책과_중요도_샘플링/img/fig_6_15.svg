<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Axis Arrow Marker -->
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 40 22 C 26 15, 12 30, 20 50 C 24 64, 34 68, 40 64 C 46 68, 56 64, 60 50 C 68 30, 54 15, 40 22 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 40 22 Q 45 10 56 14" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 45 17 Q 55 12 56 22 C 52 24, 48 22, 45 17 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    <!-- Bomb Icon -->
    <g id="bomb">
      <circle cx="40" cy="45" r="20" fill="#2d3748" stroke="#1a202c" stroke-width="2.5"/>
      <path d="M 50 29 Q 58 18 62 20" fill="none" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
      <path d="M 62 20 L 66 16 L 62 12 L 59 16 Z" fill="#f59e0b"/>
      <path d="M 58 12 L 64 6 M 70 14 L 76 12 M 64 22 L 70 26" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Mini Agent (for grid cell) -->
    <g id="mini-agent-grid">
      <rect x="5" y="10" width="30" height="26" rx="9" ry="9" fill="#a0ecff" stroke="#2d3748" stroke-width="1.8"/>
      <circle cx="13" cy="18" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="27" cy="18" r="4.5" fill="#ffffff" stroke="#2d3748" stroke-width="1"/>
      <circle cx="12" cy="18" r="2" fill="#2d3748"/>
      <circle cx="26" cy="18" r="2" fill="#2d3748"/>
      <path d="M 17 26 Q 20 29 23 26" fill="none" stroke="#2d3748" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 18 27 Q 20 31 22 27 Z" fill="#ff7070" stroke="#2d3748" stroke-width="0.8"/>
      <path d="M 8 36 C 8 35, 14 35, 14 36 C 14 37, 12 38, 10 38 C 7 38, 8 36, 8 36 Z" fill="#2d3748"/>
      <path d="M 26 36 C 26 35, 32 35, 32 36 C 32 37, 30 38, 28 38 C 25 38, 26 36, 26 36 Z" fill="#2d3748"/>
    </g>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Y-axis -->
    <line x1="40" y1="200" x2="40" y2="20" stroke="#2d3748" stroke-width="1.8" marker-end="url(#axis-arrow)"/>
    <text x="30" y="20" font-family="sans-serif" font-size="13" fill="#2d3748" text-anchor="end">확률</text>

    <!-- X-axis -->
    <line x1="40" y1="200" x2="290" y2="200" stroke="#2d3748" stroke-width="1.8" marker-end="url(#axis-arrow)"/>

    <!-- Bars (0, 1, 2, 3) -->
    <!-- Action 0 (height = 40) -->
    <rect x="75" y="160" width="12" height="40" fill="#00bfff"/>
    <!-- Action 1 (height = 140) -->
    <rect x="125" y="60" width="12" height="140" fill="#00bfff"/>
    <!-- Action 2 (height = 40) -->
    <rect x="175" y="160" width="12" height="40" fill="#00bfff"/>
    <!-- Action 3 (height = 40) -->
    <rect x="225" y="160" width="12" height="40" fill="#00bfff"/>

    <!-- Labels on X-axis -->
    <text x="81" y="220" font-family="Georgia, serif" font-size="15" fill="#2d3748" text-anchor="middle">0</text>
    <text x="131" y="220" font-family="Georgia, serif" font-size="15" fill="#2d3748" text-anchor="middle">1</text>
    <text x="181" y="220" font-family="Georgia, serif" font-size="15" fill="#2d3748" text-anchor="middle">2</text>
    <text x="231" y="220" font-family="Georgia, serif" font-size="15" fill="#2d3748" text-anchor="middle">3</text>

    <!-- Dashed Line representing epsilon / 4 -->
    <line x1="40" y1="160" x2="250" y2="160" stroke="#2d3748" stroke-dasharray="3,3" stroke-width="1.2"/>
    <text x="25" y="152" font-family="Cambria Math, Georgia, serif" font-size="15" fill="#2d3748" text-anchor="middle">ε</text>
    <line x1="15" y1="156" x2="35" y2="156" stroke="#2d3748" stroke-width="1"/>
    <text x="25" y="174" font-family="Georgia, serif" font-size="14" fill="#2d3748" text-anchor="middle">4</text>

    <!-- Curly bracket representing 1 - epsilon -->
    <!-- M x y C cx1 cy1, cx2 cy2, x y -->
    <path d="M 142 60 C 152 60, 152 105, 158 105 C 152 105, 152 160, 142 160" fill="none" stroke="#2d3748" stroke-width="1.2"/>
    <text x="170" y="112" font-family="Cambria Math, Georgia, serif" font-size="15" fill="#2d3748">1 - ε</text>
  </g>
</svg>