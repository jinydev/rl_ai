<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Cyan Arrow Marker -->
    <marker id="cyan-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00bfff"/>
    </marker>
    <!-- Orange Arrow Marker -->
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Heatmap cells -->
    <!-- Row 0 -->
    <rect x="0" y="0" width="80" height="80" fill="#15803d" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="80" y="0" width="80" height="80" fill="#166534" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="160" y="0" width="80" height="80" fill="#14532d" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="240" y="0" width="80" height="80" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
    <!-- Row 1 -->
    <rect x="0" y="80" width="80" height="80" fill="#16a34a" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="80" y="80" width="80" height="80" fill="#2d3748" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="160" y="80" width="80" height="80" fill="#166534" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="240" y="80" width="80" height="80" fill="#14532d" stroke="#cbd5e0" stroke-width="1"/>
    <!-- Row 2 -->
    <rect x="0" y="160" width="80" height="80" fill="#22c55e" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="80" y="160" width="80" height="80" fill="#16a34a" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="160" y="160" width="80" height="80" fill="#15803d" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="240" y="160" width="80" height="80" fill="#166534" stroke="#cbd5e0" stroke-width="1"/>

    <!-- Outer Border -->
    <rect x="0" y="0" width="320" height="240" fill="none" stroke="#2d3748" stroke-width="2"/>

    <!-- Grid values text -->
    <g font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="end">
      <text x="74" y="18">0.81</text>
      <text x="154" y="18">0.90</text>
      <text x="234" y="18">1.00</text>
      <text x="314" y="18" fill="#2d3748">0.00</text>
      <text x="74" y="98">0.73</text>
      <text x="234" y="98">0.90</text>
      <text x="314" y="98">1.00</text>
      <text x="74" y="178">0.66</text>
      <text x="154" y="178">0.73</text>
      <text x="234" y="178">0.81</text>
      <text x="314" y="178">0.73</text>
    </g>

    <!-- Goal and Bomb texts -->
    <text x="280" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2d3748" text-anchor="middle">R 1.0 (GOAL)</text>
    <text x="280" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="middle">R -1.0</text>

    <!-- Thick Greedy Arrows -->
    <line x1="25" y1="40" x2="55" y2="40" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="105" y1="40" x2="135" y2="40" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="185" y1="40" x2="215" y2="40" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="40" y1="135" x2="40" y2="105" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="200" y1="135" x2="200" y2="105" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="280" y1="135" x2="280" y2="105" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="25" y1="200" x2="55" y2="200" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="105" y1="200" x2="135" y2="200" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="200" y1="215" x2="200" y2="185" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="295" y1="200" x2="265" y2="200" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
  </g>
</svg>