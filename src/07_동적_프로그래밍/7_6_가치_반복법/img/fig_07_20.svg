<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 40 22 C 26 15, 12 30, 20 50 C 24 64, 34 68, 40 64 C 46 68, 56 64, 60 50 C 68 30, 54 15, 40 22 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 40 22 Q 45 10 56 14" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 45 17 Q 55 12 56 22 C 52 24, 48 22, 45 17 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon -->
    <g id="agent80">
      <rect x="20" y="22" width="40" height="36" rx="14" ry="14" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="32" cy="34" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="48" cy="34" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="30" cy="34" r="3" fill="#2d3748"/>
      <circle cx="46" cy="34" r="3" fill="#2d3748"/>
      <path d="M 36 45 Q 40 49 44 45" fill="none" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 37 46 Q 40 52 43 46 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 24 58 C 24 56, 32 56, 32 58 C 32 60, 30 62, 27 62 C 22 62, 24 58, 24 58 Z" fill="#2d3748"/>
      <path d="M 48 58 C 48 56, 56 56, 56 58 C 56 60, 54 62, 51 62 C 46 62, 48 58, 48 58 Z" fill="#2d3748"/>
    </g>

    <!-- Bomb Icon -->
    <g id="bomb">
      <circle cx="40" cy="45" r="20" fill="#2d3748" stroke="#1a202c" stroke-width="2.5"/>
      <path d="M 50 29 Q 58 18 62 20" fill="none" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
      <path d="M 62 20 L 66 16 L 62 12 L 59 16 Z" fill="#f59e0b"/>
      <path d="M 58 12 L 64 6 M 70 14 L 76 12 M 64 22 L 70 26" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Cyan Arrow Marker -->
    <marker id="cyan-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00bfff"/>
    </marker>
    <!-- Blue Arrow Marker -->
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <!-- Orange Arrow Marker -->
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <!-- Small Arrow Marker for policy arrows -->
    <marker id="small-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
  </defs>
  <!-- Top: <평가> -->
  <text x="65" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748">〈평가〉</text>

  <!-- Grid 1 (첫 번째 갱신) -->
  <g transform="translate(65, 35)">
    <rect x="0" y="0" width="120" height="90" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
    
    <line x1="30" y1="0" x2="30" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="0" y1="30" x2="120" y2="30" stroke="#2d3748" stroke-width="1"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#2d3748" stroke-width="1"/>
    <rect x="30" y="30" width="30" height="30" fill="#2d3748"/>
    
    
    <line x1="15" y1="15" x2="105" y2="15" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="45" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="15" r="2.5" fill="#00bfff"/>
    
    <line x1="15" y1="45" x2="105" y2="45" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="45" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="45" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="45" r="2.5" fill="#00bfff"/>
    
    <line x1="15" y1="75" x2="105" y2="75" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="45" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="75" r="2.5" fill="#00bfff"/>
    
    <path d="M 105 15 L 17 43" stroke="#00bfff" stroke-width="0.8" stroke-dasharray="2,2"/>
    <path d="M 105 45 L 17 73" stroke="#00bfff" stroke-width="0.8" stroke-dasharray="2,2"/>
    
    <text x="60" y="112" font-family="sans-serif" font-size="12" fill="#2d3748" text-anchor="middle">첫 번째 갱신</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="195" y1="80" x2="220" y2="80" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Grid 2 (두 번째 갱신) -->
  <g transform="translate(230, 35)">
    <rect x="0" y="0" width="120" height="90" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
    
    <line x1="30" y1="0" x2="30" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="0" y1="30" x2="120" y2="30" stroke="#2d3748" stroke-width="1"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#2d3748" stroke-width="1"/>
    <rect x="30" y="30" width="30" height="30" fill="#2d3748"/>
    
    
    <line x1="15" y1="15" x2="105" y2="15" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="45" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="15" r="2.5" fill="#00bfff"/>
    
    <line x1="15" y1="45" x2="105" y2="45" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="45" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="45" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="45" r="2.5" fill="#00bfff"/>
    
    <line x1="15" y1="75" x2="105" y2="75" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="45" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="75" r="2.5" fill="#00bfff"/>
    
    <path d="M 105 15 L 17 43" stroke="#00bfff" stroke-width="0.8" stroke-dasharray="2,2"/>
    <path d="M 105 45 L 17 73" stroke="#00bfff" stroke-width="0.8" stroke-dasharray="2,2"/>
    
    <text x="60" y="112" font-family="sans-serif" font-size="12" fill="#2d3748" text-anchor="middle">두 번째 갱신</text>
  </g>

  <!-- Arrow 2 and Ellipsis -->
  <line x1="360" y1="80" x2="380" y2="80" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="395" cy="80" r="2" fill="#2d3748"/>
  <circle cx="405" cy="80" r="2" fill="#2d3748"/>
  <circle cx="415" cy="80" r="2" fill="#2d3748"/>
  <line x1="430" y1="80" x2="450" y2="80" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Grid 3 (n번째 갱신) - Cyan Background -->
  <g transform="translate(460, 35)">
    <rect x="0" y="0" width="120" height="90" fill="#a5f3fc" stroke="#2d3748" stroke-width="1.5"/>
    
    <line x1="30" y1="0" x2="30" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="0" y1="30" x2="120" y2="30" stroke="#2d3748" stroke-width="1"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#2d3748" stroke-width="1"/>
    <rect x="30" y="30" width="30" height="30" fill="#2d3748"/>
    
    
    <line x1="15" y1="15" x2="105" y2="15" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="45" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="15" r="2.5" fill="#00bfff"/>
    
    <line x1="15" y1="45" x2="105" y2="45" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="45" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="45" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="45" r="2.5" fill="#00bfff"/>
    
    <line x1="15" y1="75" x2="105" y2="75" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="45" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="75" r="2.5" fill="#00bfff"/>
    
    <path d="M 105 15 L 17 43" stroke="#00bfff" stroke-width="0.8" stroke-dasharray="2,2"/>
    <path d="M 105 45 L 17 73" stroke="#00bfff" stroke-width="0.8" stroke-dasharray="2,2"/>
    
    <text x="60" y="112" font-family="sans-serif" font-size="12" fill="#2d3748" text-anchor="middle">n번째 갱신</text>
  </g>

  <!-- Bottom: <개선> -->
  <g transform="translate(65, 205)">
    <text x="0" y="-10" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748">〈개선〉</text>
    <rect x="0" y="0" width="120" height="90" fill="#fef3c7" stroke="#2d3748" stroke-width="1.5"/>
    
    <line x1="30" y1="0" x2="30" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="90" stroke="#2d3748" stroke-width="1"/>
    <line x1="0" y1="30" x2="120" y2="30" stroke="#2d3748" stroke-width="1"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#2d3748" stroke-width="1"/>
    <rect x="30" y="30" width="30" height="30" fill="#2d3748"/>
    
    
    <line x1="15" y1="15" x2="105" y2="15" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="45" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="15" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="15" r="2.5" fill="#00bfff"/>
    
    <line x1="15" y1="45" x2="105" y2="45" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="45" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="45" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="45" r="2.5" fill="#00bfff"/>
    
    <line x1="15" y1="75" x2="105" y2="75" stroke="#00bfff" stroke-width="1"/>
    <circle cx="15" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="45" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="75" cy="75" r="2.5" fill="#00bfff"/>
    <circle cx="105" cy="75" r="2.5" fill="#00bfff"/>
    
    <path d="M 105 15 L 17 43" stroke="#00bfff" stroke-width="0.8" stroke-dasharray="2,2"/>
    <path d="M 105 45 L 17 73" stroke="#00bfff" stroke-width="0.8" stroke-dasharray="2,2"/>
    
  </g>

  <!-- Big feedback loops -->
  <!-- 1. From Grid 3 (Evaluation end) to Grid 4 (Improvement) -->
  <path d="M 520 160 C 500 250, 360 300, 200 270" fill="none" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- 2. From Grid 4 (Improvement) to Grid 1 (Evaluation start) -->
  <path d="M 55 250 C 15 220, 15 130, 50 95" fill="none" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>