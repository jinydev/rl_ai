    <line x1="120" y1="208" x2="120" y2="198" stroke="#2d3748" stroke-width="1.2" marker-end="url(#small-arrow)"/>
    <line x1="120" y1="212" x2="120" y2="222" stroke="#2d3748" stroke-width="1.2" marker-end="url(#small-arrow)"/>
    <line x1="118" y1="210" x2="108" y2="210" stroke="#2d3748" stroke-width="1.2" marker-end="url(#small-arrow)"/>
    <line x1="122" y1="210" x2="132" y2="210" stroke="#2d3748" stroke-width="1.2" marker-end="url(#small-arrow)"/>
    
    
