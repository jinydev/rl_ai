    <line x1="200" y1="208" x2="200" y2="198" stroke="#2d3748" stroke-width="1.2" marker-end="url(#small-arrow)"/>
    <line x1="200" y1="212" x2="200" y2="222" stroke="#2d3748" stroke-width="1.2" marker-end="url(#small-arrow)"/>
    <line x1="198" y1="210" x2="188" y2="210" stroke="#2d3748" stroke-width="1.2" marker-end="url(#small-arrow)"/>
    <line x1="202" y1="210" x2="212" y2="210" stroke="#2d3748" stroke-width="1.2" marker-end="url(#small-arrow)"/>
    
    
