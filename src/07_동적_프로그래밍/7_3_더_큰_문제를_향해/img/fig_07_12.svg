<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 40 22 C 26 15, 12 30, 20 50 C 24 64, 34 68, 40 64 C 46 68, 56 64, 60 50 C 68 30, 54 15, 40 22 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 40 22 Q 45 10 56 14" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 45 17 Q 55 12 56 22 C 52 24, 48 22, 45 17 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon -->
    <g id="agent80">
      <rect x="20" y="22" width="40" height="36" rx="14" ry="14" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="32" cy="34" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="48" cy="34" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="30" cy="34" r="3" fill="#2d3748"/>
      <circle cx="46" cy="34" r="3" fill="#2d3748"/>
      <path d="M 36 45 Q 40 49 44 45" fill="none" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 37 46 Q 40 52 43 46 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 24 58 C 24 56, 32 56, 32 58 C 32 60, 30 62, 27 62 C 22 62, 24 58, 24 58 Z" fill="#2d3748"/>
      <path d="M 48 58 C 48 56, 56 56, 56 58 C 56 60, 54 62, 51 62 C 46 62, 48 58, 48 58 Z" fill="#2d3748"/>
    </g>

    <!-- Bomb Icon -->
    <g id="bomb">
      <circle cx="40" cy="45" r="20" fill="#2d3748" stroke="#1a202c" stroke-width="2.5"/>
      <path d="M 50 29 Q 58 18 62 20" fill="none" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
      <path d="M 62 20 L 66 16 L 62 12 L 59 16 Z" fill="#f59e0b"/>
      <path d="M 58 12 L 64 6 M 70 14 L 76 12 M 64 22 L 70 26" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Axis Arrow Marker -->
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Cyan Arrow Marker -->
    <marker id="cyan-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00bfff"/>
    </marker>
    <!-- Blue Arrow Marker -->
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <!-- Orange Arrow Marker -->
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <!-- Small Arrow Marker for policy arrows -->
    <marker id="small-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Grid borders -->
    <rect x="0" y="0" width="320" height="240" fill="none" stroke="#2d3748" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="240" stroke="#2d3748" stroke-width="1.2"/>
    <line x1="160" y1="0" x2="160" y2="240" stroke="#2d3748" stroke-width="1.2"/>
    <line x1="240" y1="0" x2="240" y2="240" stroke="#2d3748" stroke-width="1.2"/>
    
    <line x1="0" y1="80" x2="320" y2="80" stroke="#2d3748" stroke-width="1.2"/>
    <line x1="0" y1="160" x2="320" y2="160" stroke="#2d3748" stroke-width="1.2"/>

    <!-- Horizontal paths with arrow marker in the middle -->
    <!-- Row 0 -->
    <line x1="40" y1="40" x2="280" y2="40" stroke="#00bfff" stroke-width="2"/>
    <line x1="40" y1="40" x2="165" y2="40" stroke="#00bfff" stroke-width="2" marker-end="url(#cyan-arrow)"/>
    
    <!-- Row 1 -->
    <line x1="40" y1="120" x2="280" y2="120" stroke="#00bfff" stroke-width="2"/>
    <line x1="40" y1="120" x2="165" y2="120" stroke="#00bfff" stroke-width="2" marker-end="url(#cyan-arrow)"/>

    <!-- Row 2 -->
    <line x1="40" y1="200" x2="280" y2="200" stroke="#00bfff" stroke-width="2"/>
    <line x1="40" y1="200" x2="165" y2="200" stroke="#00bfff" stroke-width="2" marker-end="url(#cyan-arrow)"/>

    <!-- Dashed diagonal return paths -->
    <path d="M 280 40 L 42 118" stroke="#00bfff" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#cyan-arrow)"/>
    <path d="M 280 120 L 42 198" stroke="#00bfff" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#cyan-arrow)"/>

    <!-- Cyan state dots -->
    <!-- Row 0 -->
    <circle cx="40" cy="40" r="6" fill="#00bfff"/>
    <circle cx="120" cy="40" r="6" fill="#00bfff"/>
    <circle cx="200" cy="40" r="6" fill="#00bfff"/>
    <circle cx="280" cy="40" r="6" fill="#00bfff"/>

    <!-- Row 1 -->
    <circle cx="40" cy="120" r="6" fill="#00bfff"/>
    <circle cx="120" cy="120" r="6" fill="#00bfff"/>
    <circle cx="200" cy="120" r="6" fill="#00bfff"/>
    <circle cx="280" cy="120" r="6" fill="#00bfff"/>

    <!-- Row 2 -->
    <circle cx="40" cy="200" r="6" fill="#00bfff"/>
    <circle cx="120" cy="200" r="6" fill="#00bfff"/>
    <circle cx="200" cy="200" r="6" fill="#00bfff"/>
    <circle cx="280" cy="200" r="6" fill="#00bfff"/>
  </g>
</svg>