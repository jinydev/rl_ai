<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa" rx="15" ry="15"/>
  <style>
    .title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
    .label { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4a5568; text-anchor: middle; }
    .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-style: italic; fill: #1a202c; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #cbd5e0; stroke-width: 1.5; rx: 8; ry: 8; }
    .circle-target { fill: #e2e8f0; stroke: #4a5568; stroke-width: 2; }
    .circle-bullseye { fill: #f56565; stroke: #c53030; stroke-width: 2; }
    .venn-s { fill: #edf2f7; stroke: #4a5568; stroke-width: 2; rx: 10; ry: 10; }
    .venn-a { fill: #ebf8ff; stroke: #3182ce; stroke-width: 2; }
  </style>

  <!-- Left: Venn Diagram (Mathematical & Complementary Probability) -->
  <g transform="translate(40, 40)">
    <rect class="venn-s" x="0" y="0" width="320" height="300"/>
    <text class="title" x="160" y="30" text-anchor="middle">수학적 확률과 여사건</text>
    
    <!-- Sample Space S -->
    <text class="label" x="30" y="280" text-anchor="start">표본공간 S</text>

    <!-- Event A -->
    <circle class="venn-a" cx="160" cy="160" r="70" />
    <text class="label" x="160" y="150" font-weight="bold">사건 A</text>
    <text class="math" x="160" y="180">P(A) = p</text>

    <!-- Complement A^c -->
    <text class="label" x="250" y="110" font-weight="bold">여사건 Aᶜ</text>
    <text class="math" x="250" y="140">1 - p</text>
  </g>

  <!-- Right: Geometric Probability (Target) -->
  <g transform="translate(440, 40)">
    <rect class="box" x="0" y="0" width="320" height="300" stroke="#cbd5e0" stroke-width="1.5" />
    <text class="title" x="160" y="30" text-anchor="middle">기하학적 확률</text>
    <text class="label" x="160" y="55" text-anchor="middle">면적의 비율로 정의되는 확률</text>

    <!-- Concentric Circles Target -->
    <circle class="circle-target" cx="160" cy="170" r="80" />
    <circle class="circle-bullseye" cx="160" cy="170" r="40" />

    <text class="label" x="160" y="165" fill="#ffffff" font-weight="bold">과녁 A</text>
    <text class="label" x="160" y="235" fill="#2d3748">전체 영역 S</text>

    <!-- Formula -->
    <rect class="box" x="40" y="255" width="240" height="35" fill="#f7fafc" stroke="#e2e8f0" />
    <text class="math" x="160" y="277">P(A) = Area(A) / Area(S)</text>
  </g>
</svg>
