<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 40 22 C 26 15, 12 30, 20 50 C 24 64, 34 68, 40 64 C 46 68, 56 64, 60 50 C 68 30, 54 15, 40 22 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 40 22 Q 45 10 56 14" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 45 17 Q 55 12 56 22 C 52 24, 48 22, 45 17 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon (Scaled for 80x80 cell) -->
    <g id="agent80">
      <rect x="20" y="22" width="40" height="36" rx="14" ry="14" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="32" cy="34" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="48" cy="34" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="30" cy="34" r="3" fill="#2d3748"/>
      <circle cx="46" cy="34" r="3" fill="#2d3748"/>
      <path d="M 36 45 Q 40 49 44 45" fill="none" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 37 46 Q 40 52 43 46 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 24 58 C 24 56, 32 56, 32 58 C 32 60, 30 62, 27 62 C 22 62, 24 58, 24 58 Z" fill="#2d3748"/>
      <path d="M 48 58 C 48 56, 56 56, 56 58 C 56 60, 54 62, 51 62 C 46 62, 48 58, 48 58 Z" fill="#2d3748"/>
    </g>

    <!-- Bomb Icon -->
    <g id="bomb">
      <circle cx="40" cy="45" r="20" fill="#2d3748" stroke="#1a202c" stroke-width="2.5"/>
      <!-- Fuse -->
      <path d="M 50 29 Q 58 18 62 20" fill="none" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
      <!-- Spark -->
      <path d="M 62 20 L 66 16 L 62 12 L 59 16 Z" fill="#f59e0b"/>
      <path d="M 58 12 L 64 6 M 70 14 L 76 12 M 64 22 L 70 26" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Axis Arrow Marker -->
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
  </defs>
  <!-- Axis Labels and Arrows -->
  <g transform="translate(60, 60)">
    <!-- Column labels -->
    <text x="40" y="-12" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">0</text>
    <text x="120" y="-12" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">1</text>
    <text x="200" y="-12" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">2</text>
    <text x="280" y="-12" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">3</text>
    
    <!-- Horizontal arrow -->
    <line x1="0" y1="-30" x2="300" y2="-30" stroke="#2d3748" stroke-width="1.8" marker-end="url(#axis-arrow)"/>
    <text x="315" y="-25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748">두 번째 축</text>

    <!-- Row labels -->
    <text x="-25" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">0</text>
    <text x="-25" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">1</text>
    <text x="-25" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">2</text>

    <!-- Vertical arrow -->
    <line x1="-50" y1="0" x2="-50" y2="220" stroke="#2d3748" stroke-width="1.8" marker-end="url(#axis-arrow)"/>
    <text x="-50" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">첫 번째 축</text>

    <!-- Grid table -->
    <rect x="0" y="0" width="320" height="240" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="240" stroke="#2d3748" stroke-width="1.5"/>
    <line x1="160" y1="0" x2="160" y2="240" stroke="#2d3748" stroke-width="1.5"/>
    <line x1="240" y1="0" x2="240" y2="240" stroke="#2d3748" stroke-width="1.5"/>
    
    <line x1="0" y1="80" x2="320" y2="80" stroke="#2d3748" stroke-width="1.5"/>
    <line x1="0" y1="160" x2="320" y2="160" stroke="#2d3748" stroke-width="1.5"/>

    <!-- Highlighted Cyan Cells -->
    <rect x="240" y="0" width="80" height="80" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="160" width="80" height="80" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- Values in cells -->
    <text x="40" y="46" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">0</text>
    <text x="120" y="46" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">0</text>
    <text x="200" y="46" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">0</text>
    <text x="280" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1.0</text>

    <text x="40" y="126" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">0</text>
    <text x="120" y="126" font-family="sans-serif" font-size="16" fill="#718096" text-anchor="middle">None</text>
    <text x="200" y="126" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">0</text>
    <text x="280" y="126" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">-1.0</text>

    <text x="40" y="206" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">0</text>
    <text x="120" y="206" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">0</text>
    <text x="200" y="206" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">0</text>
    <text x="280" y="206" font-family="sans-serif" font-size="16" fill="#2d3748" text-anchor="middle">0</text>

    <!-- Pointer annotations -->
    <path d="M 330 35 Q 370 30 395 38" fill="none" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="405" y="42" font-family="sans-serif" font-size="15" fill="#2d3748">(0, 3)</text>

    <path d="M 40 245 Q 60 280 85 285" fill="none" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="95" y="290" font-family="sans-serif" font-size="15" fill="#2d3748">(2, 0)</text>
  </g>
</svg>