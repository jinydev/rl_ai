<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 40 22 C 26 15, 12 30, 20 50 C 24 64, 34 68, 40 64 C 46 68, 56 64, 60 50 C 68 30, 54 15, 40 22 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 40 22 Q 45 10 56 14" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 45 17 Q 55 12 56 22 C 52 24, 48 22, 45 17 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon -->
    <g id="agent80">
      <rect x="20" y="22" width="40" height="36" rx="14" ry="14" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="32" cy="34" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="48" cy="34" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="30" cy="34" r="3" fill="#2d3748"/>
      <circle cx="46" cy="34" r="3" fill="#2d3748"/>
      <path d="M 36 45 Q 40 49 44 45" fill="none" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 37 46 Q 40 52 43 46 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 24 58 C 24 56, 32 56, 32 58 C 32 60, 30 62, 27 62 C 22 62, 24 58, 24 58 Z" fill="#2d3748"/>
      <path d="M 48 58 C 48 56, 56 56, 56 58 C 56 60, 54 62, 51 62 C 46 62, 48 58, 48 58 Z" fill="#2d3748"/>
    </g>

    <!-- Bomb Icon -->
    <g id="bomb">
      <circle cx="40" cy="45" r="20" fill="#2d3748" stroke="#1a202c" stroke-width="2.5"/>
      <path d="M 50 29 Q 58 18 62 20" fill="none" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
      <path d="M 62 20 L 66 16 L 62 12 L 59 16 Z" fill="#f59e0b"/>
      <path d="M 58 12 L 64 6 M 70 14 L 76 12 M 64 22 L 70 26" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Cyan Arrow Marker -->
    <marker id="cyan-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00bfff"/>
    </marker>
    <!-- Blue Arrow Marker -->
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <!-- Orange Arrow Marker -->
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <!-- Small Arrow Marker for policy arrows -->
    <marker id="small-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
  </defs>
  <!-- Top and bottom converging boundary lines -->
  <line x1="40" y1="40" x2="380" y2="160" stroke="#2d3748" stroke-width="2"/>
  <text x="150" y="55" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#2d3748" text-anchor="middle">V = v_μ</text>

  <line x1="40" y1="280" x2="380" y2="160" stroke="#2d3748" stroke-width="2"/>
  <text x="180" y="270" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#2d3748" text-anchor="middle">μ = greedy(V)</text>

  <!-- Final optimum node -->
  <circle cx="380" cy="160" r="5.5" fill="#2d3748"/>
  <text x="415" y="165" font-family="Georgia, serif" font-size="16" font-weight="bold" font-style="italic" fill="#2d3748" text-anchor="middle">v_*, μ_*</text>

  <!-- Starting point inside -->
  <circle cx="120" cy="150" r="4" fill="#2d3748"/>
  <text x="75" y="154" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2d3748">V, μ</text>

  <!-- Iteration Steps -->
  <!-- 1. Evaluation: up-left to top line -->
  <line x1="120" y1="150" x2="157" y2="87" stroke="#0284c7" stroke-width="1.8" marker-end="url(#blue-arrow)"/>
  <circle cx="160" cy="82" r="3.5" fill="#2d3748"/>

  <!-- 2. Improvement: down-right to bottom line -->
  <line x1="160" y1="82" x2="208" y2="220" stroke="#ea580c" stroke-width="1.8" marker-end="url(#orange-arrow)"/>
  <circle cx="210" cy="224" r="3.5" fill="#2d3748"/>

  <!-- 3. Evaluation: up-right to top line -->
  <line x1="210" y1="224" x2="258" y2="122" stroke="#0284c7" stroke-width="1.8" marker-end="url(#blue-arrow)"/>
  <circle cx="260" cy="118" r="3.5" fill="#2d3748"/>

  <!-- 4. Improvement: down-right to bottom line -->
  <line x1="260" y1="118" x2="298" y2="188" stroke="#ea580c" stroke-width="1.8" marker-end="url(#orange-arrow)"/>
  <circle cx="300" cy="192" r="3.5" fill="#2d3748"/>

  <!-- 5. Evaluation -->
  <line x1="300" y1="192" x2="328" y2="145" stroke="#0284c7" stroke-width="1.5" marker-end="url(#blue-arrow)"/>
  <circle cx="330" cy="142" r="3" fill="#2d3748"/>

  <!-- 6. Improvement -->
  <line x1="330" y1="142" x2="348" y2="170" stroke="#ea580c" stroke-width="1.5" marker-end="url(#orange-arrow)"/>
  <circle cx="350" cy="172" r="3" fill="#2d3748"/>

  <!-- Final Evaluation to convergence -->
  <line x1="350" y1="172" x2="375" y2="162" stroke="#0284c7" stroke-width="1.2" marker-end="url(#blue-arrow)"/>
</svg>