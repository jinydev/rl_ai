<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="100%" height="100%">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Cyan Arrow Marker -->
    <marker id="cyan-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00bfff"/>
    </marker>
    <!-- Orange Arrow Marker -->
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
  </defs>
  <!-- Top rounded container -->
  <rect x="20" y="15" width="480" height="65" rx="12" ry="12" fill="none" stroke="#2d3748" stroke-width="1.5"/>
  <text x="45" y="55" font-family="Cambria Math, Georgia, serif" font-size="18" fill="#2d3748">
    V'(s) = max<tspan font-size="12" dy="5">a</tspan><tspan font-size="18" dy="-5"> </tspan>
    <tspan font-size="24">∑</tspan><tspan font-size="12" dy="8">s'</tspan><tspan font-size="18" dy="-8"> </tspan>
    p(s'|s, a) { r(s, a, s') + γV(s') }
  </text>
  <text x="480" y="54" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ea580c" text-anchor="end">[식 4.11]</text>

  <!-- Down transition arrow -->
  <line x1="240" y1="90" x2="240" y2="125" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="112" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d3748">상태 전이가 결정적</text>

  <!-- Bottom rounded container -->
  <rect x="20" y="140" width="480" height="85" rx="12" ry="12" fill="none" stroke="#2d3748" stroke-width="1.5"/>
  <text x="45" y="172" font-family="Cambria Math, Georgia, serif" font-size="17" fill="#2d3748">s' = f(s, a) 일 때</text>
  <text x="45" y="202" font-family="Cambria Math, Georgia, serif" font-size="18" fill="#2d3748">
    V'(s) = max<tspan font-size="12" dy="5">a</tspan><tspan font-size="18" dy="-5"> </tspan>
    { r(s, a, s') + γV(s') }
  </text>
  <text x="480" y="202" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ea580c" text-anchor="end">[식 4.13]</text>
</svg>