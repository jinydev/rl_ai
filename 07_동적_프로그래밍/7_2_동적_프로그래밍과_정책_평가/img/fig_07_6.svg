<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <defs>
    <!-- Apple Icon -->
    <g id="apple">
      <path d="M 40 22 C 26 15, 12 30, 20 50 C 24 64, 34 68, 40 64 C 46 68, 56 64, 60 50 C 68 30, 54 15, 40 22 Z" fill="#fc4d4d" stroke="#2d3748" stroke-width="2.5"/>
      <path d="M 40 22 Q 45 10 56 14" fill="none" stroke="#684b35" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 45 17 Q 55 12 56 22 C 52 24, 48 22, 45 17 Z" fill="#4ade80" stroke="#2d3748" stroke-width="1"/>
    </g>
    
    <!-- Agent Icon (Scaled for 80x80 cell) -->
    <g id="agent80">
      <rect x="20" y="22" width="40" height="36" rx="14" ry="14" fill="#a0ecff" stroke="#2d3748" stroke-width="2.5"/>
      <circle cx="32" cy="34" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="48" cy="34" r="6" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
      <circle cx="30" cy="34" r="3" fill="#2d3748"/>
      <circle cx="46" cy="34" r="3" fill="#2d3748"/>
      <path d="M 36 45 Q 40 49 44 45" fill="none" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 37 46 Q 40 52 43 46 Z" fill="#ff7070" stroke="#2d3748" stroke-width="1"/>
      <path d="M 24 58 C 24 56, 32 56, 32 58 C 32 60, 30 62, 27 62 C 22 62, 24 58, 24 58 Z" fill="#2d3748"/>
      <path d="M 48 58 C 48 56, 56 56, 56 58 C 56 60, 54 62, 51 62 C 46 62, 48 58, 48 58 Z" fill="#2d3748"/>
    </g>

    <!-- Bomb Icon -->
    <g id="bomb">
      <circle cx="40" cy="45" r="20" fill="#2d3748" stroke="#1a202c" stroke-width="2.5"/>
      <!-- Fuse -->
      <path d="M 50 29 Q 58 18 62 20" fill="none" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
      <!-- Spark -->
      <path d="M 62 20 L 66 16 L 62 12 L 59 16 Z" fill="#f59e0b"/>
      <path d="M 58 12 L 64 6 M 70 14 L 76 12 M 64 22 L 70 26" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <!-- Axis Arrow Marker -->
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
  </defs>
  <!-- Left Side -->
  <g transform="translate(10, 10)">
    <!-- Top Table V -->
    <rect x="20" y="10" width="100" height="35" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
    <line x1="70" y1="10" x2="70" y2="45" stroke="#2d3748" stroke-width="1.8"/>
    <circle cx="45" cy="27" r="4.5" fill="#2d3748"/>
    <circle cx="95" cy="27" r="4.5" fill="#2d3748"/>
    <text x="135" y="32" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#2d3748">V</text>

    <!-- Bottom Table new_V -->
    <rect x="20" y="85" width="100" height="35" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
    <rect x="20" y="85" width="50" height="35" fill="#f59e0b"/>
    <line x1="70" y1="85" x2="70" y2="120" stroke="#2d3748" stroke-width="1.8"/>
    <text x="135" y="107" font-family="sans-serif" font-size="14" fill="#2d3748">new_V</text>

    <!-- Pointers -->
    <path d="M 45 32 L 45 85" fill="none" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 95 32 L 55 85" fill="none" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Transition Arrow -->
  <line x1="220" y1="75" x2="280" y2="75" stroke="#2d3748" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- Right Side -->
  <g transform="translate(250, 10)">
    <!-- Top Table V -->
    <rect x="20" y="10" width="100" height="35" fill="#ffffff" stroke="#2d3748" stroke-width="1.8"/>
    <line x1="70" y1="10" x2="70" y2="45" stroke="#2d3748" stroke-width="1.8"/>
    <circle cx="45" cy="27" r="4.5" fill="#2d3748"/>
    <circle cx="95" cy="27" r="4.5" fill="#2d3748"/>
    <text x="135" y="32" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#2d3748">V</text>

    <!-- Bottom Table new_V -->
    <rect x="20" y="85" width="100" height="35" fill="#f59e0b" stroke="#2d3748" stroke-width="1.8"/>
    <line x1="70" y1="85" x2="70" y2="120" stroke="#2d3748" stroke-width="1.8"/>
    <text x="135" y="107" font-family="sans-serif" font-size="14" fill="#2d3748">new_V</text>

    <!-- Pointers -->
    <path d="M 45 32 L 95 85" fill="none" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 95 32 L 105 85" fill="none" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
</svg>